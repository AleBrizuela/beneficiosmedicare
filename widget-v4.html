// A ZIP the CMS data does not cover is a dead end, not a filter problem. Let the
// customer correct it in place. The field starts EMPTY: re-submitting the same failed
// ZIP re-renders an identical screen, which reads as a broken button.
let _zipRetryMsg = '';
async function retryZip(){
  const el = document.getElementById('zip-retry');
  if(!el) return;
  const v = (el.value||'').replace(/\D/g,'').slice(0,5);
  if(v.length !== 5){
    _zipRetryMsg = lang==='en' ? 'Please enter all 5 digits.' : 'Escriba los 5 d\u00EDgitos.';
    flowResults(); return;
  }
  const prev = D.zip;
  D.zip = v; D.county = ''; D.city = ''; D._zipValid = undefined; PLANS = [];
  await loadPlansForZip(v);
  _zipRetryMsg = (D._zipValid === false)
    ? (lang==='en' ? `We still do not have plan data for ${v}. Try another ZIP, or call us.`
                   : `Tampoco tenemos datos para ${v}. Pruebe otro c\u00F3digo postal, o ll\u00E1menos.`)
    : '';
  flowResults();
}
function onZipInput(el, fieldId){
  el.value = el.value.replace(/\D/g,'').slice(0,5);
  D[fieldId] = el.value;
  if(el.value.length===5){
    D.zip = el.value;
    // Start loading plan data in background
    loadPlansForZip(el.value);
    setTimeout(()=>go(_cb.zip),300);
  }
}

/* T-100: the question is ONE line, always. At 19.5px it fits beside Volver in Spanish down to a 375
   phone; English is longer, so where it does not fit the type steps down half a pixel at a time, never
   below 16px. Below that (a 320 phone) the question takes its own line under Volver at full size, and
   only shrinks if even that line is too short. Measured, not guessed: the Open Sans webfont can land
   after the first draw, so this runs again when fonts are ready and whenever the frame changes width. */
function fitQ3(){
  const top=document.querySelector('#wb .q3top'), q=top&&top.querySelector('.q3q'); if(!q) return;
  top.classList.remove('q3wrap'); q.style.fontSize='';
  const over=()=>q.scrollWidth>q.clientWidth+0.5;
  let fs=parseFloat(getComputedStyle(q).fontSize);
  while(over()&&fs>16){ fs-=0.5; q.style.fontSize=fs+'px'; }
  if(!over()) return;
  top.classList.add('q3wrap'); q.style.fontSize='';
  fs=parseFloat(getComputedStyle(q).fontSize);
  while(over()&&fs>14){ fs-=0.5; q.style.fontSize=fs+'px'; }
}

/* T-132 B1/B2: "Revisar mi plan de hoy" and "Sin preferencia" are the two one-tap exits this screen
   always had -- unchanged behavior, just no longer sharing pickPri's old single-answer branch with
   the toggle. Any other option tap now only toggles D.priorities; "Ver mis planes" (q3GoPlans) is
   the only way those picks leave this screen. */
function pickPri(id){
  if(_priTimer) return;
  if(id==='myplan'){
    document.querySelectorAll('.q3opt').forEach(el=>el.classList.toggle('on',el.id==='pri-myplan'));
    // Not an order or a filter, so D.priorities is left as it was and the list behaves as before.
    wEvt('priority_pick',{priority:'myplan',on:true});
    _priTimer=setTimeout(()=>{
      _priTimer=null;
      // T-099 wires the real destination (flowMyPlan, "¿Qué plan tiene hoy?"); until it exists, log and stay here.
      if(typeof flowMyPlan==='function'){ go(flowMyPlan); return; }
      try{ console.info('[T-100] priority_pick=myplan: flowMyPlan() is not built yet (T-099)'); }catch(e){}
      restoreQ3OnStates();
    },400);
    return;
  }
  if(id===''){   // "Sin preferencia": clears every pick and goes straight on, as before
    D.priority=''; D.priorities=[];
    _priAuto=null; _priAppliedKey=null;   // a new answer sets the order and the filters once more
    resetListFilters('answer_change');
    wEvt('priority_pick',{priority:'none',on:true});
    go(_cb.priority);
    return;
  }
  const cur=Array.isArray(D.priorities)?D.priorities:(D.priorities=[]);
  const at=cur.indexOf(id), on=at<0;
  if(on) cur.push(id); else cur.splice(at,1);
  D.priority=screenFirstPri();   // legacy single-value readers (SUG_SHORT, askLine) get the screen-first pick
  const el=document.getElementById('pri-'+id); if(el) el.classList.toggle('on',on);
  wEvt('priority_pick',{priority:id,on:on});
  const go3=document.getElementById('q3go');
  if(go3) go3.classList.toggle('show',cur.length>0);
  placeQ3Go();
}
function restoreQ3OnStates(){
  const cur=Array.isArray(D.priorities)?D.priorities:[];
  document.querySelectorAll('.q3opt').forEach(el=>{
    const id=el.id.replace(/^pri-/,'');
    el.classList.toggle('on',id!=='myplan'&&cur.indexOf(id)>=0);
  });
}
/* T-132 B1: the only way picks on this screen reach the plan list. Opens with whatever the picks
   already set via applyPriority()/flowResults() -- same destination pickPri() used to jump to after
   its 400ms "you picked this" pause, now a deliberate tap instead of an auto-advance timer. */
let _priAppliedKey=null;
function q3GoPlans(){
  const pr=Array.isArray(D.priorities)?D.priorities:[];
  if(!pr.length) return;
  // B4: screen order, not pick order, for both the key and telemetry.
  const screenPr=PRI_OPTIONS.map(o=>o.id).filter(id=>pr.indexOf(id)>=0);
  const key=screenPr.join('+');
  // B8: the lead sheet's existing "priority" column (D.priority, sent wholesale by sendLead(D)) gets
  // this same "+"-joined set -- no new column. Internal readers (sugLine, suggestPlan, saidMedicaid)
  // already read D.priorities/screenFirstPri(), not this string, so widening it here is safe.
  D.priority=key;
  // B7: "Volver ... keeps the picks ticked (today a new answer resets the list; keep that reset
  // only when the picks change)" -- tapping "Ver mis planes" with the SAME set already applied (a
  // visitor who went back to look, changed nothing, and came forward again) must not wipe the chips,
  // carrier and sort they had set on the list.
  if(key!==_priAppliedKey){
    _priAppliedKey=key;
    _priAuto=null;   // a changed set of picks sets the order and filters once more
    resetListFilters('answer_change');
  }
  wEvt('priority_submit',{priorities:key});
  go(_cb.priority);
}
// T-104 (6) (AB 2026-10-18): picking a different answer, or Volver-ing back onto the question
// screen, clears every chip, the carrier and the sort back to the answer's default, and drops the
// ticked plans -- a visitor who leaves the list/compare loop for the question starts clean. Coming
// back to the list from Compare or a plan screen is NOT this: nothing here runs on a plain back()
// into the list, so those filters and ticks are left exactly as the visitor set them.

  _carriers=[];_planTypes.clear(); _carOpen=false; _foOpen=false; _sortMode='premium'; selPlans=[]; _priDropMsg=null;
  wEvt('filter_reset',{reason:reason});
}

// No scoring and no "Your Result / Lowest Cost / Added Benefits / High Rating" labels (T-017,
// PROTECT 2026-10-02): ranking plans for a person from their answers is advice that needs a
// licensed agent and a Scope of Appointment. The public list is the same for everyone in the
// county, in a neutral order the visitor chooses.
// T-088 (AB 2026-10-15) does not change that. The visitor picks ONE criterion by name on the
// previous screen ("Pagar $0 de prima"), the list is put in that order and nothing else, the sort
// bar says which criterion it used, and any filter it switched on is named and comes off in one
// tap. No plan carries a label, no two criteria are blended into a score, and no plan is called
// best or recommended. It is the same sort menu the visitor could reach here, answered earlier.
// Card, results and compare follow the mockups AB approved for staging on 2026-10-02:
// DECIDE/now/2026-10-02_widget-2027-card-mockup.html, ..._results-mockup.html,
// ..._missing-and-compare-mockup.html (T-017 b2-b13).
function orderedPlans(){ return sortPlans(filterByType(PLANS), _sortMode); }

/* NO WIDOWS (AB's standing rule): join the last two words of a label, a name or a value with a
   non-breaking space, so a line can never end up holding one word on its own. Only from three
   words up -- gluing a two-word label would make it unbreakable and push the column sideways,
   which is worse than the widow. Markup is left alone: a string with a tag in it is skipped. */
function nbLast(x){
  // T-103: a plan ID inside a name ("Giveback H5619-146") never splits at its hyphen, which left "146" alone
  const t=String(x==null?'':x).replace(/\b([A-Z]\d{4})-(\d{3})\b/g,'$1‑$2');
  if(/[<>]/.test(t)){
    /* T-104: a value with markup in it ("hasta <b>$500 al año</b>, ambos oídos") gets the same rule on its
       TEXT: the last space outside any tag becomes non-breaking. A tag is never touched. */
    if(t.replace(/<[^>]*>/g,' ').trim().split(/\s+/).length<3) return t;
    let inTag=false;
    for(let i=t.length-1;i>0;i--){
      const c=t[i];
      if(c==='>'){inTag=true;continue;} if(c==='<'){inTag=false;continue;} if(inTag) continue;
      if(c===' '){ const after=t.slice(i+1).replace(/<[^>]*>/g,''); if(/\S/.test(after)) return t.slice(0,i)+'\u00a0'+t.slice(i+1); }
    }
    return t;
  }
  const w=t.trim().split(/\s+/);
  if(w.length<3) return t;
  return t.replace(/\s+(\S+)\s*$/, '\u00a0$1');
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const L=(en,es)=>lang==='en'?en:es;
// T-143 (AB + DECIDE 2026-10-25): a recognizable share icon next to every "Compartir"/"Share" word,
// never alone (older visitors read words, an icon alone is a guess). Device picks the icon ONCE on
// load, not per render, so it never flips mid-session: iPhone/iPad/Mac get the "box with an up arrow"
// people already know from iOS/macOS share sheets; everyone else (Android, Windows, other) gets the
// three-connected-dots icon from Android's own share affordance. aria-hidden stays on the svg -- the
// word next to it is still the accessible label, this is decoration only.
let _shrIconCache=null;
function shrIcon(){
  if(_shrIconCache) return _shrIconCache;
  const ios=/iPhone|iPad|iPod|Macintosh|Mac OS/.test(navigator.userAgent);
  _shrIconCache=ios
    ? '<svg class="shrico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></s'+'vg>'
    : '<svg class="shrico" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="18" cy="5" r="2.8"/><circle cx="6" cy="12" r="2.8"/><circle cx="18" cy="19" r="2.8"/><path d="M8.3 10.7l7.4-4.1M8.3 13.3l7.4 4.1" stroke="currentColor" stroke-width="1.8" fill="none"/></s'+'vg>';
  return _shrIconCache;
}
function planYear(){return (_planMeta&&_planMeta.year)||PLAN_FILE_YEAR;}
function usd(v,cents){
  if(v===null||v===undefined) return null;
  const o=cents?{minimumFractionDigits:2,maximumFractionDigits:2}:{maximumFractionDigits:2};
  return (v<0?'-$':'$')+Math.abs(v).toLocaleString('en-US',o);
}
// Monthly premium: "$0" when zero, otherwise to the cent ("$45.00"), as CMS publishes it.
function premUsd(v){return v===null||v===undefined?null:(v===0?'$0':usd(v,true));}
// CMS cost strings from the plan file ("$1495", "$0-$100", "$10 / 20%"): thousands separators,
// ranges in words. Escaped first; the strings come from a public CMS file.
function money(s){
  if(s===null||s===undefined||s==='') return null;
  return esc(s).replace(/\d{4,}(?:\.\d+)?/g,m=>{const p=m.split('.');return p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',')+(p[1]?'.'+p[1]:'');})
    .replace(/(\$[\d,.]+|[\d.]+%)-(\$[\d,.]+|[\d.]+%)/g,(_,a,b)=>a+L(' to ',' a ')+b);
}
function isZero(s){return s==='$0'||s==='$0.00'||s==='0%';}
const NOINC=()=>L('Not included','No incluido');
function noInfo(){return L('No information','Sin información');}
const OPTX=()=>L('Optional, extra premium','Opcional, con prima adicional');
const PERW={mo:['a month','al mes'],'3mo':['every 3 months','cada 3 meses'],'6mo':['every 6 months','cada 6 meses'],
  yr:['a year','al año'],'2y':['every 2 years','cada 2 años'],'3y':['every 3 years','cada 3 años']};
const PERS={mo:['/mo','/mes'],'3mo':['/3 mo','/3 meses'],'6mo':['/6 mo','/6 meses'],yr:['/yr','/año'],'2y':['/2 yrs','/2 años'],'3y':['/3 yrs','/3 años']};
function perw(p){const w=PERW[p];return w?' '+L(w[0],w[1]):'';}
// A dollar maximum CMS publishes, always with its period: "up to $150 a year". No amount -> null, never a guess.
function upTo(a,bold){if(!a||a.amt==null) return null;const v=usd(a.amt)+perw(a.per);return L('up to ','hasta ')+(bold===false?v:'<b>'+v+'</b>');}
const EAR={per:[' per ear',' por oído'],both:[', both ears',', ambos oídos'],one:[', one ear',', un oído']};
function ear(e){const w=EAR[e];return w?L(w[0],w[1]):'';}

// CMS Overall Star Rating (T-053). CMS published the 2027 ratings on 2026-10-08, in data tables of
// their own; the landscape file the rest of the card is built from was cut before that and leaves the
// star column blank, which is why this line read "aun no publicada" while Medicare.gov already showed
// stars. A plan with no rating now says WHICH of CMS's two reasons applies rather than implying the
// whole year is unpublished. Never carry 2026 stars onto a 2027 plan.
const STARNA={'new':['Too new to be rated','Plan nuevo, sin calificación'],
              'few':['Not enough data to rate','Sin calificación suficiente']};
function rStar(p){
  if(p.rating===null||p.rating===undefined){
    const w=STARNA[p.ratingNA];
    return w?L(w[0],w[1]):L('CMS rating: not published','Calificación CMS: no publicada');
  }
  return '★ '+p.rating+L(' of 5 (CMS ',' de 5 (CMS ')+planYear()+')';
}
// CMS lists a contract as low-performing after three years under 3 stars, and Medicare.gov then drops
// the number and shows a warning in its place. We show both: hiding the number would be less than
// Medicare.gov gives, and showing it alone would be less than Medicare.gov warns.
function rLow(p){
  if(!p.ratingLow) return '';
  return `<div class="pc-low">${L('Medicare has rated this plan below 3 stars three years in a row.',
    'Medicare ha calificado este plan por debajo de 3 estrellas tres años seguidos.')}</div>`;
}
// T-086 (3) asked for this line "Spanish fully Spanish". Its frame always was; the source string the
// CMS data file carries was not — "data last updated" and "released" came through in English on the
// Spanish site. CMS's own file names are proper nouns and stay exactly as they are; only those two
// connectives are translated, so no fact, date or name changes.
function srcText(src){
  return lang==='en'?src:String(src).replace(/data last updated/gi,'datos actualizados el').replace(/released/gi,'publicado el');
}
/* T-105 (6): Comparar and the shared page say the source in one line,

const SRC_ONE_LINE_PROTECT_OK=true;

// 42 CFR 422.2267(e)(33): wherever Star Ratings appear, say Medicare rates plans yearly on a 5-star system.
// Missing from T-053 star ratings (live 2026-10-14 13:04); added with T-060 (7207816) at 22:10. T-069 rolls

// ---- benefit text, ES + EN. CMS PBP category names, one fixed translation (T-017 b4) ----
function hospText(h,short){
  if(!h) return null;
  let s;
  if(h.mc) s=L('Same as Original Medicare','Igual que Medicare Original');
  else if(h.days){
    const nz=h.days.filter(d=>!isZero(d[0])), z=nz.length<h.days.length;
    if(!nz.length) s=short?'$0':'<b>$0</b> '+L('per stay','por estadía');
    else if(short) s=nz.map(d=>`${money(d[0])}${L('/day','/día')}, ${L('days','días')} ${d[1]}-${d[2]}`).join(' · ');
    else s=nz.map(d=>`<b>${money(d[0])} ${L('per day','por día')}</b>, ${L('days','días')} ${d[1]} ${L('to','a')} ${d[2]}`).join(' · ')+(z?` · <b>$0</b> ${L('other days','los demás días')}`:'');
  } else if(h.stay) s=short?(isZero(h.stay)?'$0':money(h.stay)+' '+L('per stay','por estadía')):`<b>${money(h.stay)}</b> ${L('per stay','por estadía')}`;
  else return null;
  if(h.vary) s+=' '+L('(varies by hospital)','(varía según el hospital)');

function tripsText(tr,short){
  if(tr===false) return null;          // not offered
  if(!tr) return undefined;            // unknown
  if(tr.unl) return L('Unlimited trips','Viajes ilimitados');
  if(tr.n==null) return L('Included','Incluido');
  const one=tr.n===1;
  if(short) return tr.n+' '+L(one?'trip':'trips',one?'viaje':'viajes')+perw(tr.per);
  const kind=tr.tt==='round'?L(one?'round trip':'round trips',one?'viaje de ida y vuelta':'viajes de ida y vuelta')
                            :L(one?'one-way trip':'one-way trips',one?'viaje de ida':'viajes de ida');
  return '<b>'+tr.n+' '+kind+perw(tr.per)+'</b>';
}
// Each returns {t:text, off:bool} or null when the plan file has no record (shown as "No information").
function dentalB(p,short){
  const d=p.dent; if(!d) return null;
  if(!d.prev&&!d.comp) return {t:p.dental==='optional'?OPTX():NOINC(),off:true};
  if(short) return {t:d.prev&&d.comp?L('Preventive and comprehensive','Preventivo e integral'):(d.prev?L('Preventive','Preventivo'):L('Comprehensive','Integral')),off:false};
  if(d.prev&&d.comp&&!d.pmax&&!d.cmax) return {t:L('Preventive and comprehensive dental','Dental preventivo e integral'),off:false};
  const parts=[];
  if(d.prev) parts.push(L('Preventive dental','Dental preventivo')+(d.pmax?' '+upTo(d.pmax):''));
  if(d.comp) parts.push(L('Comprehensive dental','Dental integral')+(d.cmax?' '+upTo(d.cmax):''));
  return {t:parts.join(' · '),off:false};

// Medicamentos (open part). b6b: one column ("standard pharmacy") or two (standard / preferred),
// never mixed, never an empty tier. b17: a plan without Part D says so in one line.
function tiersHTML(p){return lsec('drug',L('Drugs','Medicamentos'),tiersBody(p));}
function tiersBody(p){
  if(p.drug!=='Included') return `<p class="nod">${L('This plan does not include drug coverage (Part D).','Este plan no incluye medicamentos (Parte D).')}</p>`;
  const t=p.tiers||[];
  if(!t.length){
    const msg=p.dbt==='1'?L('Medicare standard design: 25% after the deductible.','Diseño estándar de Medicare: 25% después del deducible.'):`<i>${noInfo()}</i>`;
    return `<p class="nod">${msg}</p>`;
  }
  const two=t.some(x=>x.p!=null);
  const cell=v=>v==null?(two?`<span class="lv2 off">–</span>`:`<span class="lv na">${noInfo()}</span>`)
                         :`<span class="${two?'lv2':'lv'}${isZero(v)?' z':''}">${money(v)}</span>`;
  const head=two?`<div class="lr th"><span class="ll"></span><span class="lv2">${L('Standard','Estándar')}</span><span class="lv2">${L('Preferred','Preferida')}</span></div>`:'';
  const rows=t.map(x=>`<div class="lr"><span class="ll"><span class="tn">${x.t}</span>${tierName(x)}</span>${cell(x.v)}${two?cell(x.p):''}</div>`).join('');
  const fine=[];
  if(p.ins) fine.push(L(`Insulin: at most ${money(p.ins)} a month.`,`Insulina: máximo ${money(p.ins)} al mes.`));
  if(p.ded>0&&p.noded&&p.noded.length){
    const n=p.noded.map(String);
    fine.push(L(`The ${usd(p.ded)} drug deductible does not apply to tier${n.length>1?'s':''} ${andList(n)}.`,
                `El deducible de medicamentos de ${usd(p.ded)} no aplica ${n.length>1?'a los niveles':'al nivel'} ${andList(n)}.`));
  }
  if(two&&t.some(x=>x.v==null||x.p==null)) fine.push(L('– = not in the CMS file for this plan.','– = no figura en el archivo de CMS para este plan.'));
  // T-052: 3-month supply by mail, per tier, as CMS lists it (standard mail; preferred mail in brackets when the plan has one).
  const ml=t.filter(x=>x.m3!=null).map(x=>`${L('tier','nivel')} ${x.t} ${money(x.m3)}${x.m3p!=null&&x.m3p!==x.m3?' ('+L('preferred','preferida')+' '+money(x.m3p)+')':''}`);
  if(ml.length) fine.push(`<b>${L('By mail, 3 months:','Por correo, 3 meses:')}</b> ${ml.join(' · ')}`);
  return `<div class="subt">${two?L('(1 month, standard or preferred pharmacy)','(1 mes, farmacia estándar o preferida)'):L('(1 month, standard pharmacy)','(1 mes, farmacia estándar)')}</div>
    ${head}${rows}${fine.map(f=>`<p class="pc-fine">${f}</p>`).join('')}`;
}

// T-112 (2): the quiet line under a card's OWN checkbox when it is the only one ticked -- the

function cmpHint(p){

const TOG=()=>[L('See all benefits','Ver todos los beneficios'),L('See less','Ver menos')];

function fineBlock(notes,net,short){
  const nl=net?L("The exact network rules are in each plan's Evidence of Coverage.",
    'Las reglas exactas de la red están en la Evidencia de Cobertura de cada plan.'):'';
  const inner=(notes||[]).filter(Boolean).map(x=>`<p>${nbLast(x)}</p>`).join('')

function provNoteHTML(short){const t=provenanceNote(short);return t?`<p class="psrc">${esc(t)}</p>`:'';}

// Back from a plan screen returns to the list AND to the card the visitor opened, not to the top (T-075).
// This widget cannot do it alone: the host embeds it with scrolling="no" and the PAGE is what scrolls, so
// scrollIntoView in here moves nothing (T-073 measured the card stuck at 801px of an 812 viewport at 60, 80,
// 260 and 600ms). So we hand the host the card's offset and let it scroll, via 'widget-scrollto'.
// The height goes WITH the offset on purpose. At this moment the frame is still the short plan screen's
// height -- the ResizeObserver's 'widget-resize' has not been delivered, and the host animates height over
// 0.3s when it is -- so the page is not yet tall enough to scroll that far. One message carrying both lets
// the host grow the frame and scroll in the same breath, and no ordering between the two can race.
function backToPlans(){
  _afterBack=_scrollToCard;
  back();
}
function _scrollToCard(){
  if(window.self===window.top) return;
  const wrap=document.querySelector('.widget-wrap');
  const card=_lastPlanId?document.querySelector('.pc[data-pid="'+(window.CSS&&CSS.escape?CSS.escape(_lastPlanId):_lastPlanId)+'"]'):null;
  if(!wrap||!card){ window.parent.postMessage({type:'widget-scrolltop'},'*'); return; }  // card gone: top of the list, as before
  // Both rects are read in the iframe's own viewport, which never scrolls, so this is the card's offset
  // from the top of the widget however the host page happens to be scrolled.
  const top=Math.max(0,Math.round(card.getBoundingClientRect().top-wrap.getBoundingClientRect().top));
  window.parent.postMessage({type:'widget-scrollto',top:top,height:Math.round(wrap.offsetHeight)},'*');
}
/* The comparison's open level, for one plan. Same three groups, same rows, same order, same
   label-over-value shape -- so "Ver detalles" and "Comparar" never disagree about what a plan is.
   Every value comes from the same helpers the table uses. */
function dRow(label,v){
  if(v===undefined) return '';
  let cls='',txt;
  // T-111 (4): a grey dash, never a blank -- only for a field CMS genuinely has no information on;
  // v.off (e.g. "No drug coverage") is real information, not a gap, and keeps its own text.
  if(!v){cls='na';txt='–';}
  else{cls=v.off?'off':(v.z||isZero(String(v.t).replace(/<[^>]+>/g,'').trim())?'z':'');txt=v.t;}
  return `<div class="drow"><div class="dl">${nbLast(label)}</div><div class="dv${cls?' '+cls:''}">${nbLast(txt)}</div></div>`;
}
function dSec(icon,title){return `<div class="dsec"><svg viewBox="0 0 24 24">${PIC[icon]}</s`+`vg>${title}</div>`;}
function detailLevel(p){
  const isMA=p.cat!=='PDP', drug=p.drug==='Included';
  const V2=t=>({t,off:false});
  let out=dSec('cost',L('Costs','Costos'))+
    dRow(L('Monthly premium','Prima mensual'),p.premium==null?null:V2(premUsd(p.premium)))+
    (isMA?dRow(L('Part B premium reduction','Reducción de la prima de la Parte B'),gbV(p.gb)):'')+
    (isMA?dRow(L('Medical deductible','Deducible médico'),mdedV(p.mded)):'')+
    (isMA?dRow(L('Max out-of-pocket','Máximo de bolsillo'),p.moop==null?null:V2(usd(p.moop))):'')+
    dRow(L('Drug deductible','Deducible de medicamentos'),
      drug?(p.ded==null?null:V2(usd(p.ded))):{t:L('No drug coverage','Sin medicamentos'),off:true});
  if(isMA){
    out+=dSec('visits',L('Visits','Consultas'))+
      dRow(L('Primary doctor','Médico primario'),vz(p.pcp))+
      dRow(L('Specialist','Especialista'),vz(p.spec))+
      dRow(L('Emergency room','Emergencias'),vz(p.er))+
      dRow(L('Urgent care','Urgencias'),vz(p.urg));
    out+=dSec('star',L('Extra benefits','Beneficios extra'))+
      dRow('Dental',dentalB(p,true))+
      dRow(L('Eyewear','Anteojos'),visionB(p,true))+
      dRow(L('Hearing aids','Audífonos'),hearingB(p,true))+
      dRow('OTC',otcB(p,true))+
      dRow(L('Fitness','Ejercicio'),fitB(p));
  }
  return `<div class="ls nohead">${out}</div>`;
}
// The two things CMS cannot answer, on the screen where a visitor is deciding.
function dCallRow(){
  const TEL='(310) 597\u20119142';
  return `<div class="dcall"><svg viewBox="0 0 24 24">${PIC.visits}</s`+`vg><span>${
    L('Your doctors and medicines? I will confirm this plan covers them:','¿Sus médicos y medicamentos? Le confirmo si este plan los cubre:')
  } <a href="tel:+13105979142" onclick="wEvt('phone_click',{placement:'plan_detail'})">${TEL}</a></span></div>`;
}
function planDetail(id){
  const p=PLANS.find(x=>x.id===id); if(!p){flowResults();return;}
  _planScreen=true;   // T-084: ticked plans keep the compare bar at the bottom of this screen too
  _onDetail=true;     // T-093: the browser's Back from here lands on the card, like "‹ Volver"
  const can=leadOK()&&!(D.state&&!_rep)&&(p._medigap||p.agent)&&!p.sanction;
  // with nothing ticked, THIS plan is the main action of this screen
  _act=can?{id:'plan:'+p.id,label:L('Help me choose','Ayúdeme a elegir')}:null;
  let body,gap=false;
  if(p._medigap){
    const rng=usd(Math.round(p._pmin))+L('\u00a0to\u00a0','\u00a0a\u00a0')+usd(Math.round(p._pmax));
    // T-091: a Medigap plan screen opens like its card too -- the same two tiles under COSTOS.
    body=`<div class="ls cost hdr"><div class="lh"><svg class="hi" viewBox="0 0 24 24">${PIC.cost}</s`+`vg>${L('Costs','Costos')}</div></div>`
      +`<div class="pc-keys k2">${kTile(rng+`<small>${L('/mo','/mes')}</small>`,KL('Premium','range','Rango de','prima'))}${kTile(esc(carrierName(p.carrier)),KL('Lowest price','from','Precio más','bajo de'),'word')}</div>`
      +`<div class="ls undr"><p class="pc-fine">${L('Covers gaps in Original Medicare. Drug coverage needs a separate Part D plan.','Cubre costos que Medicare Original no cubre. Para medicamentos necesita un plan de la Parte D aparte.')}</p>
      <p class="pc-fine">${L('Medigap prices: Medicare.gov, March 2026. Not 2027 prices.','Precios Medigap: Medicare.gov, marzo de 2026. No son precios de 2027.')}</p></div>`;
  } else {
    body=detailLevel(p)+dCallRow();
  }
  // T-103 (7): "Ver todos los cambios" -- when this is the plan the visitor has today (Mi plan de hoy),
  // the 2026|2027 verdict + table sits right under the header, Costos only (see mp26v27Block's note).
  const mpBlock=(_mpCtx&&_mpCtx.cur27&&_mpCtx.cur27.id===p.id&&_mpCtx.cur26)?mp26v27Block(_mpCtx.cur26,_mpCtx.cur27):'';
  // T-111 (2): a key-figures strip under the plan name, same three tiles as the list card, so the
  // top of "Ver detalles" is never empty. Medigap already has its own 2-tile strip inline in `body`.
  const keys=p._medigap?'':keyStrip(p);
  wb().innerHTML=`<div class="bkrow">${bk(L('\u2039 Back to the list','\u2039 Volver a la lista'),'backToPlans()')}</div>
    <div class="pc" style="--cc:${p._medigap?'var(--cbar-brand)':carrierColor(p)}">${planHead(p,true,true)}
      ${cmpHint(p)}
      ${keys}
      ${gap?`<p class="nodet">${L('CMS has not published benefit details for this plan.','CMS no publicó el detalle de beneficios de este plan.')}</p>`:''}
      ${mpBlock}
      ${body}
      ${can?`<button class="pd-cta" onclick="pickPlan('${esc(p.id)}')">${L('Help me choose','Ayúdeme a elegir')}</button>`
           :(p.sanction?`<p class="plan-flag warn">${L('CMS sanction, see','Sanción de CMS, consulte')} <a href="https://www.medicare.gov" target="_blank" rel="noopener">Medicare.gov</a></p>`
                       :`<p class="plan-flag">${L('Information only','Solo información')}</p>`)}
      ${planFine(p)}</div>

}
// ── T-079 (AB 2026-10-15): "the better TOP view for the COSTOS information". The three numbers
// that decide whether a plan is worth opening sit side by side in one band instead of stacked as
// three labelled rows: same CMS fields, same figures, a third of the height. keyStrip() is the
// parked build's (cd832f6), adapted to T-073's short card and made to hold at 320px.
// The period moves from the value into the label ("$0" + "Prima mensual", not "$0/mes"), and the
// max-out-of-pocket label drops "(en la red)"; the full wording stays on the plan screen.
// Max out-of-pocket uses NON-BREAKING hyphens (\u2011) in English so it can only break at the
// space -- "Max out-" / "of-pocket" would break a word, which this project does not do.
/* T-079 round 2 (AB 2026-10-15, "OCD"): every label under a number is exactly TWO lines, with the
   break written in, so the three tiles line up at 320, 375, 390 and on desktop instead of one tile
   dropping a line and pushing its neighbours' baselines apart. The Medigap pair gets the same
   treatment for the same reason. text-wrap and balancing are off here: the break is ours. */
function KL(en1,en2,es1,es2){return lang==='en'?`${en1}<br>${en2}`:`${es1}<br>${es2}`;}
function kTile(v,l,o){
  o=o||'';
  return `<div class="pc-key${o==='zero'?' zero':''}"><div class="v${o==='na'||o==='word'?' '+o:''}">${v}</div><div class="l">${l}</div></div>`;
}
// A figure, or "Sin información" when CMS published none for this plan. Never blank.
function kNum(v,l){return v==null?kTile(noInfo(),l,'na'):kTile(v,l,v==='$0'?'zero':'');}
/* T-101 (2): the FIRST tile is the figure the list is ordered by, in teal (CSS above). Ordered by
   drug deductible ("Mis medicamentos") -> the deductible comes first; every other order -> the
   monthly premium, as before ("$0 de prima" filters on it, and it is the default order). */
function keyStrip(p){
  const isMA=p.cat!=='PDP', drug=p.drug==='Included';
  const prem=kNum(p.premium==null?null:premUsd(p.premium),KL('Monthly','premium','Prima','mensual'));
  // a drug-only plan has no medical out-of-pocket maximum: CMS publishes none, so neither do we
  const moop=isMA?kNum(p.moop==null?null:usd(p.moop),KL('Max out‑of‑','pocket','Máximo de','bolsillo'))
                 :kTile('—',KL('Max out‑of‑','pocket','Máximo de','bolsillo'),'word');
  const ded=drug?kNum(p.ded==null?null:usd(p.ded),KL('Drug','deductible','Deducible','medicamentos'))
                :kTile(L('None','Ninguno'),KL('Drug','deductible','Deducible','medicamentos'),'word');
  return `<div class="pc-keys">`+(_sortMode==='ded'?ded+prem+moop:prem+moop+ded)+`</div>`;
}
/* T-089 (AB 2026-10-15): the Comparar box is on the plan screen too, in the same place in the same
   header, so a plan can be added to the comparison where it is being read instead of going back to
   find its card. One list, selPlans, so a tick here is a tick on the card and the other way round,
   and the same "up to 3" message appears on either screen. `detail` keeps the plan screen's own
   header spacing; it no longer doubles as "this header has no checkbox". */
function planHead(p,selectable,detail){
  // T-104 amendment (AB 2026-10-19, CARD GAP): name, pill, ID and stars must form ONE left column
  // that starts at the top and lays out on its own, never pushed down by the Compare button's
  // height. Previously the pill/ID/stars were siblings of .pc-top rather than children of its left
  // div, so they started below the WHOLE .pc-top row (whose height is the max of the name and the
  // taller Compare button) instead of right under the name -- a one-line name (Imperial Dynamic,
  // SCAN Prime) left a visible gap that a two- or three-line name did not. Nesting them inside the
  // left div makes their position depend only on the name's own height, never the button's.
  const body=`${sameCarrier(p)?'':`<p class="pc-eb">${esc(carrierName(p.carrier))}</p>`}<p class="pc-name">${nbLast(esc(dispName(p)))}</p>
      ${planTags(p)}
      ${p._medigap?'':`<div class="pc-idline">${L('Plan ID: ','ID del plan: ')}<span class="pid">${planId(p)}</span></div>`}
      <div class="pc-rating">${rStar(p)}</div>${rLow(p)}`;
  return `<div class="pc-head${detail?' pd-head':''}">
      ${_pin&&p.id===_pin?`<div class="pc-top mprow"><span class="mpchip navy">${L('YOUR PLAN TODAY','SU PLAN HOY')}</span>${selectable?cmpBox(p):''}</div>
      ${body}`
      :`<div class="pc-top"><div>${body}</div>${selectable?cmpBox(p):''}</div>`}
      </div>`;
}
function detBtn(p){

}
/* T-096 round 5 d: the whole card opens the plan. The Comparar box keeps its own tap -- it is a

function cardTap(e,id){

function planCard(p,selectable){

  const withPin=(_pin&&p.id!==_pin)?`<button class="pc-withpin" onclick="cmpWithPin(event,'${esc(p.id)}')">${L('Compare with my plan','Comparar con mi plan')}</button>`:'';

function cmpWithPin(e,id){

// ---- lead context: which plans the visitor saw, and whether we represent each (T-017 b8, e) ----
// ── T-074 (AB 2026-10-14): the card header says what kind of plan it is in a pill, and prints the
// official plan ID on its own line. The "Plan 2027" chip is gone: the year is already in the results
// header, the compare header and the CMS source line, and it said nothing a visitor could act on.
// baseType strips the SNP suffix CMS writes into the type ("HMO C-SNP" -> "HMO").
function baseType(p){return String(p.type||'').replace(/\s*[CDI]-SNP\s*/g,'').trim();}
function snpWho(p){
  if(!isSNP(p)) return null;
  if(p.snp==='Dual-Eligible') return L('With '+mcd(),'Con '+mcd());
  if(p.snp==='Institutional') return L('Care facility','Centro de cuidado');
  if(p.snp) return L('Chronic condition','Condición crónica');
  return null;
}
// Grey pill: a plan that is not Medicare Advantage with drugs says so in one word.
function plainTag(p){
  if(p._medigap) return L('Supplement','Suplemento');
  if(isPDP(p)) return L('Drugs only','Solo medicamentos');
  if(p.cat!=='PDP'&&p.drug!=='Included') return L('No drug coverage','Sin medicamentos');
  return null;
}
function planTags(p){
  const out=[];
  if(!p._medigap&&!isPDP(p)) out.push(`<span class="tg tg-net">${esc(baseType(p))}</span>`);
  const who=snpWho(p); if(who) out.push(`<span class="tg tg-who">${esc(who)}</span>`);
  const pl=plainTag(p); if(pl) out.push(`<span class="tg tg-plain">${esc(pl)}</span>`);
  return out.length?`<div class="pc-tags">${out.join('')}</div>`:'';
}
// Strip a trailing parenthetical when EVERY word in it is already said by the pills.
// "Blue Shield Value Advantage Plan (HMO)" -> "...Plan"  ·  "X (HMO D-SNP)" -> "X"
// A parenthetical with anything else stays. DISPLAY ONLY: p.name is what goes to the sheet,
// the lead payload, D.selectedPlan and the agent email.
const _TYPEWORDS=['HMO','PPO','POS','HMO-POS','PFFS','MSA','SNP','C-SNP','D-SNP','I-SNP','LOCAL','REGIONAL'];
/* T-094 (AB 2026-10-15): "do these need the word Plan in them? I want to clean all views."
   Three display-only rules, in order. The official CMS name is untouched everywhere it has to be
   exact -- the data, the lead payload, D.selectedPlan, the agent email and the PDF all keep p.name.
     1. the type in brackets goes (T-074, unchanged below);
     2. a trailing "Plan" goes: "Blue Shield Value Advantage Plan" -> "Blue Shield Value Advantage";
     3. in the compare header ONLY, where the carrier is already printed above the name in its own
        colour, the leading words that repeat it go: "Imperial Dynamic" under IMPERIAL -> "Dynamic".
   Nothing is ever cut below two words, and nothing is cut at all if it would leave two plans in the
   county reading the same. The plan ID line is on every card, header and column, so a plan stays
   identifiable whatever its name is shortened to. */
function dispName(p){
  const n=String(p.name||''), m=n.match(/^(.*?)\s*\(([^()]+)\)\s*$/);
  let base=n;
  if(m){

    if(words.length&&words.every(w=>_TYPEWORDS.indexOf(w)>=0)) base=m[1].trim();
  }
  return keep2(base.replace(/\s+Plan\s*$/i,'').trim(), base);

// Never leave fewer than two words: "Dynamic" alone is a word, "Imperial Dynamic" is a plan.
function keep2(short,full){return short.split(/\s+/).filter(Boolean).length>=2?short:full;}
/* The carrier, short enough to sit above a one-third-wide column. CMS keeps the legal name
   ("Imperial Health Plan of California, Inc."); the corporate tail is what a visitor skips. */
const _CARR_CUT=/[\s,]*(Inc\.?|LLC|Life Insurance Company|Mutual Automobile Insurance Company|Insurance Company|Healthcare of California|Health Plan of California|Health Plan|Partnership Plan|Advantage Plan|of California|Medicare|Health)$/i;
/* T-096 round 4 h: CMS writes "Champion Heath Plan" for H6170. We show the name correctly and do
   not touch the CMS file -- the plan ID, which is what identifies it, is unchanged. */
const CARRIER_FIX={'Champion Heath Plan':'Champion Health Plan'};
function carrierName(c){return CARRIER_FIX[String(c||'').trim()]||c;}
function carrierShort(c){
  c=carrierName(c);
  let t=String(c||'').trim(), prev=null;
  while(t!==prev&&t.split(/\s+/).length>1){prev=t;t=t.replace(_CARR_CUT,'').replace(/[\s,]+$/,'').trim();}
  return t||String(c||'').trim();
}
// Does the plan's own name already say who sells it? Then the eyebrow line above it is the same
// words twice, and the carrier colour stripe still tells the cards apart (AB: "less is more").
function sameCarrier(p){
  const c=carrierShort(p.carrier).toLowerCase();
  return !!c&&dispName(p).toLowerCase().startsWith(c);
}
/* Compare header only. The repeat to remove is the longest run of leading words the plan name and
   the carrier's own name share, word for word -- "Alignment Health Plan" + "Alignment Health BRIDGE
   003" share two, so the column reads "BRIDGE 003", not "Health BRIDGE 003". Then we give words back
   one at a time until at least two are left, which is how "Aetna Medicare Prime" under AETNA comes
   out as "Medicare Prime" rather than a bare "Prime". */
function _words(x){return String(x||'').trim().split(/\s+/).filter(Boolean);}
/* The repeat to remove is the longest run of leading words the plan name shares with the carrier's
   own name -- "Alignment Health Plan" + "Alignment Health BRIDGE 003" share two, so the column
   reads "BRIDGE 003", not "Health BRIDGE 003". "Medicare" is never counted as one of the carrier's
   words: it is the product, not the brand, which is why "Aetna Medicare Prime" under AETNA comes
   out as "Medicare Prime" and not a bare "Prime". One word is allowed here and only here, because
   the carrier is printed directly above it in its own colour; the cards, which no longer carry that
   line, keep the two-word floor. */
const _PUNC=/[.,]/g;
function _carrWords(c){return _words(String(c||'').replace(_PUNC,'')).filter(w=>!/^(medicare|inc|llc)$/i.test(w));}
function _cmpCut(p){
  const nw=_words(dispName(p)), cw=_carrWords(p.carrier);
  let k=0;
  while(k<cw.length&&k<nw.length&&nw[k].replace(_PUNC,'').toLowerCase()===cw[k].toLowerCase()) k++;
  return k>=nw.length?'':nw.slice(k).join(' ');
}
function cmpName(p){
  // T-104: a name that ends in its own plan ID ("Gold Plus Giveback H5619-146") drops it here only: the ID is
  // printed on the line right under it, and in a third of a phone it was being cut mid-ID.
  const id=planIdRaw(p), cut=n=>{const w=_words(n);return w.length>2&&w[w.length-1].toUpperCase()===id.toUpperCase()?w.slice(0,-1).join(' '):n;};
  const full=cut(dispName(p)), short=cut(_cmpCut(p));
  if(!short||short===full) return full;
  // Two plans in this county reading the same short name is worse than one long one.
  return PLANS.some(q=>q.id!==p.id&&(_cmpCut(q)===short||dispName(q)===short))?full:short;
}
function planLeadTag(p){return `${p.name} [${p.id}] represented: ${p._medigap?'n/a (Medigap)':(p.rep?'yes':'no')}`;}
function pickPlan(id){
  const p=PLANS.find(x=>x.id===id); if(!p) return;
  if(!p._medigap&&!p.agent) return;   // sanctioned, unlicensed state, or carrier list unavailable: no lead capture
  if(p._medigap&&(!leadOK()||(D.state&&!_rep))) return;
  D.selectedPlan=p.name; D.selectedPlanId=p.id;
  D.plansSeen=planLeadTag(p); D.represented=p._medigap?'n/a':(p.rep?'yes':'no');
  wEvt('widget_plan_select',{step:'card'});
  go(planEnroll);
}

// ── FILTER PILLS (b14) ── one pill selected at a time. "Todos" = every plan that is not a
// special-needs plan (LA County: 70 = 64 HMO incl. HMO-POS + 6 PPO). Special-needs plans appear
// only under their own pill. Drug-only plans (PDP) and Medigap get their own pill, shown only
// where the ZIP has them, so a visitor looking for one can still find it.
let _typeFilter='all';
function isSNP(p){return !p._medigap&&(p.cat==='SNP'||!!p.snp||/SNP/.test(p.type||''));}
function isPDP(p){return !p._medigap&&p.cat==='PDP';}

function isDual(p){return isSNP(p)&&p.snp==='Dual-Eligible';}

   the name on their card, not the federal one. Four states run Medicaid under a name of their own
   and California's is universally known; everywhere else the word IS Medicaid, and a managed-care
   brand like STAR+PLUS is not what anyone calls the card, so those states stay plain.
   mcd() is the one place this is decided, and every screen reads it. */
const MCD_NAMES={CA:'Medi\u2011Cal', AZ:'AHCCCS', KS:'KanCare', MO:'MO\u00a0HealthNet', OK:'SoonerCare'};
function mcd(){return MCD_NAMES[D.state]||'Medicaid';}

   California does not need it; a Medicaid state would be saying the same word twice. */
function mcdBoth(){

}
function saidMedicaid(){return D.priority==='medicaid'||(Array.isArray(D.priorities)&&D.priorities.indexOf('medicaid')>=0);}
const PILLS=[
  {id:'all',  en:'All',                  es:'Todos',                  f:inTodos},
  {id:'hmo',  en:'HMO',                  es:'HMO',                    f:p=>inTodos(p)&&/HMO/.test(p.type||'')},
  {id:'ppo',  en:'PPO',                  es:'PPO',                    f:p=>inTodos(p)&&/PPO/.test(p.type||'')},
  {id:'zero', en:'$0 premium',           es:'$0 prima',               f:p=>inTodos(p)&&p.premium===0},
  {id:'dsnp', en:()=>'With '+mcd(),       es:()=>'Con '+mcd(),         f:isDual},
  {id:'snp',  en:'Other special needs',  es:'Otras necesidades especiales', f:p=>isSNP(p)&&!isDual(p)},
  {id:'pdp',  en:'Drug plans only (Part D)', es:'Solo medicamentos (Parte D)', f:isPDP, opt:true},
  {id:'supp', en:'Medigap',              es:'Medigap',                f:p=>!!p._medigap, opt:true},

// T-088: two filters that sit ON TOP of the type pill, so "Tengo Medi-Cal" and "Pagar $0 de prima"
// can both be on at once. Both are off by default, so with no filter on, the list and every pill
// count are exactly what they were before this ticket.
let _zeroOnly=false, _drugOnly=false;
// T-104 (7) (AB 2026-10-18): PPO and HMO stay ONE group (mutually exclusive, still via _typeFilter).
// "Solo medicamentos", "Con Medi-Cal" and "Necesidades especiales" used to share that same single
// slot, so picking one silently dropped another. They are now three independent toggles that
// combine freely with each other and with PPO/HMO: with none on, the base set is "Todos" (as
// today); with one or more on, the base set is the UNION of the categories that are on (so
// "Solo medicamentos" + "Con Medi-Cal" shows Part-D-only plans together with dual-SNP plans, not
// just one or the other), still narrowed by whichever of PPO/HMO is active.
let _pdpOnly=false, _dsnpOnly=false, _snpOnly=false;
function hasDrug(p){return !p._medigap&&p.drug==='Included';}
function categoryOK(p){
  if(_pdpOnly||_dsnpOnly||_snpOnly) return (_pdpOnly&&isPDP(p))||(_dsnpOnly&&isDual(p))||(_snpOnly&&isSNP(p)&&!isDual(p));
  // While "Medicamentos cubiertos" is on and no category chip is on, "Todos" means every plan that
  // covers drugs, so the standalone Part D plans belong in it too (the ticket: MAPD + PDP).
  return inTodos(p)||(_drugOnly&&isPDP(p));
}
// T-109: plan type (HMO, PPO, HMO-POS...) is its own MULTI-select group -- any number on at once,
// OR'd together -- replacing the old single-slot "PPO/HMO, pick one" rule from T-104(7). Medigap
// ('supp') is a different category entirely, untouched, still its own single switch.
let _planTypes=new Set();
function networkOK(p){
  if(_typeFilter==='supp') return !!p._medigap;
  if(_planTypes.size) return _planTypes.has(baseType(p));
  return true;
}
function extrasOK(p){return (!_zeroOnly||p.premium===0)&&(!_drugOnly||hasDrug(p))&&carOK(p);}
function filterByType(plans){return plans.filter(p=>categoryOK(p)&&networkOK(p)&&extrasOK(p));}
// How many plans WOULD show if the chip named by `over` were also turned on, combined with every
// OTHER filter exactly as it stands now -- the "what tapping this would leave" convention every
// chip's count already followed for zero/drug; ppo/hmo/pdp/dsnp/snp now follow it too.
function countWith(over){
  const o=Object.assign({typeFilter:_typeFilter,pdp:_pdpOnly,dsnp:_dsnpOnly,snp:_snpOnly},over);
  return PLANS.filter(p=>{
    const cat=(o.pdp||o.dsnp||o.snp)
      ? ((o.pdp&&isPDP(p))||(o.dsnp&&isDual(p))||(o.snp&&isSNP(p)&&!isDual(p)))
      : (inTodos(p)||(_drugOnly&&isPDP(p)));
    const net=o.typeFilter==='ppo'?/PPO/.test(p.type||''):o.typeFilter==='hmo'?/HMO/.test(p.type||''):o.typeFilter==='supp'?!!p._medigap:true;
    return cat&&net&&extrasOK(p);

// T-028 + T-088: the answer to "¿Qué es lo más importante para usted?" sets the order and the
// filters ONCE per ZIP, the first time the plans are shown. After that the visitor's own pills and
// sort stick; a new answer, or a new ZIP, sets them again. The FIRST option ticked decides the
// order; every ticked option that is a filter switches that filter on. Nothing is ever hidden
// silently: the line under the sort bar names each filter and undoes it in one tap, and if our own
// pre-filter would leave an empty list we drop it and show everything.
let _priAuto=null, _priDropMsg=null;
const PRI_SORT={doctors:'doctors',cost:'moop',drugs:'ded',benefits:'dvh',medicaid:'mcd'};
// T-132 B3: priority id -> {on filter flag, chip key, CHIP_LBL key, "any plans" test}.
const PRI_FILT={
  cost:    {k:'zero', test:()=>PLANS.some(p=>inTodos(p)&&p.premium===0)},
  drugs:   {k:'drug', test:()=>PLANS.some(hasDrug)},
  medicaid:{k:'dsnp', test:()=>PLANS.some(isDual)}

function setPriFilter(k,v){ if(k==='zero')_zeroOnly=v; else if(k==='drug')_drugOnly=v; else if(k==='dsnp')_dsnpOnly=v; }
function applyPriority(){
  if(!PLANS.length||_priAuto===D.zip) return;
  _priAuto=D.zip; _carriers=[];_planTypes.clear(); _carOpen=false; _priDropMsg=null;   // T-101: a new ZIP or a new answer starts with every carrier
  const pr=Array.isArray(D.priorities)?D.priorities:[];

  // B3: turn on every picked filter, together (AND) -- pick order, since that is also drop order.

  // list is non-empty or there is nothing left to drop; never silent -- _priDropMsg says which
  // filter(s) were dropped and which ones are still on, and reuses the chip row's one-tap undo.
  const triedKeys=applied.map(a=>a.k), droppedKeys=[];
  while(applied.length&&!filterByType(PLANS).length){
    const dropped=applied.pop();
    setPriFilter(dropped.k,false);
    droppedKeys.push(dropped.k);
    _priDropMsg={triedKeys,droppedKeys:[...droppedKeys],keptKeys:applied.map(a=>a.k)};
  }
  // B4: the order is screen position, not tap order -- first-picked-on-screen decides, ties fall to
  // the next picked-on-screen answer, then always CMS rating. Replaces the old PRI_SORT[pr[0]] rule.
  const screenPr=PRI_OPTIONS.map(o=>o.id).filter(id=>pr.indexOf(id)>=0);
  if(screenPr.some(id=>PRI_SORT[id])) _sortMode='priority';
  wEvt('priority_sort',{priority:screenPr.join('+')||'',sort:_sortMode,
    filters:[(_zeroOnly?'zero':''),(_drugOnly?'drug':''),(_dsnpOnly?'dsnp':'')].filter(Boolean).join('+')||'none'});
}
/* The "Todos / HMO / PPO / ..." pill row and the chip that cleared one filter both went with round
   5: the three chips and the Orden y más filtros panel do the same job in fewer taps. PILLS itself
   stays -- it is the filter PREDICATES, which the chips, the panel and filterByType all read. */

// ── SORT (b14 "Orden B") ── neutral, visitor-chosen orders. Default: lowest monthly premium, then
// lowest max out-of-pocket (b10). Never favours plans we represent.
let _sortMode='premium';
function sortModes(){
  /* T-104 (3) (AB 2026-10-18): the panel lists the orders in the order the question screen asks: the five
     answers (médicos, medicamentos, Medi-Cal, $0 de prima, dental / vista / audición), each row being the
     order that answer sets (PRI_SORT), then the order "Sin preferencia" gives, which is also the default
     and has to stay reachable, then CMS stars, then name A-Z. The words say what the order IS, never that
     a plan is better (T-088). The Medi-Cal row is always there now, named, so nobody meets an order
     nobody asked for without its name. Sorting by CMS stars is AB's own ask in this ticket (the T-053
     condition for switching it back on). */
  return [
    {id:'doctors', en:'Doctor network: PPO first', es:'Red de médicos: PPO primero'},
    {id:'ded',     en:'Lowest drug deductible',   es:'Deducible de medicamentos más bajo'},
    {id:'mcd',     en:`For ${mcd()}: CMS rating first`, es:`Para ${mcd()}: calificación CMS primero`},
    {id:'moop',    en:'Lowest max out-of-pocket', es:'Máximo de bolsillo más bajo'},
    {id:'dvh',     en:'Dental, vision and hearing first', es:'Dental, vista y audición primero'},
    {id:'premium', en:'Lowest monthly premium',   es:'Prima mensual más baja'},
    {id:'star',    en:'Highest stars first',       es:'Más estrellas primero'},
    {id:'name',    en:'Name A-Z',                 es:'Nombre A-Z'},
  ];
}
/* T-096 round 4 c (AB: "can the order drawer HIDE after selected"): one tap applies the choice AND
   closes the drawer, and the list goes back to the top so the new first plan is what they see. */
function setSort(v){wEvt('sort_change',{sort:v});_sortMode=v;_shown=PAGE;_foOpen=false;_carOpen=false;flowResults();toTop();}
function toTop(){
  try{
    if(window.self!==window.top){window.parent.postMessage({type:'widget-scrolltop'},'*');return;}
    const h=document.querySelector('.rh'); if(h) h.scrollIntoView({block:'start'});
  }catch(e){}
}
// Unknown values (null) always sort last; ties fall back to plan name so the order is stable.
function _asc(x,y){const a=(x===null||x===undefined)?Infinity:x, b=(y===null||y===undefined)?Infinity:y; return a===b?0:(a<b?-1:1);}
// T-088 helpers. "Seguir con mis médicos": plan type is the only network fact in the CMS file, and
// we do not look anyone's doctor up -- PPO first, then HMO-POS, then HMO, cheapest inside each.
// "Dental, vista y audición": plans covering all three first, then the largest dental allowance CMS
// publishes, converted to a year so a /3 meses figure and a /año figure compare honestly.
const _NETRANK=p=>{const ty=String(p.type||'');return /PPO/.test(ty)?0:(/POS/.test(ty)?1:(/HMO/.test(ty)?2:3));};
const _PERY={mo:12,'3mo':4,'6mo':2,yr:1,'2y':.5,'3y':1/3};
const _amtY=a=>(a&&a.amt!=null)?a.amt*(_PERY[a.per]||1):null;
function _dentAmt(p){const d=p.dent;if(!d)return null;const v=[_amtY(d.cmax),_amtY(d.pmax)].filter(x=>x!=null);return v.length?Math.max.apply(null,v):null;}
function hasDent(p){return !!(p.dent&&(p.dent.prev||p.dent.comp));}
function hasVis(p){return !!(p.vis&&(p.vis.exam||p.vis.wear));}
function hasHear(p){return !!(p.hear&&(p.hear.exam||p.hear.aids));}
function _dvh3(p){return (hasDent(p)&&hasVis(p)&&hasHear(p))?0:1;}
/* T-101 (5): the tie-breaks are mock v9 section 5's rule table, column "Ordena por (en este orden)",
   exactly as DECIDE/now/2026-10-17_logica-y-plan-de-hoy/2026-10-17_logic-test.py implements it
   (the ticket's test): a row's own keys, then the plan name. Nothing is blended into a score: each
   key decides only when every key before it is tied. Unknown values (null) sort last, never as $0.
   NOT applied: the note under the table ("Empates en todas las filas: estrellas, prima, máximo,
   nombre"). The script and the mock's own PROPUESTA frame both break a full tie by name -- in 90230
   "Mis medicamentos" that puts Alignment 008 (3.5 stars) second, as the frame shows; the note would
   put Clever Care Longevity (4.5) there. If AB wants the note: stars, premium, max before each nm.
     moop    ($0 de prima)       max out-of-pocket, drug deductible, stars
     ded     (Mis medicamentos)  drug deductible, tier-1 copay, premium, max out-of-pocket
     mcd     (Tengo Medi-Cal)    stars, yearly dental allowance (highest), max out-of-pocket
     doctors (Mis médicos)       PPO -> HMO-POS -> HMO, max out-of-pocket, stars
     dvh     (Dental, vista...)  covers all three, dental (highest), hearing aids (highest), premium
     premium (Sin preferencia)   premium, max out-of-pocket -- the list as it was */
function _t1(p){
  const t=(p.tiers||[])[0]; if(!t||t.v==null) return null;
  const v=String(t.v); if(/%/.test(v)) return null;          // coinsurance is not a copay figure
  const n=parseFloat(v.replace(/[$,\s]/g,'')); return isNaN(n)?null:n;
}
function _hearAmt(p){const a=p.hear&&p.hear.amax;return (a&&a.amt!=null)?a.amt:null;}
const _neg=x=>x==null?null:-x;
// Medigap entries carry placeholder 0s for MOOP/deductible: they have neither, so they sort as unknown.
// Named _sDD/_sMO/_sST (not _dd/_mo/_st) -- suggestPlan()/sugLine() below declare their own top-level
// _dd/_mo/_st with a different null-convention (Infinity/-1, not null); same script, so same names twice is a SyntaxError.
const _sDD=p=>p._medigap||p.drug!=='Included'?null:p.ded, _sMO=p=>p._medigap||p.cat==='PDP'?null:p.moop;
const _sST=p=>_neg(p.rating);
function sortPlans(plans, mode){
  const s=[...plans], nm=(a,b)=>String(a.name).localeCompare(String(b.name));
  const dd=_sDD, mo=_sMO, st=_sST;
  if(mode==='moop')      s.sort((a,b)=>_asc(mo(a),mo(b))||_asc(dd(a),dd(b))||_asc(st(a),st(b))||nm(a,b));
  else if(mode==='ded')  s.sort((a,b)=>_asc(dd(a),dd(b))||_asc(_t1(a),_t1(b))||_asc(a.premium,b.premium)||_asc(mo(a),mo(b))||nm(a,b));
  else if(mode==='mcd')  s.sort((a,b)=>_asc(st(a),st(b))||_asc(_neg(_dentAmt(a)),_neg(_dentAmt(b)))||_asc(mo(a),mo(b))||nm(a,b));
  else if(mode==='star') s.sort((a,b)=>_asc(a.rating==null?null:-a.rating,b.rating==null?null:-b.rating)||_asc(a.premium,b.premium)||nm(a,b));
  else if(mode==='name') s.sort((a,b)=>String(dispName(a)).localeCompare(String(dispName(b)),lang,{sensitivity:'base',numeric:true})||nm(a,b));   // T-104 (3)
  else if(mode==='doctors') s.sort((a,b)=>_asc(_NETRANK(a),_NETRANK(b))||_asc(mo(a),mo(b))||_asc(st(a),st(b))||nm(a,b));
  else if(mode==='dvh')  s.sort((a,b)=>_asc(_dvh3(a),_dvh3(b))||_asc(_neg(_dentAmt(a)),_neg(_dentAmt(b)))||_asc(_neg(_hearAmt(a)),_neg(_hearAmt(b)))||_asc(a.premium,b.premium)||nm(a,b));
  else if(mode==='priority') s.sort(priorityComparator(Array.isArray(D.priorities)?D.priorities:[]));
  else                   s.sort((a,b)=>_asc(a.premium,b.premium)||_asc(mo(a),mo(b))||nm(a,b));

}
/* T-132 B4 (AB 2026-10-23): "should most common things go up top?" -- yes, and the order a visitor
   sees IS the order the question screen lists its options in, every time: the first-picked answer
   (by screen position, not tap order) decides first, a tie falls to the NEXT picked answer (again by
   screen position), and a tie through every picked answer always falls to CMS rating, then name.
   Replaces the single-sortMode precedence list and the "Medi-Cal always first" special case --
   Medi-Cal is just the last option on screen now, and wins ties on rating like everything else. */
const PRI_KEY={doctors:_NETRANK, cost:_sMO, drugs:_sDD, benefits:_dvh3, medicaid:_sST};
function priorityComparator(pr){
  const screenOrder=PRI_OPTIONS.map(o=>o.id).filter(id=>pr.indexOf(id)>=0&&PRI_KEY[id]);
  const nm=(a,b)=>String(a.name).localeCompare(String(b.name));
  return (a,b)=>{
    for(const id of screenOrder){ const k=PRI_KEY[id]; const r=_asc(k(a),k(b)); if(r) return r; }

function loadCms2026(st){
  if(_cms26[st]) return Promise.resolve(_cms26[st]);

    .then(r=>{if(!r.ok) throw new Error('no file');return r.text();})
    .then(s=>{const i=s.indexOf('{'), j=s.lastIndexOf('}');const d=JSON.parse(s.slice(i,j+1));

      Object.keys(d.plans).forEach(k=>{const a=d.plans[k];if(Array.isArray(a))a.forEach(p=>{if(p&&p.name)p.name=properName(p.name);});});

    .then(r=>{const ct=(r.headers.get('content-type')||'');

      if(r.ok&&ct.indexOf('json')===-1){_xw27[st]=null;return null;}

/* ── T-096 round 3c: which of the compared plans we point at, and why ──────────────────────────

   already on this screen. It is not a score and not a ranking of the county: the same three plans
   with the same answer always produce the same line, and the line only repeats figures that are in

   called best or recommended, and the reason to call is the part CMS cannot answer.
   AB 2026-10-15 wrote the rule itself; it is transcribed here, not invented. */
const SUG_SHORT={cost:()=>L('$0 premium','$0 de prima'),doctors:()=>L('keeping your doctors','seguir con sus médicos'),
  drugs:()=>L('your medicines','sus medicamentos'),benefits:()=>L('dental, vision and hearing','dental, vista y audición'),
  medicaid:()=>mcd()};

const _dd=p=>(p.drug!=='Included'||p.ded==null)?Infinity:p.ded;
const _dent=p=>{const v=_dentAmt(p);return v==null?-1:v;};
// T-132 B5 (AB 2026-10-23): "the same rule" as the list order (B4) -- the highest picked answer
// on screen decides, a tie falls to the next picked answer, then CMS rating. Replaces the old
// one-answer-at-a-time branches (which each ended the same way: the metric, then rating, then
// out-of-pocket) with one chain built from however many answers were picked, in screen order.
function suggestPlan(plans){
  if(plans.length<2) return null;
  const pr=Array.isArray(D.priorities)?D.priorities:(D.priority?[D.priority]:[]);
  const screenOrder=PRI_OPTIONS.map(o=>o.id).filter(id=>pr.indexOf(id)>=0&&(id==='medicaid'||PRI_KEY[id]));
  // T-101 (6), mock v9 section 5 "Sin preferencia": with no answer there is nothing to suggest FROM,
  // and "the best rating and the lowest cost" is the closest thing to a "recommended" badge. No card;
  // the comparison asks for the two facts that would decide it instead (askLine).
  if(!screenOrder.length) return null;
  const by=(...fs)=>[...plans].sort((a,b)=>{for(const f of fs){const d=f(a)-f(b);if(d)return d;}return 0;})[0];
  const keys=[];
  screenOrder.forEach(id=>{
    if(id==='medicaid') keys.push(p=>isDual(p)?0:1);   // kept as its own first step: dual-eligible plans before rating, even among manually compared plans the filter did not reach
    keys.push(p=>PRI_KEY[id](p)==null?Infinity:PRI_KEY[id](p));

// Up to three things this plan does that NO other plan on the screen matches. Every one of them is
// a figure the visitor can find in the table below; if there are none, the card says nothing extra.
function sugWhy(p,plans){
  const others=plans.filter(x=>x.id!==p.id), out=[];
  const beatsLow=(f)=>others.every(o=>f(o)>f(p));
  const beatsHigh=(f)=>others.every(o=>f(o)<f(p));
  if(p.premium===0&&others.some(o=>o.premium>0)) out.push(L('a $0 monthly premium','prima mensual de $0'));
  if(_dd(p)===0&&others.some(o=>_dd(o)>0)) out.push(L('a $0 drug deductible','$0 de deducible de medicamentos'));
  else if(beatsLow(_dd)&&_dd(p)!==Infinity) out.push(L(`the lowest drug deductible (${usd(p.ded)})`,`el deducible de medicamentos más bajo (${usd(p.ded)})`));
  if(p.gb&&others.every(o=>!o.gb||o.gb<p.gb)) out.push(L(`${usd(p.gb)} a month back on Part B`,`${usd(p.gb)} al mes de vuelta en la Parte B`));
  if(beatsLow(_mo)&&_mo(p)!==Infinity) out.push(L(`the lowest out-of-pocket maximum (${usd(p.moop)})`,`el máximo de bolsillo más bajo (${usd(p.moop)})`));
  if(beatsHigh(_dent)&&_dentAmt(p)!=null) out.push(L(`dental up to ${usd(_dentAmt(p))}`,`dental hasta ${usd(_dentAmt(p))}`));
  if(beatsHigh(_st)&&p.rating!=null) out.push(L(`${p.rating} of 5 stars from CMS`,`${p.rating} de 5 estrellas de CMS`));
  if(/PPO/.test(String(p.type||''))&&others.every(o=>!/PPO/.test(String(o.type||'')))) out.push(L('more freedom to choose a doctor','más libertad para elegir médico'));
  return out.slice(0,3);
}

/* The shared page's whole data path. It reuses loadPlansForZip (the ZIP index, the state's plan
   file, the carrier file) exactly as the widget does, then hands back only what a sheet prints. */
async function plansForShare(zip,ids,priority){
  try{
    if(!/^\d{5}$/.test(String(zip||''))) return {err:'bad zip'};
    // T-132 B8: the link's pr= carries the whole "+"-joined set (screen order, written by
    // shareURL()); split it back into D.priorities so suggestPlan() runs its real multi-pick rule
    // on the recipient's page, not just its first id. D.priority stays the screen-first id, for
    // SUG_SHORT's "For X:" lead-in, which names only one thing by design.
    const prList=String(priority||'').split('+').filter(Boolean);
    D.priorities=prList; D.priority=prList[0]||'';
    D.zip=String(zip); await loadPlansForZip(D.zip);
    if(D._zipValid===false||!PLANS.length) return {err:'no plans'};
    const want=(ids||[]).map(String);
    const out=want.map(id=>PLANS.find(p=>planIdRaw(p)===id)).filter(Boolean).filter(p=>!p._medigap).slice(0,3);
    if(!out.length) return {err:'no match'};
    // T-078 round 8: the same suggestion the comparison showed, from the answer carried in the link.
    const sug=suggestPlan(out);
    const sh=SUG_SHORT[D.priority]?SUG_SHORT[D.priority]():'';
    // T-102: the sheet and its PDF draw their header from the same map as the widget.
    const ag=agent();
    return {county:D.county||'',city:D.city||'',state:D.state||'',meta:{year:planYear(),src:provenanceNote()},
      agent:{key:ag.key,name:ag.name,tel:ag.tel,digits:ag.digits,email:ag.email,photo:ag.photo,lic:ag.lic},
      sug:sug?{id:planIdRaw(sug),name:dispName(sug),
               why:sugWhy(sug,out).length?andList(sugWhy(sug,out))+'.':'',
               lead:sh?L(`For ${sh}:`,`Para ${sh}:`):''}:null,
      plans:out.map(sharePlanRow)};

}

/* T-024 lead-send v1 (signed AB 2026-10-03). The SAME block is on every form on both sites:
   widget-v4, contacto, contact, careers. "Thank you" only when the leads script confirms the lead
   was saved AND the alert email went out; anything else gets an honest error with our number. No
   blind resend: it used to show "thank you" whether or not anything arrived. Staging and preview
   builds post to the staging copy of the script, so test leads never touch the live sheet setup. */
var LEAD_URL_PROD='https://script.google.com/macros/s/AKfycby8F8kXyTGFcCh2bzk92_sZeUKGlQPZ9RR-QmzYV6CfzBDbw6ANNOQ5JpnH2Z9PfJ_dEQ/exec';
var LEAD_URL_STAGING='https://script.google.com/macros/s/AKfycbwuoMJQEAK5aQ_JRQiAcJrscb0NOqfH9cFgvOKel4UpU_Z2FSiMh4Wd-BWLfTNRDAL5xw/exec';
var CONSENT_VERSION='2026-10-03-v1';
function leadURL(){return /(^|\.)staging\.|\.pages\.dev$|^localhost$|^127\./.test(location.hostname)?LEAD_URL_STAGING:LEAD_URL_PROD;}
function consentText(lang,btn){
  return lang==='en'
    ?'By tapping '+(btn||'Send')+', you agree that we may contact you by call, text or WhatsApp. Not a condition of purchase. Message rates may apply; reply STOP to opt out.'
    :'Al tocar '+(btn||'Enviar')+', acepta que le contactemos por llamada, texto o WhatsApp. No es condición de compra. Pueden aplicar tarifas de mensajes; responda STOP para cancelar.';
}
function consentHTML(lang,btn,privacyUrl){
  return '<p class="lead-consent" style="font-size:12.5px;line-height:1.45;color:#5f6b75;text-align:center;margin:10px 4px 0">'+consentText(lang,btn)
    +' <a href="'+privacyUrl+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">'+(lang==='en'?'Privacy':'Privacidad')+'</a></p>';
}
function withConsent(d,lang,btn,page){
  d.consentText=consentText(lang,btn); d.consentVersion=CONSENT_VERSION;
  d.consentAt=new Date().toISOString(); d.consentPage=page||location.href;
  return d;
}
/* T-020: one way to report an event. Inside the plan-finder iframe it goes to the host page, which sends it
   to that site's own GA4 property (BM or MC); anywhere else straight to this page's gtag. */
function gaEvent(n,p){try{if(window.self!==window.top){window.parent.postMessage({type:'widget-ga',name:n,params:p},'*');}else if(typeof gtag==='function'){gtag('event',n,p);}}catch(e){}}
function sendLead(d){
  if(!d.leadId) d.leadId='L'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  d.env=leadURL()===LEAD_URL_STAGING?'staging':'production';   // AB 2026-10-03: tell STG leads from PROD
  var ctl=window.AbortController?new AbortController():null;
  var t=setTimeout(function(){if(ctl)ctl.abort();},25000);
  return fetch(leadURL(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d),signal:ctl?ctl.signal:undefined})
    .then(function(r){return r.json();})
    .then(function(j){clearTimeout(t);var ok=!!(j&&j.saved===true&&j.emailed===true);
      try{if(/\b(QA|TEST)\b/i.test(String(d.fullName||d.name||'')))sessionStorage.setItem('qa','1');}catch(e){}
      // T-020: generate_lead ONLY when the script confirmed the save. No personal data in the event.
      if(ok) gaEvent('generate_lead',{site:/california/i.test(String(d.source||d.site||location.hostname))?'mc':'bm',
        lang:String(d.lang||d.language||document.documentElement.lang||'').slice(0,2),
        form:(d.role!==undefined||d.resume_link!==undefined)?'careers':(d.leadType?'widget_'+d.leadType:'contact'),
        state:String(d.state||''),...(d.leadType?gaContext():(gaInternal()?{traffic_type:'internal'}:{}))});
      return ok;})
    .catch(function(){clearTimeout(t);return false;});
}
function leadErrorHTML(lang){
  var en=lang==='en', m=encodeURIComponent(en?"Hi, I'd like help with Medicare":'Hola, quiero ayuda con Medicare');
  return '<div class="lead-err" role="alert" style="background:#fff4f2;border:1px solid #f0c4bc;border-radius:10px;padding:12px 14px;margin:12px 0 0;text-align:center;font-size:15px;line-height:1.45;color:#5a1f14">'
    +(en?"We couldn't send your details. Message us or call (310) 597-9142.":'No pudimos enviar sus datos. Escríbanos o llámenos al (310) 597-9142.')
    +'<div style="margin-top:8px;font-weight:700;font-size:15px"><a href="https://wa.me/13105979142?text='+m+'" target="_blank" rel="noopener" style="color:#0b6b56;padding:6px 4px;display:inline-block">WhatsApp</a> · '
    +'<a href="sms:+13105979142" style="color:#0b6b56;padding:6px 4px;display:inline-block">'+(en?'Text':'Texto')+'</a> · '
    +'<a href="tel:+13105979142" style="color:#0b6b56;padding:6px 4px;display:inline-block">'+(en?'Call':'Llamar')+'</a></div></div>';
}

function wEvt(n,extra){gaEvent(n,Object.assign({site:leadSite()==='medicare-california'?'mc':'bm',lang:lang,state:D.state||'',zip3:String(D.zip||'').slice(0,3)},gaContext(),extra||{}));}
// T-038: licensed state yes/no, Medi-Cal yes/no, and our own testing tagged traffic_type=internal (GA4 filters it).
// Still no personal data: no name, phone, email, birth date or full ZIP.
function gaLicensed(){return !D.state?'':(_rep&&Array.isArray(_rep.licensed)?(_rep.licensed.indexOf(D.state)>=0?'yes':'no'):'unknown');}
function gaInternal(){try{return !!window.bmInternal||/\.pages\.dev$/i.test(location.hostname)||/[?&]qa=1\b/.test(location.search+' '+document.referrer)||sessionStorage.getItem('qa')==='1';}catch(e){return false;}}
function gaContext(){const c={licensed:gaLicensed(),medicaid:saidMedicaid()?'yes':'no'};if(gaInternal())c.traffic_type='internal';return c;}

const CONSENT_BTN={enroll:['Send','Enviar'],help:['Send','Enviar'],snooze:['Set Reminder','Programar Recordatorio'],question:['Request Free Call','Solicitar Llamada Gratis']};

function submitLead(type){
  if(_submitting) return;
  if(!leadOK()){ go(flowResults); return; }   // information-only state: no lead capture (T-017)
  _submitting=true;
  const btn=document.querySelector('.btn-p:not(:disabled)');
  const _btnLabel=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent=lang==='en'?'Processing...':'Procesando...'}

  // What is in the boxes now wins over anything remembered: a visitor who corrects a wrong phone after
  // an error must send the corrected one (found in T-024 testing: the old value was re-sent).
  const name=document.getElementById('fullName')?.value||D.fullName||'';
  const phone=document.getElementById('phone')?.value||D.phone||'';
  const email=document.getElementById('email')?.value||D.email||'';
  const question=document.getElementById('question')?.value||'';

  let phoneClean = phone.replace(/\D/g,'');
  if(phoneClean.length === 11 && phoneClean.charAt(0) === '1') phoneClean = phoneClean.slice(1);
  if(!name.trim() || name.trim().length < 2){
    alert(lang==='en'?'Please enter your full name.':'Por favor ingrese su nombre completo.');
    _submitting=false;
    if(btn){btn.disabled=false;btn.textContent=_btnLabel}
    return;
  }
  if(phoneClean.length !== 10){
    alert(lang==='en'?'Please enter a valid 10-digit US phone number.':'Por favor ingrese un n\u00FAmero de tel\u00E9fono v\u00E1lido de 10 d\u00EDgitos (EE.UU.).');
    _submitting=false;
    if(btn){btn.disabled=false;btn.textContent=_btnLabel}
    return;
  }
  D.fullName=name;D.phone=phone;D.email=email;
  if(question) D.question=question;
  // T-077: no health screen, so these are the empty values the old "Skip this step" button sent.
  D.lang=lang;D.conditions=[...selConds];D.healthNotes='';
  D.timestamp=new Date().toISOString();
  D.leadType=type;
  D.agent=agent().key;   // T-102: 'susana' | 'alejandra', from the ZIP's state; the leads script routes on it
  if(type!=='enroll'&&type!=='help'){delete D.plansSeen;delete D.represented;}   // a reminder or question is not about a plan
  // T-099: the plan they said they have today, kept in this page only until now. curPlan is the field the
  // leads script prints as "Plan actual" in the alert email and writes to the sheet; only for this ZIP.
  if(_myPlan&&_myPlan.zip===D.zip){D.curPlan=_myPlan.name+' · '+mpId(_myPlan.id);D.curPlanId=_myPlan.id;D.curPlanMatch=_myPlan.match;}
  else{delete D.curPlan;delete D.curPlanId;delete D.curPlanMatch;}

  const parentHost=(window.self!==window.top)?document.referrer:'';
  D.source=leadSite();
  D.url=parentHost||window.location.href;

  const parts=name.trim().split(/\s+/);
  D.firstName=parts[0]||'';
  D.lastName=parts.slice(1).join(' ')||'';

  const cb=CONSENT_BTN[type]||CONSENT_BTN.enroll;
  withConsent(D,lang,lang==='en'?cb[0]:cb[1],D.url);
  const errBox=document.getElementById('leadErr'); if(errBox) errBox.innerHTML='';
  sendLead(D).then(ok=>{
    _submitting=false;
    if(ok){ go(flowSuccess); return; }
    if(btn){btn.disabled=false;btn.textContent=_btnLabel}
    const box=document.getElementById('leadErr');
    if(box){ box.innerHTML=cfErrorHTML(); box.scrollIntoView({block:'nearest'}); }
  });
}

// ═══════════════════════════════════════
//  INIT - Start with ZIP (no home screen!)
// ═══════════════════════════════════════
/* ── T-078: the widget as the one source of plan data ─────────────────────────────────────────
   The shared page draws the same figures as the comparison the link came from. Rather than copy
   the CMS mapping into a second file and let the two drift, the shared page loads this one with
   ?data=1 in a hidden frame and asks it for the plans by ID. Nothing renders, nothing is reported
   to GA4, no lead form exists in that mode — it is this file's data layer and nothing else.
   It answers only the origins already allowed to embed it, both sites and their previews. */
const _dataOnly=_params.get('data')==='1';
// T-139: the widget itself (not only the hidden ?data=1 copy) honours a list link's f/o/a when
// loaded directly with a zip -- it applies them to the same filter state chipTap/setSort/
// carrierToggle use and opens straight on the list, instead of the question flow. With no f/o/a
// (every visit before this ticket) this branch is never taken and go(startZip) is unchanged.
if(!_dataOnly){
  if(_isListShareLoad){ applyShareListFilters(_fParam,_oParam,_aParam); go(flowResults); }
  else go(startZip);
}

/* T-031: the host page's bottom bar shows one big "Continuar" from question 2 on. The widget tells the page
   which screen it is on (depth 1 = first question) and whether that screen has a next button, and presses
   that button when the page asks. Never offered on a screen that sends a lead: the consent text has to sit
   next to the button the visitor taps, and the page hides its bar there (lead:true) so it cannot cover Enviar. Requests are accepted only from the two sites' own addresses.
   T-100: pri:true = the "¿Qué le importa más?" screen, so the page gives it the results screen's one-line band, no AEP strip and no bottom bar. */
(function(){
  if(window.self===window.top) return;
  var HOSTS=/^https:\/\/((www\.)?beneficiosmedicare\.com|(www\.)?medicare-california\.com|([a-z0-9-]+\.)?(beneficiosmedicare|medicare-california)\.pages\.dev)$/;
  var last='';
  function primary(){
    if(document.querySelector('#wb .lead-consent')) return null;
    var on=document.body.classList.contains('host-next'); if(on) document.body.classList.remove('host-next');
    var b=[].slice.call(document.querySelectorAll('#wb .btn-p')).filter(function(x){return x.offsetParent!==null;});
    if(on) document.body.classList.add('host-next');
    return b.length===1?b[0]:null;
  }
  function report(){
    var b=primary();
    /* T-104 (4): list:true only on the plan list, and c3 = how far down the widget the THIRD card ends,
       so the page can hold its Llamar / WhatsApp bar there until 4 s pass or the visitor scrolls past it. */
    var pl=document.getElementById('plist'), c3=-1;
    if(pl&&_plansView){var cs=pl.querySelectorAll('.pc'), cc=cs[Math.min(2,cs.length-1)], ww=document.querySelector('.widget-wrap');
      if(cc&&ww) c3=Math.round(cc.getBoundingClientRect().bottom-ww.getBoundingClientRect().top);}
    var st={type:'widget-step',depth:hist.length,results:!!_plansView,list:!!(pl&&_plansView),c3:c3,pri:document.body.classList.contains('q3'),lead:!!document.querySelector('#wb .lead-consent'),hasNext:!!b,label:b?b.textContent.replace(/[→←]/g,'').trim():'',disabled:b?!!b.disabled:true};
    var k=JSON.stringify(st); if(k===last) return; last=k;
    window.parent.postMessage(st,'*');
  }
  function start(){
    var wb=document.getElementById('wb'); if(!wb) return;
    new MutationObserver(report).observe(wb,{subtree:true,childList:true,attributes:true,attributeFilter:['disabled','style','class']});
    // T-104 (4): c3 moves when the webfont or a late layout settles; re-measure whenever the widget resizes
    try{ new ResizeObserver(report).observe(document.querySelector('.widget-wrap')); }catch(e){}
    report();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
  window.addEventListener('message',function(e){
    /* Our own origin is trusted by definition: the shared page on this site loads this file as
       its data layer and is served from the same place. Everything else must be on the list. */
    if((!HOSTS.test(e.origin)&&e.origin!==location.origin)||!e.data) return;
    if(e.data.type==='host-next'){document.body.classList.toggle('host-next',!!e.data.on);return;}
    /* T-084: the page draws the compare bar (phones), so this copy stands down; and its button
       presses ours, so there is one behaviour and not two. */
    if(e.data.type==='host-cbar'){document.body.classList.toggle('host-cbar',!!e.data.on);return;}
    if(e.data.type==='widget-compare'){var st=(typeof barState==='function')?barState():null;
      if(st&&(st.mode==='action'||st.mode==='duo')){barAct();}else{goCompare();}return;}
    /* T-078: the page's outline button is Compartir */
    if(e.data.type==='widget-share'){ if(typeof openShare==='function') openShare(); return; }
    /* T-098: where the screen is, reported by the page as it scrolls, so the share sheet can
       sit at the bottom of it instead of at the bottom of a 2,000px frame. */
    if(e.data.type==='host-viewport'){ _hostVP=e.data;
      if(typeof placeSheet==='function') placeSheet(); return; }
    /* T-078: "give me these plans for this ZIP", answered with the same objects the comparison
       draws from. The reply goes back to the exact window that asked, at its own origin. */
    if(e.data.type==='widget-plans'){
      var src=e.source, org=e.origin, q=e.data;
      // T-105: render:true = the shared page wants the comparison itself (shareRender); without it, the
      // plain rows as before (medicare-california's options-shared still asks that way until its pass)
      // T-139: list:true = a shared LIST, not a compare of specific ids -- shareRenderList re-applies
      // the link's own filters/sort/carrier to this zip's live plans (never takes ids at all).
      Promise.resolve(q.list?shareRenderList(q):q.render?shareRender(q):plansForShare(q.zip,q.ids,q.r)).then(function(r){
        try{ src.postMessage({type:'widget-plans-result',rid:q.rid,ok:!r.err,err:r.err||'',zip:q.zip,
          county:r.county||'',city:r.city||'',state:r.state||'',plans:r.plans||[],meta:r.meta||null,sug:r.sug||null,agent:r.agent||null,
          html:r.html||null,css:r.css||'',fns:r.fns||null,names:r.names||[],hoy:r.hoy||'',n:r.n||0},org); }catch(x){}
      });
      return;
    }
    if(e.data.type!=='widget-next') return;
    var b=primary(); if(b&&!b.disabled) b.click();
  });
})();
</script>
