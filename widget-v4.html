// ── COMPARE (b9): up to 3 plans, same group order as the card, label column + plan columns,
// "show only differences", green only for $0, no "best" or winner, one button at the bottom.
function flowCompare(){
  prog(88); _plansView=true;
  const plans=selPlans.map(id=>PLANS.find(p=>p.id===id)).filter(p=>p&&!p._medigap).slice(0,3);
  if(plans.length<2){back();return;}
  // b17: "No incluido" (CMS: not covered) and "Sin información" (no value in the CMS file) are two different cells.
  const off=b=>b==null?{t:noInfo(),na:true}:b;
  const ma=p=>p.cat!=='PDP';
  const R=[], grp=(g,icon)=>R.push({g,icon});
  const row=(lab,cells,big,icon)=>R.push({lab,cells,big,icon});
  const txt=v=>v==null?{t:noInfo(),na:true}:{t:v,off:false};
  const dash={t:'–',off:true};
  // T-052: the same groups as the card. Card bands stay open; the "Ver todos los beneficios" groups start closed
  // (tap the grey bar). A V-object cell keeps its own "No incluido" / "Sin información" state.
  const cv=v=>v==null?{t:noInfo(),na:true}:{t:v.t,off:!!v.off};
  const shut=(g,icon)=>R.push({g,shut:true,icon});
  grp(L('Costs','Costos'),'cost');
  row(L('Monthly premium','Prima mensual'),plans.map(p=>txt(premUsd(p.premium))),true);
  if(plans.some(ma)){
    row(L('Part B premium reduction','Reducción de la prima de la Parte B'),plans.map(p=>ma(p)?cv(gbV(p.gb)):dash));
    row(L('Medical deductible','Deducible médico'),plans.map(p=>ma(p)?cv(mdedV(p.mded)):dash));
  }
  row(L('Max out-of-pocket','Máximo de bolsillo'),plans.map(p=>ma(p)?txt(usd(p.moop)):dash),true);
  row(L('Drug deductible','Deducible de medicamentos'),plans.map(p=>p.drug==='Included'?txt(usd(p.ded)):{t:L('No drug coverage','Sin medicamentos'),off:true}),true);
  if(plans.some(ma)){
    grp(L('Visits','Consultas'),'visits');
    [['pcp',L('Primary doctor','Médico primario')],['spec',L('Specialist','Especialista')],['er',L('Emergency room','Emergencias')],['urg',L('Urgent care','Urgencias')]]
      .forEach(([k,l])=>row(l,plans.map(p=>ma(p)?txt(money(p[k])):dash)));
    grp(L('Extra benefits','Beneficios extra'),'star');
    row('Dental',plans.map(p=>ma(p)?off(dentalB(p,true)):dash),false,'dental');
    row(L('Eyewear','Anteojos'),plans.map(p=>ma(p)?off(visionB(p,true)):dash),false,'vision');
    row(L('Hearing aids','Audífonos'),plans.map(p=>ma(p)?off(hearingB(p,true)):dash),false,'hearing');
    row('OTC',plans.map(p=>ma(p)?off(otcB(p,true)):dash),false,'otc');
    row(L('Fitness','Ejercicio'),plans.map(p=>ma(p)?off(fitB(p)):dash),false,'fit');
    // Group list from benefitGroups(), so the table and the card can never list different benefits. Stays use the
    // short hospital text; "Fuera de la red" only when one of the plans has out-of-network coverage.
    const gs=plans.map(p=>ma(p)?benefitGroups(p):null), ref=gs.find(Boolean);
    // Hospital-type stays use the short text so 3 columns fit at 375px.
    const STAY={hosp:[p=>p.hosp,p=>p.mhosp,p=>p.snf],oon:[null,null,null,null,p=>p.oon&&p.oon.hosp]};
    ['oon','hosp','visits','tests','kit','extra'].forEach(k=>{
      const has=gs.map(g=>g&&g.find(x=>x.k===k));
      const base=has.find(Boolean); if(!base) return;
      const labs=[]; has.forEach(g=>g&&g.rows.forEach(r=>{if(labs.indexOf(r[0])<0)labs.push(r[0]);}));
      shut(base.t,base.icon);
      labs.forEach(lab=>{
        row(lab,plans.map((p,j)=>{
          if(!ma(p)) return dash;
          const g=has[j]; if(!g) return k==='oon'?{t:L('In-network only','Solo en la red'),off:true}:dash;
          const i=g.rows.findIndex(x=>x[0]===lab); if(i<0) return {t:'–',off:true};
          const st=k==='oon'?(/^(Inpatient|Hospitalizaci)/.test(lab)?STAY.oon[4]:null):(STAY[k]&&STAY[k][i]);
          if(st){const t=hospText(st(p),true);return t==null?cv(null):{t,off:false};}
          return cv(g.rows[i][1]);
        }));
      });
    });
  }
  if(plans.some(p=>p.drug==='Included'&&p.tiers&&p.tiers.length)){
    shut(L('Drugs (1 month, standard pharmacy)','Medicamentos (1 mes, farmacia estándar)'),'drug');
    const ids=[...new Set(plans.flatMap(p=>(p.tiers||[]).map(t=>t.t)))].sort((a,b)=>a-b);
    ids.forEach(n=>{
      const named=plans.map(p=>(p.tiers||[]).find(t=>t.t===n)).find(Boolean);
      const same=plans.every(p=>{const t=(p.tiers||[]).find(x=>x.t===n);return t&&named&&t.label===named.label;});
      const lab=L('Tier ','Nivel ')+n+(same&&named?' · '+tierName(named):'');
      row(lab,plans.map(p=>{const t=(p.tiers||[]).find(x=>x.t===n);if(!t||t.v==null)return dash;return {t:money(t.v)+(same?'':' <span style="font-weight:600;color:#66727c">('+tierName(t)+')</span>'),off:false};}));
    });
  }
  /* T-085 round 2 (AB 2026-10-15, "these are old people"): the label gets its own full-width line
     and the three values the line under it, in equal thirds. The old 31% label column left each
     figure about 70px wide at 375, which is where the mid-word breaks and the 12px type came from.
     Two <tr>s per row, carrying the SAME classes, so "Mostrar diferencias" and the group toggles
     hide or show a label and its values together and can never separate them. */
  let gi=-1, closed=false;
  const body=R.map(r=>{
    if(r.g){gi++;closed=!!r.shut;
      const gic=r.icon?`<svg class="gic" viewBox="0 0 24 24">${PIC[r.icon]}</s`+`vg>`:'';
      return r.shut?`<tr class="grp tg shut" data-gi="${gi}" onclick="cmpGrp(this,${gi})"><td colspan="${plans.length}"><span>${gic}${r.g}</span></td></tr>`
                   :`<tr class="grp" data-gi="${gi}" data-gi2="${gi}"><td colspan="${plans.length}"><span class="gi2">${gic}${r.g}</span></td></tr>`;}
    const same=r.cells.every(c=>c.t===r.cells[0].t);
    const cls=`g${gi}${same?' same':''}${closed?' hid':''}`;
    const ric=r.icon?`<svg class="ric" viewBox="0 0 24 24">${PIC[r.icon]}</s`+`vg>`:'';
    return `<tr class="r lr ${cls}"><td class="lab" colspan="${plans.length}">${ric}${nbLast(r.lab)}</td></tr>`+
      `<tr class="r vr ${cls}">${r.cells.map(c=>`<td class="v${c.off?' off':''}${c.na?' na':''}${!c.off&&!c.na&&isZero(String(c.t).replace(/<[^>]+>/g,''))?' zero':''}">${nbLast(c.t)}</td>`).join('')}</tr>`;
  }).join('');
  /* (2) The three header cells line up: the colour stripe and the carrier sit at the top of all
     three, and the name block reserves two lines so the type · ID line and the stars line up too. */
  const head=`<tr>${plans.map(p=>`<th style="--cc:${carrierColor(p)}"><span class="eb">${esc(carrierShort(p.carrier))}</span><span class="nm2">${nbLast(esc(cmpName(p)))}</span><span class="pid">${esc(p.type)} · ${planId(p)}</span><span class="st2">${p.rating==null?L('No rating','Sin calificación'):L(`★ ${p.rating} of 5`,`★ ${p.rating} de 5`)}</span></th>`).join('')}</tr>`;
  const can=leadOK()&&!(D.state&&!_rep)&&plans.every(p=>p.agent);
  const sanct=plans.some(p=>p.sanction);
  _act=can?{id:'compare',label:L('Help me choose between these plans','Ayúdeme a elegir estos planes'),wins:true}:null;
  wb().innerHTML=`
    <div class="cmptop">${bk()}<label class="tog"><input type="checkbox" onchange="cmpDiff(this)"> ${L('Show differences','Mostrar diferencias')}</label></div>
    <p class="diffline" id="diffline" hidden>${L('Only what changes between the 3. What is the same is hidden.','Solo lo que cambia entre los 3. Lo igual está escondido.')}</p>
    ${unlicensedNote()}
    <div class="cmp" id="cmp">
      <table><thead>${head}</thead><tbody>${body}</tbody></table>
      <div class="cmp-foot">${can?`<button class="pc-btn" onclick="helpCompare()">${L('Help me choose between these plans','Ayúdeme a elegir entre estos planes')}</button>`
        :(sanct?`<p class="plan-flag warn">${L('One of these plans has a CMS sanction, see','Uno de estos planes tiene una sanción de CMS, consulte')} <a href="https://www.medicare.gov" target="_blank" rel="noopener">Medicare.gov</a></p>`:`<p class="plan-flag">${L('Information only','Solo información')}</p>`)}</div>
    </div>
    ${bs(L('\u2039 Back to the plans','\u2039 Volver a los planes'),'back()')}
    ${fineBlock(cmpNotes(plans),true)}
    ${cbarHTML()}`;
  updBar();
}
// T-086: the three notes that used to sit between the table and the buttons. Every word is unchanged
// and every one of them is signed: the D-SNP line by PROTECT 2026-10-14 (T-052 review #3), the
// chronic-condition line by 42 CFR 422.2267(e)(34) with AB's and Golden Outlook's yes of the same day,
// the pharmacy line by the same review. The ticket asked for them in one line each; the pharmacy line
// already is one, and the other two are NOT shortened here — see the note on this ticket.
function cmpNotes(plans){
  const out=[];
  if(plans.some(isDual)) out.push(L('Plans for Medicare and '+mcd()+' (D-SNP): ','Planes para Medicare y '+mcd()+' (D-SNP): ')+dualNote(true));
  if(SHOW_SSBCI) plans.filter(p=>p.ssbci).forEach(p=>out.push(`${esc(dispName(p))} (${planId(p)}): ${ssbciNote(p)}`));
  if(plans.some(p=>(p.tiers||[]).some(t=>t.p!=null)))
    out.push(L('Some plans cost less at a preferred pharmacy; open each plan to see both prices.','Algunos planes cuestan menos en una farmacia preferida; abra cada plan para ver los dos precios.'));
  return out;
}
// T-085 (AB 2026-10-15), the behaviour first built for T-066 and parked with it on parked-2026-10-14
// (cd832f6): the toggle hid every identical row, but a row that DIFFERS inside a closed "Ver todos los
// beneficios" group stayed closed with its group, so the toggle hid rows instead of showing differences.
// Measured on production f0a2a0e at 375, ZIP 90230, 3 plans: 31 of 60 rows differ and the toggle left 8
// of them on screen, the other 23 behind six closed bars -- seven taps to see them all. ON now also opens
// every group that holds a difference and drops the groups that hold none, so it is one tap; OFF puts the
// groups back exactly as the visitor had them when they ticked it.
function cmpDiff(cb){
  const c=document.getElementById('cmp'); if(!c) return;
  const on=!!cb.checked;
  c.classList.toggle('diff',on);
  c.querySelectorAll('tr.grp').forEach(g=>{
    const rows=[...c.querySelectorAll('tr.r.g'+g.dataset.gi)], tg=g.classList.contains('tg');
    if(on){
      if(tg&&g.dataset.was==null) g.dataset.was=g.classList.contains('shut')?'1':'0';
      const diff=rows.some(r=>!r.classList.contains('same'));
      g.classList.toggle('hid',!diff);
      if(tg&&diff){g.classList.remove('shut');rows.forEach(r=>r.classList.remove('hid'));}
    }else{
      g.classList.remove('hid');
      if(tg){const shut=g.dataset.was!=='0';g.classList.toggle('shut',shut);
             rows.forEach(r=>r.classList.toggle('hid',shut));delete g.dataset.was;}
    }
  });
  const dl=document.getElementById('diffline'); if(dl) dl.hidden=!on;
  const lb=cb.closest('.tog'); if(lb) lb.classList.toggle('on',on);
  wEvt('compare_diff_toggle',{on});
}
function cmpGrp(el,i){const o=el.classList.toggle('shut');document.querySelectorAll('#cmp tr.g'+i).forEach(t=>t.classList.toggle('hid',o));if(!o)wEvt('benefit_group_open',{group:'compare_'+i});}
// Column header name: drop the plan-type parenthetical and filler words so 3 columns fit at 375px.
// The full name is on every card; this is a label, not the plan's legal name.
// T-052 plan ID (AB 2026-10-14): names alone are not unique (about 8% of plans share their exact official name with
// another plan in the same county), so every plan carries its Medicare ID, as on plan documents: "H4030-005",
// plus the segment when it is not 0 ("H3038-004-1"). Cards keep the full official name; the table keeps the short one.
function planId(p){const m=String(p.id||'').split('_');return '<span class="nw">'+esc(m[0]+(m[1]?'-'+m[1]:'')+(m[2]&&m[2]!=='0'?'-'+m[2]:''))+'</span>';}   // never split an ID across lines
function shortPlan(n){

  return s||String(n);
}

/* T-024 lead-send v1 (signed AB 2026-10-03). The SAME block is on every form on both sites:
   widget-v4, contacto, contact, careers. "Thank you" only when the leads script confirms the lead
   was saved AND the alert email went out; anything else gets an honest error with our number. No
   blind resend: it used to show "thank you" whether or not anything arrived. Staging and preview
   builds post to the staging copy of the script, so test leads never touch the live sheet setup. */
var LEAD_URL_PROD='https://script.google.com/macros/s/AKfycby8F8kXyTGFcCh2bzk92_sZeUKGlQPZ9RR-QmzYV6CfzBDbw6ANNOQ5JpnH2Z9PfJ_dEQ/exec';
var LEAD_URL_STAGING='https://script.google.com/macros/s/AKfycbwuoMJQEAK5aQ_JRQiAcJrscb0NOqfH9cFgvOKel4UpU_Z2FSiMh4Wd-BWLfTNRDAL5xw/exec';
var CONSENT_VERSION='2026-10-03-v1';
function leadURL(){return /(^|\.)staging\.|\.pages\.dev$|^localhost$|^127\./.test(location.hostname)?LEAD_URL_STAGING:LEAD_URL_PROD;}
function consentText(lang,btn){
  return lang==='en'
    ?'By tapping '+(btn||'Send')+', you agree that we may contact you by call, text or WhatsApp. Not a condition of purchase. Message rates may apply; reply STOP to opt out.'
    :'Al tocar '+(btn||'Enviar')+', acepta que le contactemos por llamada, texto o WhatsApp. No es condición de compra. Pueden aplicar tarifas de mensajes; responda STOP para cancelar.';
}
function consentHTML(lang,btn,privacyUrl){
  return '<p class="lead-consent" style="font-size:12.5px;line-height:1.45;color:#5f6b75;text-align:center;margin:10px 4px 0">'+consentText(lang,btn)
    +' <a href="'+privacyUrl+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">'+(lang==='en'?'Privacy':'Privacidad')+'</a></p>';
}
function withConsent(d,lang,btn,page){
  d.consentText=consentText(lang,btn); d.consentVersion=CONSENT_VERSION;
  d.consentAt=new Date().toISOString(); d.consentPage=page||location.href;
  return d;
}
/* T-020: one way to report an event. Inside the plan-finder iframe it goes to the host page, which sends it
   to that site's own GA4 property (BM or MC); anywhere else straight to this page's gtag. */
function gaEvent(n,p){try{if(window.self!==window.top){window.parent.postMessage({type:'widget-ga',name:n,params:p},'*');}else if(typeof gtag==='function'){gtag('event',n,p);}}catch(e){}}
function sendLead(d){
  if(!d.leadId) d.leadId='L'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  d.env=leadURL()===LEAD_URL_STAGING?'staging':'production';   // AB 2026-10-03: tell STG leads from PROD
  var ctl=window.AbortController?new AbortController():null;
  var t=setTimeout(function(){if(ctl)ctl.abort();},25000);
  return fetch(leadURL(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d),signal:ctl?ctl.signal:undefined})
    .then(function(r){return r.json();})
    .then(function(j){clearTimeout(t);var ok=!!(j&&j.saved===true&&j.emailed===true);
      try{if(/\b(QA|TEST)\b/i.test(String(d.fullName||d.name||'')))sessionStorage.setItem('qa','1');}catch(e){}
      // T-020: generate_lead ONLY when the script confirmed the save. No personal data in the event.
      if(ok) gaEvent('generate_lead',{site:/california/i.test(String(d.source||d.site||location.hostname))?'mc':'bm',
        lang:String(d.lang||d.language||document.documentElement.lang||'').slice(0,2),
        form:(d.role!==undefined||d.resume_link!==undefined)?'careers':(d.leadType?'widget_'+d.leadType:'contact'),
        state:String(d.state||''),...(d.leadType?gaContext():(gaInternal()?{traffic_type:'internal'}:{}))});
      return ok;})
    .catch(function(){clearTimeout(t);return false;});
}
function leadErrorHTML(lang){
  var en=lang==='en', m=encodeURIComponent(en?"Hi, I'd like help with Medicare":'Hola, quiero ayuda con Medicare');
  return '<div class="lead-err" role="alert" style="background:#fff4f2;border:1px solid #f0c4bc;border-radius:10px;padding:12px 14px;margin:12px 0 0;text-align:center;font-size:15px;line-height:1.45;color:#5a1f14">'
    +(en?"We couldn't send your details. Message us or call (310) 597-9142.":'No pudimos enviar sus datos. Escríbanos o llámenos al (310) 597-9142.')
    +'<div style="margin-top:8px;font-weight:700;font-size:15px"><a href="https://wa.me/13105979142?text='+m+'" target="_blank" rel="noopener" style="color:#0b6b56;padding:6px 4px;display:inline-block">WhatsApp</a> · '
    +'<a href="sms:+13105979142" style="color:#0b6b56;padding:6px 4px;display:inline-block">'+(en?'Text':'Texto')+'</a> · '
    +'<a href="tel:+13105979142" style="color:#0b6b56;padding:6px 4px;display:inline-block">'+(en?'Call':'Llamar')+'</a></div></div>';
}
/* end T-024 lead-send v1 */

// T-020 widget funnel. Params: site, lang, step, state, and at most the 3-digit ZIP prefix. Never a name,
// phone, email or birth date.
function wEvt(n,extra){gaEvent(n,Object.assign({site:leadSite()==='medicare-california'?'mc':'bm',lang:lang,state:D.state||'',zip3:String(D.zip||'').slice(0,3)},gaContext(),extra||{}));}
// T-038: licensed state yes/no, Medi-Cal yes/no, and our own testing tagged traffic_type=internal (GA4 filters it).
// Still no personal data: no name, phone, email, birth date or full ZIP.
function gaLicensed(){return !D.state?'':(_rep&&Array.isArray(_rep.licensed)?(_rep.licensed.indexOf(D.state)>=0?'yes':'no'):'unknown');}
function gaInternal(){try{return !!window.bmInternal||/\.pages\.dev$/i.test(location.hostname)||/[?&]qa=1\b/.test(location.search+' '+document.referrer)||sessionStorage.getItem('qa')==='1';}catch(e){return false;}}
function gaContext(){const c={licensed:gaLicensed(),medicaid:saidMedicaid()?'yes':'no'};if(gaInternal())c.traffic_type='internal';return c;}
let _gaStartZip='', _gaResultsZip='';
document.addEventListener('click',function(e){
  const a=e.target&&e.target.closest?e.target.closest('a[href]'):null; if(!a) return;
  const h=a.getAttribute('href')||'';
  const ch=/^tel:/i.test(h)?'phone':/^sms:/i.test(h)?'sms':/wa\.me|whatsapp\.com/i.test(h)?'whatsapp':/calendar\.app\.google|calendly\.com|cal\.com/i.test(h)?'book':'';
  if(!ch) return;
  const step=a.closest('.team2')?'team_card':a.closest('.cf-err,.lead-err')?'error':a.closest('.cf')?'confirmation':'widget';
  wEvt(ch+'_click',{step:step});
  if(step==='team_card') wEvt('widget_agent_click',{step:step,channel:ch});
},true);

// Which site the visitor is on (the widget is iframed on MC), and that site's privacy page.
function leadSite(){
  const host=window.location.hostname||'', ref=(window.self!==window.top)?document.referrer:'', path=window.location.pathname||'';
  return (ref.includes('medicare-california')||ref.includes('/california')||host.includes('medicare-california')||host.includes('california')||path.includes('/california'))?'medicare-california':'beneficiosmedicare';
}
function privacyURL(){
  return leadSite()==='medicare-california'
    ?'https://medicare-california.com/'+(lang==='en'?'privacy':'privacidad')
    :'https://beneficiosmedicare.com/'+(lang==='en'?'privacy':'privacidad');
}
// T-027 (1) screen 4: never a thank-you when nothing was saved; details stay in the boxes above.
function cfErrorHTML(){
  return `<div class="cf cf-err" role="alert"><div class="cf-ic err">${CFI.warn}</div>
    <p class="cf-t">${L('We could not send your message','No pudimos enviar su mensaje')}</p>
    <p class="cf-s">${L('Nothing was saved. Your details are still above; try again or contact us directly.','No se guardó. Sus datos siguen arriba; intente de nuevo o escríbanos directamente.')}</p>
    <div class="cf-errbox">${L('It may be a connection problem. Nothing you did wrong.','Puede ser un problema de conexión. No es por algo que usted hizo.')}</div>
    ${cfContact(true)}</div>`;
}
const CONSENT_BTN={enroll:['Send','Enviar'],help:['Send','Enviar'],snooze:['Set Reminder','Programar Recordatorio'],question:['Request Free Call','Solicitar Llamada Gratis']};

function submitLead(type){
  if(_submitting) return;
  if(!leadOK()){ go(flowResults); return; }   // information-only state: no lead capture (T-017)
  _submitting=true;
  const btn=document.querySelector('.btn-p:not(:disabled)');
  const _btnLabel=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent=lang==='en'?'Processing...':'Procesando...'}

  // What is in the boxes now wins over anything remembered: a visitor who corrects a wrong phone after
  // an error must send the corrected one (found in T-024 testing: the old value was re-sent).
  const name=document.getElementById('fullName')?.value||D.fullName||'';
  const phone=document.getElementById('phone')?.value||D.phone||'';
  const email=document.getElementById('email')?.value||D.email||'';
  const question=document.getElementById('question')?.value||'';

  let phoneClean = phone.replace(/\D/g,'');
  if(phoneClean.length === 11 && phoneClean.charAt(0) === '1') phoneClean = phoneClean.slice(1);
  if(!name.trim() || name.trim().length < 2){
    alert(lang==='en'?'Please enter your full name.':'Por favor ingrese su nombre completo.');
    _submitting=false;
    if(btn){btn.disabled=false;btn.textContent=_btnLabel}
    return;
  }
  if(phoneClean.length !== 10){
    alert(lang==='en'?'Please enter a valid 10-digit US phone number.':'Por favor ingrese un n\u00FAmero de tel\u00E9fono v\u00E1lido de 10 d\u00EDgitos (EE.UU.).');
    _submitting=false;
    if(btn){btn.disabled=false;btn.textContent=_btnLabel}
    return;
  }
  D.fullName=name;D.phone=phone;D.email=email;
  if(question) D.question=question;
  // T-077: no health screen, so these are the empty values the old "Skip this step" button sent.
  D.lang=lang;D.conditions=[...selConds];D.healthNotes='';
  D.timestamp=new Date().toISOString();
  D.leadType=type;
  if(type!=='enroll'&&type!=='help'){delete D.plansSeen;delete D.represented;}   // a reminder or question is not about a plan

  const parentHost=(window.self!==window.top)?document.referrer:'';
  D.source=leadSite();
  D.url=parentHost||window.location.href;

  const parts=name.trim().split(/\s+/);
  D.firstName=parts[0]||'';
  D.lastName=parts.slice(1).join(' ')||'';

  const cb=CONSENT_BTN[type]||CONSENT_BTN.enroll;
  withConsent(D,lang,lang==='en'?cb[0]:cb[1],D.url);
  const errBox=document.getElementById('leadErr'); if(errBox) errBox.innerHTML='';
  sendLead(D).then(ok=>{
    _submitting=false;
    if(ok){ go(flowSuccess); return; }
    if(btn){btn.disabled=false;btn.textContent=_btnLabel}
    const box=document.getElementById('leadErr');
    if(box){ box.innerHTML=cfErrorHTML(); box.scrollIntoView({block:'nearest'}); }
  });
}

const CFI={check:'<svg viewBox="0 0 24 24"><polyline points="5 12.5 10 17.5 19 7"/></svg>',
  bell:'<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  warn:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>',
  chat:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H4l2.5-3A8 8 0 1 1 21 12z"/></svg>'};
function cfContact(secondary){
  const msg=encodeURIComponent(L("Hi, I'd like help with the 2027 plans",'Hola, quiero ayuda con los planes 2027'));
  const wa='https://wa.me/13105979142?text='+msg;
  const phone=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
  const main=phone?`href="sms:+13105979142?&body=${msg}"`:`href="${wa}" target="_blank" rel="noopener"`;
  return `<p class="cf-alt cf-now">${L('Rather not wait?','¿Prefiere no esperar?')}</p>
    <a class="${secondary?'cf-btn2':'cf-btn'}" ${main}>${secondary?'':CFI.chat}${L('Send us a message','Envíenos un mensaje')}</a>
    <p class="cf-alt"><a href="${wa}" target="_blank" rel="noopener">WhatsApp</a> · <a href="tel:+13105979142">${L('Call','Llamar')} (310) 597-9142</a></p>`;
}
function cfRow(l,v,none){return `<div class="cf-row"><span class="l">${l}</span><span class="v${none?' none':''}">${v}</span></div>`;}
function seenPlanNames(){
  const ids=String(D.selectedPlanId||'').split(';').filter(Boolean);
  return ids.map(id=>{const p=PLANS.find(x=>x.id===id);return p?esc(dispName(p))+' ('+planId(p)+')':'';}).filter(Boolean).join(', ');
}
function flowSuccess(){
  prog(100); _plansView=true;
  const first=esc((D.fullName||'').trim().split(/\s+/)[0]||'');
  const name=esc(D.fullName||''), phone=esc(D.phone||'');
  const email=D.email?esc(D.email):'';
  const fix=`<p class="cf-fix">${L('Something wrong?','¿Algo está mal?')} <a href="#" onclick="event.preventDefault();back()">${L('Fix it here','Corríjalo aquí')}</a></p>`;
  const restart=`<a href="#" onclick="event.preventDefault();hist=[];D={};selConds=[];priRank=[];selPlans=[];_typeFilter='all';_zeroOnly=false;_drugOnly=false;_priAuto=null;_sortMode='premium';_shown=3;go(startZip)">${L('Start over','Empezar de nuevo')}</a>`;
  const plans=seenPlanNames();
  wb().innerHTML=`<div class="cf">
    <div class="cf-ic">${CFI.check}</div>
    <p class="cf-t">${L(`Thank you${first?', '+first:''}. We got your message.`,`Gracias${first?', '+first:''}. Recibimos su mensaje.`)}</p>
    <p class="cf-s">${L('One of us will contact you soon by call, text or WhatsApp.','Una de nosotras le contacta pronto por llamada, texto o WhatsApp.')}</p>
    <div class="cf-band"><p class="h">${L('What you sent us','Lo que nos envió')}</p>
      ${cfRow(L('Name','Nombre'),name)}${cfRow(L('Phone','Teléfono'),phone)}
      ${cfRow(L('Email','Correo'),email||L('Not given','No lo dio'),!email)}
      ${plans?cfRow(L('Plans you looked at','Planes que miró'),plans):''}
      ${D.question?cfRow(L('Your question','Su pregunta'),esc(D.question)):''}
      ${fix}</div>
    ${cfContact(false)}
    <div class="cf-links">${PLANS.length?`<a href="#" onclick="event.preventDefault();hist=[];go(allPlans)">${L('Back to your plans','Volver a sus planes')}</a>`:''}${restart}</div></div>`;
}

/* T-031: the host page's bottom bar shows one big "Continuar" from question 2 on. The widget tells the page
   which screen it is on (depth 1 = first question) and whether that screen has a next button, and presses
   that button when the page asks. Never offered on a screen that sends a lead: the consent text has to sit
   next to the button the visitor taps, and the page hides its bar there (lead:true) so it cannot cover Enviar. Requests are accepted only from the two sites' own addresses. */
(function(){
  if(window.self===window.top) return;
  var HOSTS=/^https:\/\/((www\.)?beneficiosmedicare\.com|(www\.)?medicare-california\.com|([a-z0-9-]+\.)?(beneficiosmedicare|medicare-california)\.pages\.dev)$/;
  var last='';
  function primary(){
    if(document.querySelector('#wb .lead-consent')) return null;
    var on=document.body.classList.contains('host-next'); if(on) document.body.classList.remove('host-next');
    var b=[].slice.call(document.querySelectorAll('#wb .btn-p')).filter(function(x){return x.offsetParent!==null;});
    if(on) document.body.classList.add('host-next');
    return b.length===1?b[0]:null;
  }
  function report(){
    var b=primary();
    var st={type:'widget-step',depth:hist.length,results:!!_plansView,lead:!!document.querySelector('#wb .lead-consent'),hasNext:!!b,label:b?b.textContent.replace(/[→←]/g,'').trim():'',disabled:b?!!b.disabled:true};
    var k=JSON.stringify(st); if(k===last) return; last=k;
    window.parent.postMessage(st,'*');
  }
  function start(){
    var wb=document.getElementById('wb'); if(!wb) return;
    new MutationObserver(report).observe(wb,{subtree:true,childList:true,attributes:true,attributeFilter:['disabled','style','class']});
    report();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
  window.addEventListener('message',function(e){
    if(!HOSTS.test(e.origin)||!e.data) return;
    if(e.data.type==='host-next'){document.body.classList.toggle('host-next',!!e.data.on);return;}
    /* T-084: the page draws the compare bar (phones), so this copy stands down; and its button
       presses ours, so there is one behaviour and not two. */
    if(e.data.type==='host-cbar'){document.body.classList.toggle('host-cbar',!!e.data.on);return;}
    if(e.data.type==='widget-compare'){var st=(typeof barState==='function')?barState():null;
      if(st&&st.mode==='action'){barAct();}else{goCompare();}return;}
    if(e.data.type!=='widget-next') return;
    var b=primary(); if(b&&!b.disabled) b.click();
  });
})();
</script>
