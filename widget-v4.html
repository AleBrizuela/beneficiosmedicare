<meta charset="UTF-8">
<meta name="robots" content="noindex, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beneficios Medicare - Your Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1E3A5F; --green: #00796B; --blue: #2E6BA4;
  --teal: #00897B; --mint: #B2DFDB;
  --lt-blue: #D6EAF7; --lt-green: #E0F2F1;
  --lt-mint: #E0F2F1; --lt-gray: #F3F5F7;
  --gray: #5A6577; --dark: #1C2B3A; --white: #FFFFFF;
  --sage: #00897B; --sage-dark: #00796B; --slate: #3D5A80;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(30,58,95,0.10);
  --shadow-lg: 0 8px 40px rgba(30,58,95,0.14);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Open Sans',-apple-system,sans-serif;background:linear-gradient(135deg,#E0F2F1 0%,#D6EAF7 50%,#E0F2F1 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
body.in-iframe{padding:0;min-height:auto;background:var(--white);align-items:flex-start}
body.in-iframe .widget-wrap{border-radius:0;box-shadow:none}
body.in-iframe .widget-header{display:none}
body.in-iframe .widget-footer{display:none}
body.in-iframe .widget-wrap{min-height:auto!important}
body.in-iframe .widget-body{padding-top:10px;padding-bottom:4px}
body.in-iframe .bot-msg{font-size:16px;padding:2px 0 8px}
.widget-wrap{width:100%;max-width:480px;background:var(--white);border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden;position:relative}

/* ── LANG BUBBLE ── */
.lang-toggle{display:flex;background:rgba(255,255,255,.15);border-radius:8px;overflow:hidden;margin-left:auto;flex-shrink:0;border:1px solid rgba(255,255,255,.2)}
.lang-toggle button{padding:6px 12px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;background:transparent;color:rgba(255,255,255,.6);letter-spacing:.03em}
.lang-toggle button.active{background:rgba(255,255,255,.95);color:var(--navy);border-radius:6px}
.lang-toggle button:hover:not(.active){background:rgba(255,255,255,.1);color:white}

/* ── HEADER ── */
.widget-header{background:linear-gradient(135deg,var(--navy) 0%,var(--slate) 100%);padding:14px 20px 12px;color:white;display:flex;align-items:center;gap:12px}
.widget-header .logo-icon{width:42px;height:42px;background:rgba(255,255,255,.15);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.widget-header h2{font-size:18px;font-weight:600;line-height:1.2}
.widget-header p{font-size:13px;opacity:.8;margin-top:2px}

/* ── PROGRESS ── */
.progress-bar{height:4px;background:rgba(0,0,0,.05)}
.progress-fill{height:100%;background:var(--sage);transition:width .4s ease;border-radius:0 2px 2px 0}

/* ── BODY ── */
.widget-body{padding:18px 22px 8px}

/* ── ANIM ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.widget-body>*{animation:fadeUp .3s ease}

/* ── BOT MSG ── */
.bot-msg{background:none;border-radius:0;padding:4px 0 12px;margin-bottom:6px;font-size:17px;font-weight:400;line-height:1.5;color:#3c4043;text-align:center}
.bot-msg strong{font-weight:600;color:inherit}
.bot-msg.plain{background:none;border-radius:0;padding:4px 0 10px;font-size:22px;font-weight:600;color:#202124;text-align:center}
.bot-msg.hl{background:#f8f9fa;border-left:3px solid var(--sage);padding:10px 14px;border-radius:8px;text-align:left;font-size:14px;font-weight:400;color:#5f6368}

/* ── OPT CARDS ── */
.opt-grid{display:flex;flex-direction:column;gap:10px}
.opt-card{display:flex;align-items:center;gap:14px;padding:16px 16px;border:1.5px solid #dadce0;border-radius:var(--radius);cursor:pointer;transition:all .15s;background:var(--white);min-height:64px}
.opt-card:hover{border-color:var(--sage);background:#f8faf9;box-shadow:0 1px 6px rgba(60,64,67,.08)}
.opt-card:active{transform:scale(.98)}
.opt-card .ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.ic.bl{background:var(--lt-blue)}.ic.gr{background:var(--lt-green)}.ic.mi{background:var(--lt-mint)}.ic.sg{background:var(--lt-mint)}
.opt-card .tx h4{font-size:15px;font-weight:600;color:#202124;margin-bottom:2px}
.opt-card .tx p{font-size:13px;color:#5f6368;line-height:1.45}
.opt-card .bg{margin-left:auto;font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;letter-spacing:.03em;white-space:nowrap;flex-shrink:0}
.bg.st{background:#fef7e0;color:#b06000}.bg.ch{background:#e8f0fe;color:#1a73e8}
.bg.co{background:#e6f4ea;color:#137333}.bg.le{background:#f3e8fd;color:#8430ce}

/* ── INPUTS ── */
.input-group{margin-bottom:14px;text-align:center}
.input-group label{display:block;font-size:13px;font-weight:500;color:#5f6368;margin-bottom:6px;text-align:center}
.input-field{width:auto;min-width:180px;max-width:260px;padding:14px 16px;border:1.5px solid #dadce0;border-radius:var(--radius);font-size:18px;font-family:inherit;color:#202124;transition:border-color .2s;text-align:center;display:block;margin:0 auto}
.input-field:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(0,137,123,.15)}
.input-field::placeholder{color:#A0AEC0}
.input-group.zip-group .input-field{width:140px;min-width:140px;font-size:22px;letter-spacing:3px}

/* ── BUTTONS ── */
.btn-p{width:100%;padding:16px;background:var(--sage);color:white;border:none;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:8px;min-height:52px}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,137,123,.3)}.btn-p:active{transform:translateY(0)}
.btn-p:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-s{width:100%;padding:14px;background:transparent;color:var(--sage);border:1.5px solid #dadce0;border-radius:var(--radius);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:8px;min-height:50px}
.btn-s:hover{background:var(--lt-mint)}
.btn-back{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--gray);font-size:14px;cursor:pointer;font-family:inherit;margin-bottom:12px;padding:6px 0;min-height:36px}
.btn-back:hover{color:var(--dark)}
.btn-ghost{background:none;border:none;color:#1a73e8;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;padding:10px 0;text-decoration:none;min-height:44px}
.btn-remind{width:100%;padding:14px;background:var(--lt-blue);color:var(--blue);border:2px solid var(--lt-blue);border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:8px;min-height:50px}
.btn-remind:hover{border-color:var(--blue)}
.btn-skip{display:block;width:100%;text-align:center;background:none;border:none;color:#999;font-size:13px;cursor:pointer;font-family:inherit;padding:10px 0;margin-top:4px;text-decoration:underline;text-underline-offset:2px;min-height:36px}
.btn-skip:hover{color:var(--gray)}

/* ── INFO CARDS ── */
.info-card{background:#f8f9fa;border-radius:var(--radius);padding:16px;margin-bottom:12px}
.info-card h4{font-size:14px;font-weight:600;color:#202124;margin-bottom:5px}
.info-card p{font-size:14px;color:#3c4043;line-height:1.55}
.info-card.bl{background:#f8f9fa}.info-card.bl h4{color:#202124}

/* ── CONDITION CHIPS (Option B) ── */
.cond-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.cond-chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border:1.5px solid #dadce0;border-radius:var(--radius);cursor:pointer;transition:all .15s;background:var(--white);text-align:center;min-height:70px}
.cond-chip:hover{border-color:var(--sage);background:#f8faf9}
.cond-chip:active{transform:scale(.97)}
.cond-chip.sel{border-color:var(--sage);background:var(--sage);color:white}
.cond-chip .cond-icon{font-size:24px;line-height:0}
.cond-chip .cond-label{font-size:13px;font-weight:500;line-height:1.3}
.cond-chip.sel .cond-label{color:white}
.cond-chip.sel .cond-icon svg{filter:brightness(0) invert(1)}
.health-textarea{width:100%;padding:12px 14px;border:2px solid #E2E8F0;border-radius:var(--radius);font-size:14px;font-family:inherit;color:var(--dark);resize:vertical;min-height:70px;transition:border-color .2s}
.health-textarea:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(0,137,123,.15)}
.health-textarea::placeholder{color:#A0AEC0}

/* ── RANK BADGES (priority step) ── */
.opt-card{position:relative}
.rank-badge{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:var(--sage);color:white;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,137,123,.3);animation:popIn .25s ease}
.opt-card.ranked{border-color:var(--sage);background:var(--lt-mint)}

/* ── PLAN CARDS ── */
.plan-card{border:1.5px solid #dadce0;border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:all .2s;position:relative;border-left:4px solid #dadce0}
.plan-card:hover{box-shadow:0 1px 6px rgba(60,64,67,.1)}
.plan-card.rec{border-color:var(--sage);background:#f8faf9;border-left-color:var(--sage)}
.plan-label{position:absolute;top:-10px;right:10px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:8px;letter-spacing:.02em}
.plan-label.best-match{background:var(--sage);color:white}
.plan-label.best-value{background:#1a73e8;color:white}
.plan-label.most-benefits{background:#8430ce;color:white}
.plan-label.top-rated{background:#ea8600;color:white}
.plan-card h4{font-size:15px;font-weight:600;color:#202124;margin-bottom:3px}
.plan-card .carrier{font-size:13px;color:#5f6368;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.carrier-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.plan-row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;border-bottom:1px solid #EDF2F7}
.plan-row:last-child{border:none}
.plan-row .lb{color:#5f6368}.plan-row .vl{font-weight:500;color:#202124}
.plan-row .vl.gd{color:#137333}
.plan-cta{width:100%;padding:14px;margin-top:10px;border:1.5px solid #dadce0;background:var(--white);color:var(--sage);border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;min-height:50px}
.plan-cta:hover{background:var(--sage);color:white}
.plan-cta.filled{background:var(--sage);color:white}
.plan-cta.filled:hover{background:var(--sage-dark)}
.plan-stars{font-size:12px;color:#5f6368;margin:-6px 0 8px}
.plan-flag{margin-top:10px;padding:10px 12px;border-radius:8px;background:#f1f3f4;color:#3c4043;font-size:13px;line-height:1.45;text-align:center}
.plan-flag.warn{background:#fdecea;color:#a50e0e}
.plan-flag a{color:inherit;font-weight:600}
.plan-note{font-size:12px;color:#5f6368;line-height:1.45;margin:6px 0 0}
.plan-more{margin-top:6px;border-top:1px solid #EDF2F7}
.plan-more summary{cursor:pointer;font-size:14px;color:var(--sage);font-weight:600;padding:10px 0;min-height:44px;display:flex;align-items:center}

/* ── PLAN SELECT CHECKBOX ── */
.plan-sel{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;border:2px solid #CBD5E0;background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;transition:all .15s;z-index:2}
.plan-sel:hover{border-color:var(--sage)}
.plan-sel.checked{background:var(--sage);border-color:var(--sage);color:white}

/* ── TYPE FILTER + SORT BAR ── */
.type-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;padding:0 2px}
.type-pill{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border:1.5px solid #dadce0;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;background:var(--white);color:#5f6368;transition:all .15s;font-family:inherit;white-space:nowrap}
.type-pill:hover{border-color:var(--sage);color:var(--sage)}
.type-pill.active{background:var(--sage);color:white;border-color:var(--sage)}
.type-count{font-size:12px;font-weight:700;background:rgba(0,0,0,.08);padding:1px 6px;border-radius:10px}
.type-pill.active .type-count{background:rgba(255,255,255,.25)}
.sort-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;padding:0 2px}
.sort-pill{padding:6px 10px;border:1.5px solid #dadce0;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;background:var(--white);color:#5f6368;transition:all .15s;font-family:inherit;white-space:nowrap}
.sort-pill:hover{border-color:var(--sage);color:var(--sage)}
.sort-pill.active{background:var(--sage);color:white;border-color:var(--sage)}
.compare-float{position:sticky;bottom:0;left:0;right:0;background:white;padding:10px 0 4px;border-top:1px solid #EDF2F7;margin-top:12px;text-align:center}

/* ── COMPARE TABLE ── */
.compare-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
.compare-table th{background:#f8f9fa;color:#202124;padding:9px 6px;text-align:center;font-weight:600;font-size:12px;border-bottom:1px solid #dadce0}
.compare-table th:first-child{text-align:left;color:#5f6368}
.compare-table td{padding:8px 6px;border-bottom:1px solid #f1f3f4;text-align:center;color:#3c4043}
.compare-table td:first-child{text-align:left;color:#5f6368;font-weight:400}
.compare-table tr:hover td{background:#f8f9fa}

/* ── COMPARE ROW ── */
.cmp-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EDF2F7;font-size:15px}
.cmp-row:last-child{border:none}
.cmp-lb{color:#5f6368}.cmp-vl{font-weight:500;color:#202124}

/* ── SUCCESS ── */
.success-icon{width:88px;height:88px;background:linear-gradient(135deg,#E8F5E9 0%,#C8E6C9 100%);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 12px;box-shadow:0 4px 16px rgba(76,175,80,.25);animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.success-wrap{text-align:center;padding:20px 8px 12px}
.success-title{color:#202124;font-size:21px;font-weight:600;margin:0 0 4px;line-height:1.3}
.success-subtitle{color:#5f6368;font-size:14px;font-weight:400;margin:0 0 16px}
.success-bullets{text-align:left;background:var(--lt-gray);border-radius:var(--radius);padding:14px 16px;margin:0 0 16px;list-style:none}
.success-bullets li{font-size:14px;color:#2D3748;line-height:1.5;padding:5px 0;display:flex;align-items:flex-start;gap:8px}
.success-bullets li span.sb-icon{flex-shrink:0;font-size:16px;margin-top:1px}
.success-cta{display:inline-block;background:var(--sage);color:white;font-size:15px;font-weight:600;padding:13px 28px;border-radius:var(--radius);border:none;cursor:pointer;font-family:inherit;transition:all .2s;margin-bottom:12px}
.success-cta:hover{background:#1A8A6E;transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,138,110,.3)}
.success-links{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.success-links button{background:none;border:none;color:var(--navy);font-size:13px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:4px}

/* ── FOOTER ── */
.widget-footer{padding:8px 18px 10px;text-align:center;font-size:12px;color:var(--gray);line-height:1.45;border-top:1px solid #EDF2F7}
.widget-footer a{color:var(--blue);text-decoration:none}

/* ── TRUST BAR ── */
.trust-bar{display:flex;justify-content:center;gap:16px;margin-top:8px;padding-bottom:0;font-size:12px;color:#888}
.trust-bar span{display:flex;align-items:center;gap:4px}
.social-proof-line{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;font-size:12px;color:#555;font-weight:500}
.social-proof-line .sp-stars{display:flex;gap:2px;color:#FDB022}
.social-proof-line .sp-stars svg{width:12px;height:12px}

/* ── 2027 PLAN CARD, RESULTS, COMPARE (T-017 b2-b13; mockups DECIDE/now/2026-10-02_widget-2027-*.html) ── */
.pc{background:#fff;border:1px solid #e5e9ec;border-top:4px solid var(--cc,#c9d1d8);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(16,24,40,.06);margin-bottom:12px;text-align:left}
.pc-head{padding:14px 14px 12px;border-bottom:1px solid #e5e9ec}
.pc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pc-top>div{min-width:0}
.pc-eb{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#66727c;margin:0 0 3px;overflow-wrap:anywhere}
.pc-name{font-size:17px;font-weight:700;line-height:1.3;margin:0;color:#1e2a32;overflow-wrap:anywhere}
.pc-meta{margin-top:6px;font-size:13px;color:#66727c;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pc-chip{background:var(--lt-mint);color:var(--sage-dark);font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px}
.pc-rating{font-size:12px;color:#66727c;margin-top:4px}
.pc-cmp{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--sage-dark);border:1px solid #e5e9ec;border-radius:999px;padding:0 10px 0 8px;white-space:nowrap;min-height:36px;background:#fff;cursor:pointer;flex:0 0 auto}
.pc-cmp input{accent-color:var(--sage);width:18px;height:18px;margin:0;cursor:pointer}
.pc-keys{display:grid;grid-template-columns:repeat(3,1fr);background:#f3f5f7}
.pc-keys.k2{grid-template-columns:repeat(2,1fr)}
.pc-key{padding:12px 6px;text-align:center;border-right:1px solid #e5e9ec;min-width:0}
.pc-key:last-child{border-right:0}
.pc-key .v{font-size:21px;font-weight:800;line-height:1.1;color:#1e2a32;overflow-wrap:anywhere}
.pc-key .v small{font-size:12px;font-weight:600;color:#66727c}
.pc-key .v.na{font-size:14px;font-weight:600;color:#56616a}
.pc-key .l{font-size:11.5px;color:#66727c;margin-top:4px;line-height:1.25}
.pc-key.zero .v,.pc-visit .v.zero,.pc .zero,.cmp .zero{color:var(--sage-dark)}
.pc-sec{padding:14px 14px 4px}
.pc-sec h5{font-size:13px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;margin:0 0 8px;color:#1e2a32}
.pc-sec h5 span{text-transform:none;letter-spacing:0;font-weight:600;color:#66727c}
.pc-visits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pc-visit{background:#f3f5f7;border-radius:10px;padding:8px 10px;min-width:0}
.pc-visit .l{font-size:12px;color:#66727c}
.pc-visit .v{font-size:17px;font-weight:800;color:#1e2a32;overflow-wrap:anywhere}
.pc-visit .v.na{font-size:13px;font-weight:600;color:#56616a}
.pc-chips{display:flex;flex-wrap:wrap;gap:6px}
.pc-chips .c{font-size:12.5px;font-weight:600;background:#f3f5f7;color:#1e2a32;border:1px solid #e5e9ec;padding:4px 9px;border-radius:999px}
.pc-chips .c b{color:var(--sage)}
.pc-chips .c.off{background:#fff;color:#56616a;border:1px dashed #aab4bc}
.pc-chips .c.off b{color:#a3adb5}
.pc details{border-top:1px solid #e5e9ec;margin-top:10px}
.pc summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:14.5px;font-weight:700;color:var(--sage-dark);display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px}
.pc summary::-webkit-details-marker{display:none}
.pc summary::after{content:"";flex:0 0 auto;width:9px;height:9px;border-right:2px solid var(--sage-dark);border-bottom:2px solid var(--sage-dark);transform:rotate(45deg);margin-top:-4px}
.pc details[open] summary::after{transform:rotate(-135deg);margin-top:4px}

const _params=new URLSearchParams(location.search);
let lang=_params.get('lang')==='es'?'es':'en', hist=[], D={}, selConds=[], priRank=[], selPlans=[], _submitting=false;

const _expParam=_params.get('exp')||'';
const _activeExps=_expParam?_expParam.split(',').map(s=>s.trim()).filter(Boolean):[];
const _expModules={};  // loaded experiment step functions keyed by id

_activeExps.forEach(expId=>{
  const s=document.createElement('script');
  s.src='experiments/'+expId+'/module.js';
  s.onerror=()=>console.warn('Experiment module not found:',expId);
  document.head.appendChild(s);
});

// Generic experiment step runner: inserts experiment steps after health, before nextFn
// Checks at CALL TIME (not definition time) so dynamically loaded scripts are found
function _runExperiments(nextFn){
  const EXP_REGISTRY={
    'drug-names':'expDrugNames'
  };
  for(const expId of _activeExps){
    const fnName=EXP_REGISTRY[expId]||('exp_'+expId.replace(/-/g,'_'));
    if(typeof window[fnName]==='function'){
      window[fnName](lang, D, ()=>go(nextFn));
      return true;
    }
  }
  return false;
}
// Wrapper: run experiments if active, otherwise go directly to nextFn
function expOrNext(nextFn){
  if(_activeExps.length>0 && _runExperiments(nextFn)) return;
  go(nextFn);

// Convert Medigap plan type to widget-compatible plan objects
function medigapToWidgetPlans(stateData){
  if(!stateData || !stateData.plans) return [];
  const result = [];
  stateData.plans.forEach(plan => {
    // Create one widget entry per plan letter (showing cheapest carrier)
    const letter = plan.type.replace('HIGH_','High-');
    const cheapest = plan.policies.length > 0 ? plan.policies.reduce((a,b) => a.min < b.min ? a : b) : null;
    result.push({
      id: 'medigap-' + plan.type + '-' + stateData.state,
      name: 'Medigap Plan ' + letter,
      carrier: cheapest ? cheapest.co.split('(')[0].trim() : 'Multiple carriers',
      premium: plan.premium_min,
      ded: 0,
      moop: 0,
      dental: null,
      vision: null,
      hearing: null,
      fitness: 0,
      otc: 0,
      drug: 'N/A',
      giveback: 0,
      rating: null,   // Medigap has no CMS star rating
      type: 'Medigap',
      _medigap: true,
      _premiumRange: '$' + Math.round(plan.premium_min) + '-$' + Math.round(plan.premium_max) + '/mo',
      _pmin: plan.premium_min, _pmax: plan.premium_max,
      _carrierCount: plan.policies.length,
      _planLetter: letter
    });
  });
  return result;
}

// ---- 2027 plan data (T-017) ----
// data/plans_<ST>_2027.json, built from the CMS CY2027 Landscape + PBP Benefits files by
// SHIP/reference/tools/build-plan-data-2027.py. Each file carries its own `year` and `source`,
// and those are what the widget displays, so the year label cannot drift from the numbers.
// The 2026 files (cms_<ST>.js, benefits_<ST>_2026.json) are kept unchanged for rollback.
const PLAN_FILE_YEAR=2027;
let _planMeta=null;   // {year, source} of the file currently loaded

// Star rating, benefit wording and provenance helpers live with the plan card (PLAN RESULTS below).

// ---- Who we may offer an agent for: data/represented-2027.json (signed by AB, RED) ----
// licensed: states with lead capture. represented[ST]: CMS parent organizations we are appointed
// with and Ready to Sell for 2027 in that state. If the file cannot load, everything fails CLOSED:
// no agent buttons and no lead forms once a state is known (a lost lead beats a lead taken in a
// state we are not licensed in). A failed load is retried on the next ZIP.
let _rep=null,_repTried=false;
function loadRepresented(){
  if(_repTried) return Promise.resolve(_rep);
  return fetch('data/represented-2027.json?v=20261002')
    .then(r=>{const ct=(r.headers.get('content-type')||'');if(!r.ok||ct.indexOf('json')===-1)throw new Error('no file');return r.json();})
    .then(j=>{_repTried=true;_rep=j;return j;})
    .catch(()=>{_repTried=false;_rep=null;return null;});
}
// May this visitor be offered lead capture? No ZIP/state yet = yes, as before T-017. A known state
// is offered lead capture only when the signed list loaded AND names it.
function leadOK(){
  if(!D.state) return true;
  if(!_rep||!Array.isArray(_rep.licensed)) return false;
  return _rep.licensed.indexOf(D.state)>=0;
}
// True only when we positively know the state is not licensed (drives the Medicare.gov notice).
function knownUnlicensed(){
  return !!(D.state&&_rep&&Array.isArray(_rep.licensed)&&_rep.licensed.indexOf(D.state)<0);
}
function isRepresented(parent,state){
  if(!_rep||!_rep.represented) return false;
  const l=_rep.represented[state]; return Array.isArray(l)&&l.indexOf(parent)>=0;
}

function cmsToWidget(p, state){
  const rep=isRepresented(p.parent,state);
  return {
    id: p.id,
    name: p.name,
    carrier: p.org,
    parent: p.parent,
    cat: p.cat,
    snp: p.snp,
    premium: p.prem,            // null = CMS published no consolidated premium for this plan
    ded: p.dded,                // Part D deductible; null when the plan has no drug coverage
    moop: p.moop,
    pcp: p.pcp||null, spec: p.spec||null, er: p.er||null, urg: p.urg||null,
    dental: p.dental===undefined?null:p.dental,
    vision: p.vision===undefined?null:p.vision,
    hearing: p.hearing===undefined?null:p.hearing,
    otc: p.otc||null,
    // Card detail from PBP 2027 (T-017 b3-b7, b6b). undefined/null = not in the file = "No information".
    hosp: p.hosp||null, ohosp: p.ohosp||null, asc: p.asc||null, amb: p.amb||null,
    trans: p.trans===undefined?null:p.trans, fit: p.fit===undefined?null:p.fit,
    dent: p.dent||null, vis: p.vis||null, hear: p.hear||null,
    ins: p.ins||null, noded: p.noded||null,
    tiers: p.tiers||null,
    dbt: p.dbt||null,
    drug: p.drug?'Included':'N/A',
    rating: (typeof p.stars==='number' && p.stars>0) ? p.stars : null,
    type: p.type,
    sanction: !!p.sanction,
    // Represented or not is DATA ONLY, for the lead row (AB 2026-10-02, T-017 e). Every plan in a
    // licensed state gets the same button; none on a CMS-sanctioned plan; none if the signed
    // carrier/licence file did not load (fail closed).
    rep: rep,
    agent: !p.sanction && leadOK() && !!_rep
  };
}

// Load one state's 2027 plan file. JSON via fetch, not an injected script tag: the old
// `const CMS_STATE_DATA` threw "already declared" on the second state, so a retry with a ZIP
// in a different state silently kept the first state's plans.
let _planCache={};
function loadPlanData(stateCode){
  if(_planCache[stateCode]) return Promise.resolve(_planCache[stateCode]);
  return fetch('data/plans_'+stateCode+'_'+PLAN_FILE_YEAR+'.json')
    .then(r=>{
      // Cloudflare serves the homepage with a 200 for unknown paths: non-JSON means missing.
      const ct=(r.headers.get('content-type')||'');
      if(!r.ok||ct.indexOf('json')===-1) throw new Error('no plan file for '+stateCode);
      return r.json();
    })
    .then(j=>{_planCache[stateCode]=j;return j;});
}
// Load ZIP index (small file, maps ZIP to state code)
let _zipIndex = null;
function loadZipIndex(){
  if(_zipIndex) return Promise.resolve(_zipIndex);
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'data/zip_index.js';
    s.onload = () => {
      if(typeof ZIP_INDEX !== 'undefined'){
        _zipIndex = ZIP_INDEX;
        resolve(_zipIndex);
      } else reject(new Error('ZIP index not found'));
    };
    s.onerror = () => reject(new Error('Failed to load ZIP index'));
    document.head.appendChild(s);
  });
}

// Main: look up plans for a ZIP code
async function loadPlansForZip(zip){
  try {
    const idx = await loadZipIndex();
    const state = idx[zip];
    if(!state) { D._zipValid=false; PLANS=[]; return; }
    const [data] = await Promise.all([loadPlanData(state), loadRepresented()]);
    const county = data.zips?.[zip];
    if(!county) { D._zipValid=false; PLANS=[]; return; }
    D.county = county;
    D.state = state;
    D._zipValid = true;
    _planMeta = {year:data.year, source:data.source||''};
    // This county's plans + plans sold statewide (PDPs), deduped
    const ids = [...(data.counties?.[county]||[]), ...(data.counties?.[data.statewide||'All Counties']||[])];
    const seen = new Set();
    const raw = ids.filter(i=>{ if(seen.has(i)) return false; seen.add(i); return true; }).map(i=>data.plans[i]);
    // Neutral default order: lowest monthly premium (no scoring, no "best" labels). The
    // visitor can re-sort. Plans CMS gave no premium for go last.
    PLANS = sortPlans(raw.map(p => cmsToWidget(p, state)), 'premium');

    // Medigap / Supplement plans (state-level data, Medicare.gov, March 2026, labelled as such)
    try {
      const mgData = await loadMedigapData();
      if(mgData[state]){
        PLANS = PLANS.concat(medigapToWidgetPlans(mgData[state]));
      }
    } catch(e2){ console.warn('Medigap data merge skipped:', e2.message); }
  } catch(e) {
    console.warn('Plan data load failed:', e.message);
    PLANS=[];
  }
}

async function retryZip(){

function dobStep(nextFn){
  prog(15);
  _cb.dob=nextFn;
  const existing = (D.dob_month&&D.dob_day&&D.dob_year) ? `${D.dob_month}/${D.dob_day}/${D.dob_year}` : '';
  wb().innerHTML=`${bk()}
    ${bm(lang==='en'?'When is your date of birth?':'\u00BFCu\u00E1l es su fecha de nacimiento?')}
    <div class="input-group"><label>${lang==='en'?'Date of birth':'Fecha de nacimiento'}</label>
    <input class="input-field" type="tel" inputmode="numeric" id="dobInput" placeholder="${lang==='en'?'MM / DD / YYYY':'MM / DD / AAAA'}" value="${existing}" maxlength="14"
      oninput="formatDob(this)">
    <p style="font-size:12px;color:#999;margin-top:4px">${lang==='en'?'month / day / year':'mes / d\u00EDa / a\u00F1o'}</p>
    </div>
    ${bp(t('next'),'parseDob();go(_cb.dob)')}
    ${skip(lang==='en'?"I'd rather not say":'Prefiero no decir',"D.dob_month='';D.dob_day='';D.dob_year='';go(_cb.dob)")}`;
  document.getElementById('dobInput')?.focus();
}

function formatDob(el){
  let raw=el.value.replace(/[^\d]/g,'');
  if(raw.length>8) raw=raw.slice(0,8);
  const mm=raw.slice(0,2), dd=raw.slice(2,4), yyyy=raw.slice(4,8);
  let v=mm;
  if(raw.length>2) v+=(' / '+dd);
  if(raw.length>4) v+=(' / '+yyyy);
  el.value=v;
  el.setSelectionRange(v.length,v.length);
}
function parseDob(){
  const v=document.getElementById('dobInput')?.value||'';
  const parts=v.replace(/\s/g,'').split('/');
  if(parts.length===3){
    const mm=+parts[0], dd=+parts[1], yy=+parts[2];
    if(mm>=1 && mm<=12 && dd>=1 && dd<=31 && yy>=1920 && yy<=2010){
      // Validate actual calendar date (catches Feb 30, Apr 31, etc.)
      const test=new Date(yy,mm-1,dd);
      if(test.getFullYear()!==yy||test.getMonth()!==mm-1||test.getDate()!==dd) return false;
      D.dob_month=parts[0];D.dob_day=parts[1];D.dob_year=parts[2];
      return true;
    }
  }
  return false;
}


// ── AGE / ENROLLMENT CALC ──
function getAge(){
  const m=+D.dob_month,d=+D.dob_day,y=+D.dob_year;
  if(!m||!d||!y)return null;
  const now=new Date();
  const bday=new Date(y,m-1,d);
  if(isNaN(bday.getTime()))return null;
  let age=now.getFullYear()-y;
  const thisYearBday=new Date(now.getFullYear(),m-1,d);
  if(now<thisYearBday)age--;
  return age;
}
function getEnrollmentWindow(){
  const m=+D.dob_month,d=+D.dob_day,y=+D.dob_year;
  if(!m||!d||!y||y<1900||y>2010)return null;
  let iepMonth=m-3, iepYear=y+65;
  if(iepMonth<=0){iepMonth+=12;iepYear--;}
  if(iepMonth<1||iepMonth>12)return null;
  return {month:iepMonth, year:iepYear};
}
function monthName(m){
  const en=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const es=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const idx=Math.max(0,Math.min(11,(+m||1)-1));
  return (lang==='en'?en:es)[idx];
}
function timeAwayStr(months){
  if(months<=18){
    return lang==='en'?`about <strong>${months} months</strong> away`:`en aproximadamente <strong>${months} meses</strong>`;
  }
  const y=Math.floor(months/12), rm=months%12;
  if(lang==='en'){
    if(rm===0) return `about <strong>${y} year${y>1?'s':''}</strong> away`;
    return `about <strong>${y} year${y>1?'s':''} and ${rm} month${rm>1?'s':''}</strong> away`;
  } else {
    if(rm===0) return `en aproximadamente <strong>${y} a\u00F1o${y>1?'s':''}</strong>`;
    return `en aproximadamente <strong>${y} a\u00F1o${y>1?'s':''} y ${rm} mes${rm>1?'es':''}</strong>`;
  }
}

// No scoring and no "Your Result / Lowest Cost / Added Benefits / High Rating" labels (T-017,
// PROTECT 2026-10-02): ranking plans for a person from their answers is advice that needs a
// licensed agent and a Scope of Appointment. The public list is the same for everyone in the
// county, in a neutral order the visitor chooses.
// Card, results and compare follow the mockups AB approved for staging on 2026-10-02:
// DECIDE/now/2026-10-02_widget-2027-card-mockup.html, ..._results-mockup.html,
// ..._missing-and-compare-mockup.html (T-017 b2-b13).
function orderedPlans(){ return sortPlans(filterByType(PLANS), _sortMode); }

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const L=(en,es)=>lang==='en'?en:es;
function planYear(){return (_planMeta&&_planMeta.year)||PLAN_FILE_YEAR;}
function usd(v,cents){
  if(v===null||v===undefined) return null;
  const o=cents?{minimumFractionDigits:2,maximumFractionDigits:2}:{maximumFractionDigits:2};
  return (v<0?'-$':'$')+Math.abs(v).toLocaleString('en-US',o);
}
// Monthly premium: "$0" when zero, otherwise to the cent ("$45.00"), as CMS publishes it.
function premUsd(v){return v===null||v===undefined?null:(v===0?'$0':usd(v,true));}
// CMS cost strings from the plan file ("$1495", "$0-$100", "$10 / 20%"): thousands separators,
// ranges in words. Escaped first; the strings come from a public CMS file.
function money(s){
  if(s===null||s===undefined||s==='') return null;
  return esc(s).replace(/\d{4,}(?:\.\d+)?/g,m=>{const p=m.split('.');return p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',')+(p[1]?'.'+p[1]:'');})
    .replace(/(\$[\d,.]+|[\d.]+%)-(\$[\d,.]+|[\d.]+%)/g,(_,a,b)=>a+L(' to ',' a ')+b);
}
function isZero(s){return s==='$0'||s==='$0.00'||s==='0%';}
const NOINC=()=>L('Not included','No incluido');
function noInfo(){return L('No information','Sin información');}
const OPTX=()=>L('Optional, extra premium','Opcional, con prima adicional');
const PERW={mo:['a month','al mes'],'3mo':['every 3 months','cada 3 meses'],'6mo':['every 6 months','cada 6 meses'],
  yr:['a year','al año'],'2y':['every 2 years','cada 2 años'],'3y':['every 3 years','cada 3 años']};
const PERS={mo:['/mo','/mes'],'3mo':['/3 mo','/3 meses'],'6mo':['/6 mo','/6 meses'],yr:['/yr','/año'],'2y':['/2 yrs','/2 años'],'3y':['/3 yrs','/3 años']};
function perw(p){const w=PERW[p];return w?' '+L(w[0],w[1]):'';}
// A dollar maximum CMS publishes, always with its period: "up to $150 a year". No amount -> null, never a guess.
function upTo(a,bold){if(!a||a.amt==null) return null;const v=usd(a.amt)+perw(a.per);return L('up to ','hasta ')+(bold===false?v:'<b>'+v+'</b>');}
const EAR={per:[' per ear',' por oído'],both:[', both ears',', ambos oídos'],one:[', one ear',', un oído']};
function ear(e){const w=EAR[e];return w?L(w[0],w[1]):'';}

// CMS Overall Star Rating. CMS has not published 2027 ratings (blank in the landscape file), so a
// null rating says exactly that. Never carry 2026 stars onto a 2027 plan.
function rStar(r){
  if(r!==null&&r!==undefined) return L('CMS rating ','Calificación CMS ')+planYear()+': ★ '+r;
  return L('CMS rating: not yet published','Calificación CMS: aún no publicada');
}
function provenanceNote(){
  if(!_planMeta||!_planMeta.year) return '';
  const y=_planMeta.year, src=_planMeta.source||'CMS';
  return L(`Plan year ${y} costs and benefits. Source: ${src}. Costs may vary; your plan documents are the final word.`,
           `Costos y beneficios del año del plan ${y}. Fuente: ${src}. Los costos pueden variar; los documentos de su plan son la palabra final.`);
}
function provenanceHTML(){
  const t=provenanceNote(); if(!t) return '';
  return `<p style="font-size:11px;line-height:1.5;color:#777;margin:10px 2px 0">${esc(t)}</p>`;
}

// ---- benefit text, ES + EN. CMS PBP category names, one fixed translation (T-017 b4) ----
function hospText(h,short){
  if(!h) return null;
  let s;
  if(h.mc) s=L('Same as Original Medicare','Igual que Medicare Original');
  else if(h.days){
    const nz=h.days.filter(d=>!isZero(d[0])), z=nz.length<h.days.length;
    if(!nz.length) s=short?'$0':'<b>$0</b> '+L('per stay','por estadía');
    else if(short) s=nz.map(d=>`${money(d[0])}${L('/day','/día')}, ${L('days','días')} ${d[1]}-${d[2]}`).join(' · ');
    else s=nz.map(d=>`<b>${money(d[0])} ${L('per day','por día')}</b>, ${L('days','días')} ${d[1]} ${L('to','a')} ${d[2]}`).join(' · ')+(z?` · <b>$0</b> ${L('other days','los demás días')}`:'');
  } else if(h.stay) s=short?(isZero(h.stay)?'$0':money(h.stay)+' '+L('per stay','por estadía')):`<b>${money(h.stay)}</b> ${L('per stay','por estadía')}`;
  else return null;
  if(h.vary) s+=' '+L('(varies by hospital)','(varía según el hospital)');
  return s;
}
function tripsText(tr,short){
  if(tr===false) return null;          // not offered
  if(!tr) return undefined;            // unknown
  if(tr.unl) return L('Unlimited trips','Viajes ilimitados');
  if(tr.n==null) return L('Included','Incluido');
  const one=tr.n===1;
  if(short) return tr.n+' '+L(one?'trip':'trips',one?'viaje':'viajes')+perw(tr.per);
  const kind=tr.tt==='round'?L(one?'round trip':'round trips',one?'viaje de ida y vuelta':'viajes de ida y vuelta')
                            :L(one?'one-way trip':'one-way trips',one?'viaje de ida':'viajes de ida');
  return '<b>'+tr.n+' '+kind+perw(tr.per)+'</b>';
}
// Each returns {t:text, off:bool} or null when the plan file has no record (shown as "No information").
function dentalB(p,short){
  const d=p.dent; if(!d) return null;
  if(!d.prev&&!d.comp) return {t:p.dental==='optional'?OPTX():NOINC(),off:true};
  if(short) return {t:d.prev&&d.comp?L('Preventive and comprehensive','Preventivo e integral'):(d.prev?L('Preventive','Preventivo'):L('Comprehensive','Integral')),off:false};
  if(d.prev&&d.comp&&!d.pmax&&!d.cmax) return {t:L('Preventive and comprehensive dental','Dental preventivo e integral'),off:false};
  const parts=[];
  if(d.prev) parts.push(L('Preventive dental','Dental preventivo')+(d.pmax?' '+upTo(d.pmax):''));
  if(d.comp) parts.push(L('Comprehensive dental','Dental integral')+(d.cmax?' '+upTo(d.cmax):''));
  return {t:parts.join(' · '),off:false};
}
function visionB(p,short){
  const v=p.vis; if(!v) return null;
  if(!v.exam&&!v.wear) return {t:p.vision==='optional'?OPTX():NOINC(),off:true};
  if(short) return v.wear?{t:v.wmax?usd(v.wmax.amt)+perw(v.wmax.per):L('Included','Incluidos'),off:false}:{t:NOINC(),off:true};
  const ex=v.exam?L('Routine eye exam','Examen de la vista de rutina')+' '+(v.exam_cs?'<b>'+money(v.exam_cs)+'</b>':L('included','incluido'))
                 :L('Routine eye exam: not included','Examen de la vista de rutina: no incluido');
  const ew=v.wear?(v.wmax?L('Eyewear','Anteojos')+' '+upTo(v.wmax):L('Eyewear included','Anteojos incluidos'))
                 :L('Eyewear: not included','Anteojos: no incluidos');
  return {t:ex+' · '+ew,off:false};
}
function hearingB(p,short){
  const h=p.hear; if(!h) return null;
  if(!h.exam&&!h.aids) return {t:p.hearing==='optional'?OPTX():NOINC(),off:true};
  const aid=h.amax?upTo(h.amax,!short)+ear(h.amax.ear):(h.acopay?(short?money(h.acopay):'<b>'+money(h.acopay)+'</b>'+L(' per aid',' por audífono')):null);
  if(short) return h.aids?{t:(aid||L('Included','Incluidos'))+(h.amax&&h.acopay?' + '+L('copay ','copago ')+money(h.acopay):''),off:false}:{t:NOINC(),off:true};
  const ex=h.exam?L('Routine hearing exam','Examen de audición de rutina')+' '+(h.exam_cs?'<b>'+money(h.exam_cs)+'</b>':L('included','incluido'))
                 :L('Routine hearing exam: not included','Examen de audición de rutina: no incluido');
  // Allowance AND a per-aid copay: show both, never only the allowance (it would understate the cost).
  const both=h.amax&&h.acopay?' · '+L('copay','copago')+' <b>'+money(h.acopay)+'</b>'+L(' per aid',' por audífono'):'';
  const ai=h.aids?L('Hearing aids','Audífonos')+' '+(aid||L('included','incluidos'))+both:L('Hearing aids: not included','Audífonos: no incluidos');
  return {t:ex+' · '+ai,off:false};
}
function otcB(p,short){
  const o=p.otc; if(!o) return null;
  if(o.has) return {t:o.amt!=null?(short?'':'<b>')+usd(o.amt)+perw(o.per)+(short?'':'</b>'):L('Included','Incluido'),off:false};
  return {t:o.optional?OPTX():NOINC(),off:true};
}
function fitB(p){
  if(p.fit===null||p.fit===undefined) return null;
  if(p.fit==='opt') return {t:OPTX(),off:true};
  return p.fit?{t:L('Included','Incluido'),off:false}:{t:NOINC(),off:true};
}

// ---- the card: ONE LIST, label left, value right (T-017 b18, AB 2026-10-02) ----
// Two empty states, never mixed (b17): "No incluido" = CMS says the plan does not cover it (grey,
// plain); "Sin información" = the CMS file has no value (grey, italic). Never $0 for a missing
// value, never red. A value is {t, sub, off} or null (null = Sin información).
const PIC={
  dental:'<path d="M7 3c-2.5 0-4 2-4 4.5 0 3 1.5 4.5 2 7 .5 3 1 6.5 2.5 6.5S9 17 10 15.5c.5-.8 1.5-.8 2 0 1 1.5 1 5.5 2.5 5.5S16.5 17.5 17 14.5c.5-2.5 2-4 2-7C19 5 17.5 3 15 3c-1.5 0-2.3.8-3 .8S8.5 3 7 3z"/>',
  vision:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  hearing:'<path d="M6 9a6 6 0 1 1 12 0c0 3-2 4-3 5.5S14 18 12.5 19.5 9 20 8 18"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0"/>',
  otc:'<path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  fit:'<path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/>',
  cost:'<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.8 0-3 .9-3 2.1 0 2.9 6 1.6 6 4.4 0 1.2-1.2 2.1-3 2.1-1.4 0-2.6-.6-3-1.6M12 6.5v1.5M12 16v1.5"/>',
  visits:'<path d="M6 3v6a4 4 0 0 0 8 0V3"/><path d="M10 13v3a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="12" r="2"/>',
  star:'<path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/>',
  hosp:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 7v6M9 10h6M9 21v-4h6v4"/>',
  drug:'<rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-45 12 12)"/><path d="M8.5 8.5l7 7"/>'
};
const V=(t,sub,off)=>({t,sub:sub||'',off:!!off});
const OFF=(sub)=>V(NOINC(),sub,true);
function vz(s){return s==null?null:V(money(s));}            // a CMS cost string, or Sin información
function per2(per){const w=PERS[per];return w?L(w[0],w[1]):'';}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
function upToS(a){return a&&a.amt!=null?cap(L('up to ','hasta '))+usd(a.amt)+per2(a.per):null;}   // "Hasta $500/año"
function examSub(on,cs){return on?L('exam ','examen ')+(cs?money(cs):L('included','incluido')):L('no routine exam','sin examen de rutina');}
// Beneficios extra, list form. Optional (extra-premium) supplements read as not included in the base plan.
function dentalL(p){
  const d=p.dent; if(!d) return null;
  if(!d.prev&&!d.comp) return p.dental==='optional'?V(OPTX(),'',true):OFF();
  const pv=d.pmax?L('Preventive up to ','Preventivo hasta ')+usd(d.pmax.amt)+per2(d.pmax.per):L('Preventive','Preventivo');
  const cp=d.cmax?L('Comprehensive up to ','Integral hasta ')+usd(d.cmax.amt)+per2(d.cmax.per):L('Comprehensive','Integral');
  if(d.prev&&d.comp){
    if(!d.pmax&&!d.cmax) return V(L('Preventive and comprehensive','Preventivo e integral'));
    return V(cp, d.pmax?pv.charAt(0).toLowerCase()+pv.slice(1):L('and preventive','y preventivo'));
  }
  return V(d.prev?pv:cp);
}
function visionL(p){
  const v=p.vis; if(!v) return null;
  if(!v.exam&&!v.wear) return p.vision==='optional'?V(OPTX(),'',true):OFF();
  if(!v.wear) return OFF(examSub(true,v.exam_cs));
  return V(upToS(v.wmax)||L('Included','Incluidos'),examSub(v.exam,v.exam_cs));
}
function hearingL(p){
  const h=p.hear; if(!h) return null;
  if(!h.exam&&!h.aids) return p.hearing==='optional'?V(OPTX(),'',true):OFF();
  if(!h.aids) return OFF(examSub(true,h.exam_cs));
  const ex=examSub(h.exam,h.exam_cs);
  if(h.amax&&h.amax.amt!=null){
    // Allowance AND a per-aid copay: show both, never only the allowance (it would understate the cost).
    const cp=h.acopay?L('copay ','copago ')+money(h.acopay)+L(' per aid',' por audífono')+' · ':'';
    return V(upToS(h.amax)+ear(h.amax.ear),cp+ex);
  }
  if(h.acopay) return V(money(h.acopay),ex);
  return V(L('Included','Incluidos'),ex);
}
function otcL(p){
  const o=p.otc; if(!o) return null;
  if(o.has) return V(o.amt!=null?usd(o.amt)+per2(o.per):L('Included','Incluido'));
  return o.optional?V(OPTX(),'',true):OFF();
}
function fitL(p){
  if(p.fit===null||p.fit===undefined) return null;
  if(p.fit==='opt') return V(OPTX(),'',true);
  return p.fit?V(L('Included','Incluido')):OFF();
}
// Hospital y cirugía, list form.
function hospL(h){
  if(!h) return null;
  let v;
  if(h.mc) v=V(L('Same as Original Medicare','Igual que Medicare Original'));
  else if(h.days){
    const nz=h.days.filter(d=>!isZero(d[0])), z=nz.length<h.days.length;
    if(!nz.length) v=V('$0 '+L('per stay','por estadía'));
    else v=V(nz.map(d=>`${money(d[0])} ${L('per day','por día')}, ${L('days','días')} ${d[1]} ${L('to','a')} ${d[2]}`).join(' · '),z?'$0 '+L('other days','los demás días'):'');
  } else if(h.stay) v=V(money(h.stay)+' '+L('per stay','por estadía'));
  else return null;
  if(h.vary) v.sub=(v.sub?v.sub+' · ':'')+L('varies by hospital','varía según el hospital');
  return v;
}
function tripsL(tr){
  if(tr===false) return OFF();
  if(!tr) return null;
  if(tr.unl) return V(L('Unlimited trips','Viajes ilimitados'));
  if(tr.n==null) return V(L('Included','Incluido'));
  const one=tr.n===1;
  return V(tr.n+' '+L(one?'trip':'trips',one?'viaje':'viajes')+per2(tr.per),
           tr.tt==='round'?L('round trip','de ida y vuelta'):(tr.tt==='oneway'?L('one way','de ida'):''));
}
// One list row. big=true for the Costos rows (b18: the one emphasis).
function lrow(label,v,icon){
  const off=v?v.off:false;
  const ic=icon?`<svg class="ri${!v||off?' off':''}" viewBox="0 0 24 24">${PIC[icon]}</svg>`:'';
  let cls, txt;
  if(!v){cls='na';txt=noInfo();}
  else{cls=off?'off':(/^\$0(?:\.00)?(?:$|\/| por | per )/.test(String(v.t).replace(/<[^>]+>/g,'').trim())?'z':'');txt=v.t;}
  return `<div class="lr"><span class="ll">${ic}${label}</span><span class="lv${cls?' '+cls:''}">${txt}${v&&v.sub?`<span class="lsub">${v.sub}</span>`:''}</span></div>`;
}
function lsec(icon,title,rows,cls){return `<div class="ls${cls?' '+cls:''}"><div class="lh"><svg class="hi" viewBox="0 0 24 24">${PIC[icon]}</svg>${title}</div>${rows}</div>`;}

const TIER_ES={'Preferred Generic':'Genérico preferido','Generic':'Genérico','Preferred Brand':'Marca preferida',
  'Non-Preferred Drug':'No preferido','Non-Preferred Brand':'Marca no preferida','Specialty Tier':'Especialidad','Specialty':'Especialidad','Injectable Drugs':'Medicamentos inyectables'};
// Unmapped CMS labels (e.g. "Select Care Drugs") are shown as CMS wrote them, never dropped.
function tierName(t){const l=(t.label||'').trim();return l?(lang==='en'?esc(l):(TIER_ES[l]||esc(l))):L('Tier '+t.t,'Nivel '+t.t);}
function andList(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+L(' and ',' y ')+a[a.length-1];}

// Medicamentos (open part). b6b: one column ("standard pharmacy") or two (standard / preferred),
// never mixed, never an empty tier. b17: a plan without Part D says so in one line.
function tiersHTML(p){
  if(p.drug!=='Included') return lsec('drug',L('Drugs','Medicamentos'),`<p class="nod">${L('This plan does not include drug coverage (Part D).','Este plan no incluye medicamentos (Parte D).')}</p>`);
  const t=p.tiers||[];
  if(!t.length){
    const msg=p.dbt==='1'?L('Standard Part D benefit, no tiers.','Beneficio estándar de la Parte D, sin niveles.'):`<i>${noInfo()}</i>`;
    return lsec('drug',L('Drugs','Medicamentos'),`<p class="nod">${msg}</p>`);
  }
  const two=t.some(x=>x.p!=null);
  const cell=v=>v==null?(two?`<span class="lv2 off">–</span>`:`<span class="lv na">${noInfo()}</span>`)
                         :`<span class="${two?'lv2':'lv'}${isZero(v)?' z':''}">${money(v)}</span>`;
  const head=two?`<div class="lr th"><span class="ll"></span><span class="lv2">${L('Standard','Estándar')}</span><span class="lv2">${L('Preferred','Preferida')}</span></div>`:'';
  const rows=t.map(x=>`<div class="lr"><span class="ll"><span class="tn">${x.t}</span>${tierName(x)}</span>${cell(x.v)}${two?cell(x.p):''}</div>`).join('');
  const fine=[];
  if(p.ins) fine.push(L(`Insulin: at most ${money(p.ins)} a month.`,`Insulina: máximo ${money(p.ins)} al mes.`));
  if(p.ded>0&&p.noded&&p.noded.length){
    const n=p.noded.map(String);
    fine.push(L(`The ${usd(p.ded)} drug deductible does not apply to tier${n.length>1?'s':''} ${andList(n)}.`,
                `El deducible de medicamentos de ${usd(p.ded)} no aplica ${n.length>1?'a los niveles':'al nivel'} ${andList(n)}.`));
  }
  if(two&&t.some(x=>x.v==null||x.p==null)) fine.push(L('– = not in the CMS file for this plan.','– = no figura en el archivo de CMS para este plan.'));
  return `<div class="ls"><div class="lh"><svg class="hi" viewBox="0 0 24 24">${PIC.drug}</svg>${L('Drugs','Medicamentos')}</div>
    <div class="subt">${two?L('(1 month, standard or preferred pharmacy)','(1 mes, farmacia estándar o preferida)'):L('(1 month, standard pharmacy)','(1 mes, farmacia estándar)')}</div>
    ${head}${rows}${fine.map(f=>`<p class="pc-fine">${f}</p>`).join('')}</div>`;
}
// What a card offers at the bottom (b8, e, f, g): the same button on every plan in a licensed
// state, none on a CMS-sanctioned plan, information only where we are not licensed.
function planAction(p){
  if(p.sanction) return `<p class="plan-flag warn">${L('CMS sanction, see','Sanción de CMS, consulte')} <a href="https://www.medicare.gov" target="_blank" rel="noopener">Medicare.gov</a></p>`;
  if(!p.agent) return `<p class="plan-flag">${L('Information only','Solo información')}</p>`;
  return `<button class="pc-btn" onclick="pickPlan('${esc(p.id)}')">${L('Help me choose','Ayúdeme a elegir')}</button>`;
}
function carrierColor(p){return CARRIER_COLORS[p.carrier]||'#c9d1d8';}
function cmpBox(p){
  if(p._medigap) return '';
  const on=selPlans.includes(p.id);
  return `<label class="pc-cmp"><input type="checkbox" data-pid="${esc(p.id)}" ${on?'checked':''} onchange="toggleCmp(this)"> ${L('Compare','Comparar')}</label>`;
}
const TOG=()=>[L('See hospital and drugs','Ver hospital y medicamentos'),L('See less','Ver menos')];

    const amb=p.amb||{};
    more=lsec('hosp',L('Hospital and surgery','Hospital y cirugía'),
      lrow(L('Inpatient hospital stay','Hospitalización'),hospL(p.hosp))+

// ---- lead context: which plans the visitor saw, and whether we represent each (T-017 b8, e) ----
function planLeadTag(p){return `${p.name} [${p.id}] represented: ${p._medigap?'n/a (Medigap)':(p.rep?'yes':'no')}`;}
function pickPlan(id){
  const p=PLANS.find(x=>x.id===id); if(!p) return;
  if(!p._medigap&&!p.agent) return;   // sanctioned, unlicensed state, or carrier list unavailable: no lead capture
  if(p._medigap&&(!leadOK()||(D.state&&!_rep))) return;
  D.selectedPlan=p.name; D.selectedPlanId=p.id;
  D.plansSeen=planLeadTag(p); D.represented=p._medigap?'n/a':(p.rep?'yes':'no');
  go(planEnroll);
}

// ── FILTER PILLS (b14) ── one pill selected at a time. "Todos" = every plan that is not a
// special-needs plan (LA County: 70 = 64 HMO incl. HMO-POS + 6 PPO). Special-needs plans appear
// only under their own pill. Drug-only plans (PDP) and Medigap get their own pill, shown only
// where the ZIP has them, so a visitor looking for one can still find it.
let _typeFilter='all';
function isSNP(p){return !p._medigap&&(p.cat==='SNP'||!!p.snp||/SNP/.test(p.type||''));}
function isPDP(p){return !p._medigap&&p.cat==='PDP';}
function inTodos(p){return !p._medigap&&!isPDP(p)&&!isSNP(p);}
const PILLS=[
  {id:'all',  en:'All',                  es:'Todos',                  f:inTodos},
  {id:'hmo',  en:'HMO',                  es:'HMO',                    f:p=>inTodos(p)&&/HMO/.test(p.type||'')},
  {id:'ppo',  en:'PPO',                  es:'PPO',                    f:p=>inTodos(p)&&/PPO/.test(p.type||'')},
  {id:'zero', en:'$0 premium',           es:'$0 prima',               f:p=>inTodos(p)&&p.premium===0},
  {id:'snp',  en:'Special needs',        es:'Necesidades especiales', f:isSNP},
  {id:'pdp',  en:'Drug plans (Part D)',  es:'Medicamentos (Parte D)', f:isPDP, opt:true},
  {id:'supp', en:'Medigap',              es:'Medigap',                f:p=>!!p._medigap, opt:true},
];
function filterByType(plans){
  const pl=PILLS.find(x=>x.id===_typeFilter)||PILLS[0];
  return plans.filter(pl.f);
}
function setType(v){_typeFilter=v;_shown=3;selPlans=[];flowResults();}
function pillsHTML(){
  return `<div class="pills" role="group" aria-label="${L('Plan type','Tipo de plan')}">`+PILLS.map(x=>{
    const n=PLANS.filter(x.f).length;
    if(x.id!=='all'&&!n) return '';
    const on=_typeFilter===x.id;
    return `<button class="pill${on?' on':''}" aria-pressed="${on}" onclick="setType('${x.id}')">${x[lang]} <span>${n}</span></button>`;
  }).join('')+`</div>`;
}

// ── SORT (b14 "Orden B") ── neutral, visitor-chosen orders. Default: lowest monthly premium, then
// lowest max out-of-pocket (b10). Never favours plans we represent.
let _sortMode='premium';
function sortModes(){
  const m=[
    {id:'premium', en:'Lowest monthly premium',   es:'Prima mensual más baja',             sen:'Lowest premium',       ses:'Prima más baja'},
    {id:'moop',    en:'Lowest max out-of-pocket', es:'Máximo de bolsillo más bajo',        sen:'Lowest out-of-pocket', ses:'Máx. bolsillo más bajo'},
    {id:'ded',     en:'Lowest drug deductible',   es:'Deducible de medicamentos más bajo', sen:'Lowest deductible',    ses:'Deducible más bajo'},
  ];
  // Rating sort only once CMS has published ratings for some plan here.
  if(PLANS.some(p=>p.rating!==null&&p.rating!==undefined)) m.push({id:'star', en:'CMS rating', es:'Calificación CMS', sen:'CMS rating', ses:'Calificación CMS'});
  return m;
}
function setSort(v){_sortMode=v;_shown=3;flowResults();}
function sortMenu(el){const w=el.closest('.schip-wrap');const o=!w.classList.contains('open');w.classList.toggle('open',o);el.setAttribute('aria-expanded',o);}
document.addEventListener('click',e=>{if(!e.target.closest||e.target.closest('.schip-wrap'))return;document.querySelectorAll('.schip-wrap.open').forEach(w=>w.classList.remove('open'));});
function sortHTML(){
  const ms=sortModes(), cur=ms.find(m=>m.id===_sortMode)||ms[0];
  return `<div class="sortB"><div class="sbrow"><span class="sbl">${L('Sorted by','Ordenados por')}</span>
    <div class="schip-wrap"><button class="schip" aria-haspopup="true" aria-expanded="false" onclick="sortMenu(this)"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg><span>${L(cur.sen,cur.ses)}</span><span class="cv">▾</span></button>
      <div class="pop" role="menu">${ms.map(m=>`<button class="po${m.id===cur.id?' on':''}" role="menuitemradio" aria-checked="${m.id===cur.id}" onclick="setSort('${m.id}')"><span class="ck">✓</span>${m[lang]}</button>`).join('')}</div></div></div></div>`;
}
// Unknown values (null) always sort last; ties fall back to plan name so the order is stable.
function _asc(x,y){const a=(x===null||x===undefined)?Infinity:x, b=(y===null||y===undefined)?Infinity:y; return a===b?0:(a<b?-1:1);}
function sortPlans(plans, mode){
  const s=[...plans], nm=(a,b)=>String(a.name).localeCompare(String(b.name));
  // Medigap entries carry placeholder 0s for MOOP/deductible: they have neither, so they sort as unknown.
  const dd=p=>p._medigap||p.drug!=='Included'?null:p.ded, mo=p=>p._medigap||p.cat==='PDP'?null:p.moop;
  if(mode==='moop')      s.sort((a,b)=>_asc(mo(a),mo(b))||_asc(a.premium,b.premium)||nm(a,b));
  else if(mode==='ded')  s.sort((a,b)=>_asc(dd(a),dd(b))||_asc(a.premium,b.premium)||_asc(mo(a),mo(b))||nm(a,b));
  else if(mode==='star') s.sort((a,b)=>_asc(a.rating==null?null:-a.rating,b.rating==null?null:-b.rating)||_asc(a.premium,b.premium)||nm(a,b));
  else                   s.sort((a,b)=>_asc(a.premium,b.premium)||_asc(mo(a),mo(b))||nm(a,b));
  return s;
}

let _shown=3, _inAllPlans=false;

function zipEdit(){const z=document.getElementById('zl');if(!z)return;z.classList.add('edit');const i=document.getElementById('zin');if(i){i.value='';i.focus();}}
// "Cambiar" changes the ZIP without leaving the results. A ZIP we have no plans for keeps the
// current results on screen and says so, instead of emptying the page.
async function zipChange(){
  const i=document.getElementById('zin'), e=document.getElementById('zerr');
  const v=((i&&i.value)||'').replace(/\D/g,'').slice(0,5);
  if(v.length!==5){if(e)e.textContent=L('Please enter all 5 digits.','Escriba los 5 dígitos.');return;}
  const keep={PLANS,zip:D.zip,county:D.county,state:D.state,valid:D._zipValid,meta:_planMeta};
  D.zip=v; D.county=''; D._zipValid=undefined; PLANS=[];
  await loadPlansForZip(v);
  if(D._zipValid===false||!PLANS.length){
    PLANS=keep.PLANS; D.zip=keep.zip; D.county=keep.county; D.state=keep.state; D._zipValid=keep.valid; _planMeta=keep.meta;
    const e2=document.getElementById('zerr');
    if(e2) e2.textContent=L(`We do not have plan data for ${v}. Check the ZIP code, or call us at (310) 597-9142.`,`No tenemos datos de planes para ${v}. Verifique el código postal, o llámenos al (310) 597-9142.`);

function cmpAllBtn(list){
  const c=list.filter(p=>!p._medigap).slice(0,3);
  if(c.length<2) return '';
  return `<button class="cmpall" onclick="compareFirst()"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="16" rx="1.5"/><rect x="16" y="4" width="5" height="16" rx="1.5"/></svg>${L(`Compare these ${c.length} plans`,`Comparar estos ${c.length} planes`)}</button>`;

function moreBtn(total){
  if(total<=_shown) return '';

}
function listHTML(list){
  const first=list.slice(0,Math.min(3,_shown)).map(p=>planCard(p,true)).join('');
  const rest=list.slice(3,_shown).map(p=>planCard(p,true)).join('');

function showMore(){
  const list=orderedPlans(), from=_shown;

  const box=document.getElementById('plist'), m=document.getElementById('pmore');
  if(!box){flowResults();return;}
  box.insertAdjacentHTML('beforeend',list.slice(from,_shown).map(p=>planCard(p,true)).join(''));
  if(m) m.innerHTML=moreBtn(list.length);
}
function cbarHTML(){return `<div class="cbar" id="cbar"><span class="n" id="cbarN"></span><button id="cbarGo" onclick="go(flowCompare)">${L('Compare','Comparar')}</button></div>`;}
function updBar(msg){

}
let _barT=0;
function toggleCmp(el){
  const id=el.getAttribute('data-pid'), i=selPlans.indexOf(id);
  if(el.checked){
    if(i<0){
      if(selPlans.length>=3){el.checked=false;updBar(L('You can compare up to 3 plans','Puede comparar hasta 3 planes'));clearTimeout(_barT);_barT=setTimeout(()=>updBar(),2500);return;}
      selPlans.push(id);

function compareFirst(){selPlans=orderedPlans().filter(p=>!p._medigap).slice(0,3).map(p=>p.id);go(flowCompare);}

async function flowResults(){
  prog(82); _inAllPlans=false; _plansView=true;
  if(PLANS.length===0 && D.zip) await loadPlansForZip(D.zip);
  // Some rural counties have only special-needs, drug-only or Medigap plans: never open on an empty

  if(_typeFilter==='all'&&PLANS.length&&!PLANS.some(inTodos)){const pl=PILLS.find(x=>x.id!=='all'&&PLANS.some(x.f));if(pl)_typeFilter=pl.id;}
  const plans=orderedPlans();
  D.conditions=[...selConds];

      <div class="input-group zip-group">

// ── COMPARE (b9): up to 3 plans, same group order as the card, label column + plan columns,
// "show only differences", green only for $0, no "best" or winner, one button at the bottom.
function flowCompare(){
  prog(88); _plansView=true;
  const plans=selPlans.map(id=>PLANS.find(p=>p.id===id)).filter(p=>p&&!p._medigap).slice(0,3);
  if(plans.length<2){back();return;}
  // b17: "No incluido" (CMS: not covered) and "Sin información" (no value in the CMS file) are two different cells.
  const off=b=>b==null?{t:noInfo(),na:true}:b;
  const ma=p=>p.cat!=='PDP';
  const R=[], grp=g=>R.push({g});
  const row=(lab,cells,big)=>R.push({lab,cells,big});
  const txt=v=>v==null?{t:noInfo(),na:true}:{t:v,off:false};
  const dash={t:'–',off:true};
  grp(L('Costs','Costos'));
  row(L('Monthly premium','Prima mensual'),plans.map(p=>txt(premUsd(p.premium))),true);
  row(L('Max out-of-pocket','Máximo de bolsillo'),plans.map(p=>ma(p)?txt(usd(p.moop)):dash),true);
  row(L('Drug deductible','Deducible de medicamentos'),plans.map(p=>p.drug==='Included'?txt(usd(p.ded)):{t:L('No drug coverage','Sin medicamentos'),off:true}),true);
  if(plans.some(ma)){
    grp(L('Visits','Consultas'));
    [['pcp',L('Primary doctor','Médico primario')],['spec',L('Specialist','Especialista')],['er',L('Emergency room','Emergencias')],['urg',L('Urgent care','Urgencias')]]
      .forEach(([k,l])=>row(l,plans.map(p=>ma(p)?txt(money(p[k])):dash)));
    grp(L('Hospital and surgery','Hospital y cirugía'));
    row(L('Inpatient hospital stay','Hospitalización'),plans.map(p=>ma(p)?txt(hospText(p.hosp,true)):dash));
    row(L('Outpatient surgery (center)','Cirugía ambulatoria (centro)'),plans.map(p=>ma(p)?txt(money(p.asc)):dash));
    row(L('Ground ambulance','Ambulancia terrestre'),plans.map(p=>ma(p)?txt(p.amb&&money(p.amb.ground)):dash));
    row(L('Rides to appointments','Transporte a citas'),plans.map(p=>{if(!ma(p))return dash;const t=tripsText(p.trans,true);return t===null?{t:NOINC(),off:true}:txt(t);}));
    grp(L('Extra benefits','Beneficios extra'));
    row('Dental',plans.map(p=>ma(p)?off(dentalB(p,true)):dash));
    row(L('Eyewear','Anteojos'),plans.map(p=>ma(p)?off(visionB(p,true)):dash));
    row(L('Hearing aids','Audífonos'),plans.map(p=>ma(p)?off(hearingB(p,true)):dash));
    row('OTC',plans.map(p=>ma(p)?off(otcB(p,true)):dash));
    row(L('Fitness','Ejercicio'),plans.map(p=>ma(p)?off(fitB(p)):dash));
  }
  if(plans.some(p=>p.drug==='Included'&&p.tiers&&p.tiers.length)){
    grp(L('Drugs (1 month, standard pharmacy)','Medicamentos (1 mes, farmacia estándar)'));
    const ids=[...new Set(plans.flatMap(p=>(p.tiers||[]).map(t=>t.t)))].sort((a,b)=>a-b);
    ids.forEach(n=>{
      const named=plans.map(p=>(p.tiers||[]).find(t=>t.t===n)).find(Boolean);
      const same=plans.every(p=>{const t=(p.tiers||[]).find(x=>x.t===n);return t&&named&&t.label===named.label;});
      const lab=L('Tier ','Nivel ')+n+(same&&named?' · '+tierName(named):'');
      row(lab,plans.map(p=>{const t=(p.tiers||[]).find(x=>x.t===n);if(!t||t.v==null)return dash;return {t:money(t.v)+(same?'':' <span style="font-weight:600;color:#66727c">('+tierName(t)+')</span>'),off:false};}));
    });
  }
  const body=R.map(r=>{
    if(r.g) return `<tr class="grp"><td colspan="${plans.length+1}">${r.g}</td></tr>`;
    const same=r.cells.every(c=>c.t===r.cells[0].t);
    return `<tr class="r${same?' same':''}"><td class="lab">${r.lab}</td>${r.cells.map(c=>`<td class="v${r.big?' big':''}${c.off?' off':''}${c.na?' na':''}${!c.off&&!c.na&&isZero(String(c.t).replace(/<[^>]+>/g,''))?' zero':''}">${c.t}</td>`).join('')}</tr>`;
  }).join('');
  const head=`<tr><th class="l0">${L('Plans '+planYear(),'Planes '+planYear())}</th>${plans.map(p=>`<th style="--cc:${carrierColor(p)}"><span class="eb">${esc(p.carrier)}</span>${esc(shortPlan(p.name))}</th>`).join('')}</tr>`;
  const can=leadOK()&&!(D.state&&!_rep)&&plans.every(p=>p.agent);
  const sanct=plans.some(p=>p.sanction);
  wb().innerHTML=`${bk()}
    ${unlicensedNote()}
    <div class="cmp" id="cmp"><label class="tog"><input type="checkbox" onchange="document.getElementById('cmp').classList.toggle('diff',this.checked)"> ${L('Show only differences','Mostrar solo diferencias')}</label>
      <table><thead>${head}</thead><tbody>${body}</tbody></table>
      ${plans.some(p=>(p.tiers||[]).some(t=>t.p!=null))?`<p class="cmp-note">${L('Some plans cost less at a preferred pharmacy; open each plan to see both prices.','Algunos planes cuestan menos en una farmacia preferida; abra cada plan para ver los dos precios.')}</p>`:''}
      <div class="cmp-foot">${can?`<button class="pc-btn" onclick="helpCompare()">${L('Help me choose between these plans','Ayúdeme a elegir entre estos planes')}</button>`
        :(sanct?`<p class="plan-flag warn">${L('One of these plans has a CMS sanction, see','Uno de estos planes tiene una sanción de CMS, consulte')} <a href="https://www.medicare.gov" target="_blank" rel="noopener">Medicare.gov</a></p>`:`<p class="plan-flag">${L('Information only','Solo información')}</p>`)}</div>
    </div>
    ${provenanceHTML()}
    ${bs(L('Back to plans','Volver a planes'),'back()')}`;
}
// Column header name: drop the plan-type parenthetical and filler words so 3 columns fit at 375px.
// The full name is on every card; this is a label, not the plan's legal name.
function shortPlan(n){
  const s=String(n).replace(/\s*\(.*?\)\s*/g,' ').replace(/\bMedicare Advantage\b/gi,'').replace(/\bMedicare\b/gi,'').replace(/\bPlan\s*$/i,'').replace(/\s+/g,' ').trim();
  return s||String(n);
}
function helpCompare(){
  const plans=selPlans.map(id=>PLANS.find(p=>p.id===id)).filter(Boolean);
  if(!plans.length||!plans.every(p=>p.agent)) return;
  D.selectedPlan=L('Compared: ','Comparó: ')+plans.map(p=>p.name).join('; ');
  D.selectedPlanId=plans.map(p=>p.id).join(';');
  D.plansSeen=plans.map(planLeadTag).join(' | ');
  D.represented=plans.map(p=>p.rep?'yes':'no').join(';');
  go(helpChoose);
}

/* T-024 lead-send v1 (signed AB 2026-10-03). The SAME block is on every form on both sites:
   widget-v4, contacto, contact, careers. "Thank you" only when the leads script confirms the lead
   was saved AND the alert email went out; anything else gets an honest error with our number. No
   blind resend: it used to show "thank you" whether or not anything arrived. Staging and preview
   builds post to the staging copy of the script, so test leads never touch the live sheet setup. */
var LEAD_URL_PROD='https://script.google.com/macros/s/AKfycby8F8kXyTGFcCh2bzk92_sZeUKGlQPZ9RR-QmzYV6CfzBDbw6ANNOQ5JpnH2Z9PfJ_dEQ/exec';
var LEAD_URL_STAGING='https://script.google.com/macros/s/AKfycbwuoMJQEAK5aQ_JRQiAcJrscb0NOqfH9cFgvOKel4UpU_Z2FSiMh4Wd-BWLfTNRDAL5xw/exec';
var CONSENT_VERSION='2026-10-03-v1';
function leadURL(){return /(^|\.)staging\.|\.pages\.dev$|^localhost$|^127\./.test(location.hostname)?LEAD_URL_STAGING:LEAD_URL_PROD;}
function consentText(lang,btn){
  return lang==='en'
    ?'By tapping '+(btn||'Send')+', you agree that we may contact you by call, text or WhatsApp. Not a condition of purchase. Message rates may apply; reply STOP to opt out.'
    :'Al tocar '+(btn||'Enviar')+', acepta que le contactemos por llamada, texto o WhatsApp. No es condición de compra. Pueden aplicar tarifas de mensajes; responda STOP para cancelar.';
}
function consentHTML(lang,btn,privacyUrl){
  return '<p class="lead-consent" style="font-size:12.5px;line-height:1.45;color:#5f6b75;text-align:center;margin:10px 4px 0">'+consentText(lang,btn)
    +' <a href="'+privacyUrl+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">'+(lang==='en'?'Privacy':'Privacidad')+'</a></p>';
}
function withConsent(d,lang,btn,page){
  d.consentText=consentText(lang,btn); d.consentVersion=CONSENT_VERSION;
  d.consentAt=new Date().toISOString(); d.consentPage=page||location.href;
  return d;
}
function sendLead(d){
  if(!d.leadId) d.leadId='L'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  var ctl=window.AbortController?new AbortController():null;
  var t=setTimeout(function(){if(ctl)ctl.abort();},25000);
  return fetch(leadURL(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d),signal:ctl?ctl.signal:undefined})
    .then(function(r){return r.json();})
    .then(function(j){clearTimeout(t);return !!(j&&j.saved===true&&j.emailed===true);})
    .catch(function(){clearTimeout(t);return false;});
}
function leadErrorHTML(lang){
  var en=lang==='en', m=encodeURIComponent(en?"Hi, I'd like help with Medicare":'Hola, quiero ayuda con Medicare');
  return '<div class="lead-err" role="alert" style="background:#fff4f2;border:1px solid #f0c4bc;border-radius:10px;padding:12px 14px;margin:12px 0 0;text-align:center;font-size:15px;line-height:1.45;color:#5a1f14">'
    +(en?"We couldn't send your details. Message us or call (310) 597-9142.":'No pudimos enviar sus datos. Escríbanos o llámenos al (310) 597-9142.')
    +'<div style="margin-top:8px;font-weight:700;font-size:15px"><a href="https://wa.me/13105979142?text='+m+'" target="_blank" rel="noopener" style="color:#0b6b56;padding:6px 4px;display:inline-block">WhatsApp</a> · '
    +'<a href="sms:+13105979142" style="color:#0b6b56;padding:6px 4px;display:inline-block">'+(en?'Text':'Texto')+'</a> · '
    +'<a href="tel:+13105979142" style="color:#0b6b56;padding:6px 4px;display:inline-block">'+(en?'Call':'Llamar')+'</a></div></div>';
}
/* end T-024 lead-send v1 */

// Which site the visitor is on (the widget is iframed on MC), and that site's privacy page.
function leadSite(){
  const host=window.location.hostname||'', ref=(window.self!==window.top)?document.referrer:'', path=window.location.pathname||'';
  return (ref.includes('medicare-california')||ref.includes('/california')||host.includes('medicare-california')||host.includes('california')||path.includes('/california'))?'medicare-california':'beneficiosmedicare';
}
function privacyURL(){
  return leadSite()==='medicare-california'
    ?'https://medicare-california.com/'+(lang==='en'?'privacy':'privacidad')
    :'https://beneficiosmedicare.com/'+(lang==='en'?'privacy':'privacidad');
}
const CONSENT_BTN={enroll:['Send','Enviar'],help:['Send','Enviar'],snooze:['Set Reminder','Programar Recordatorio'],question:['Request Free Call','Solicitar Llamada Gratis']};

function submitLead(type){
  if(_submitting) return;
  if(!leadOK()){ go(flowResults); return; }   // information-only state: no lead capture (T-017)
  _submitting=true;
  const btn=document.querySelector('.btn-p:not(:disabled)');
  const _btnLabel=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent=lang==='en'?'Processing...':'Procesando...'}

  const name=D.fullName||document.getElementById('fullName')?.value||'';
  const phone=D.phone||document.getElementById('phone')?.value||'';
  const email=D.email||document.getElementById('email')?.value||'';
  const question=document.getElementById('question')?.value||'';

  let phoneClean = phone.replace(/\D/g,'');
  if(phoneClean.length === 11 && phoneClean.charAt(0) === '1') phoneClean = phoneClean.slice(1);
  if(!name.trim() || name.trim().length < 2){
    alert(lang==='en'?'Please enter your full name.':'Por favor ingrese su nombre completo.');
    _submitting=false;
    if(btn){btn.disabled=false;btn.textContent=_btnLabel}
    return;
  }
  if(phoneClean.length !== 10){
    alert(lang==='en'?'Please enter a valid 10-digit US phone number.':'Por favor ingrese un n\u00FAmero de tel\u00E9fono v\u00E1lido de 10 d\u00EDgitos (EE.UU.).');
    _submitting=false;
    if(btn){btn.disabled=false;btn.textContent=_btnLabel}
    return;
  }
  D.fullName=name;D.phone=phone;D.email=email;
  if(question) D.question=question;
  D.lang=lang;D.conditions=[...selConds];
  D.timestamp=new Date().toISOString();
  D.leadType=type;
  if(type!=='enroll'&&type!=='help'){delete D.plansSeen;delete D.represented;}   // a reminder or question is not about a plan

  const parentHost=(window.self!==window.top)?document.referrer:'';
  D.source=leadSite();
  D.url=parentHost||window.location.href;

  const parts=name.trim().split(/\s+/);
  D.firstName=parts[0]||'';
  D.lastName=parts.slice(1).join(' ')||'';

  const cb=CONSENT_BTN[type]||CONSENT_BTN.enroll;
  withConsent(D,lang,lang==='en'?cb[0]:cb[1],D.url);
  const errBox=document.getElementById('leadErr'); if(errBox) errBox.innerHTML='';
  sendLead(D).then(ok=>{
    _submitting=false;
    if(ok){ go(flowSuccess); return; }
    if(btn){btn.disabled=false;btn.textContent=_btnLabel}
    const box=document.getElementById('leadErr');
    if(box){ box.innerHTML=leadErrorHTML(lang); box.scrollIntoView({block:'nearest'}); }
  });
}
