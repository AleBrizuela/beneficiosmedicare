<title>Beneficios Medicare - Your Guide</title>

<style>
:root {
  --navy: #1E3A5F; --green: #00796B; --blue: #2E6BA4;
  --teal: #00897B; --mint: #B2DFDB;
  --lt-blue: #D6EAF7; --lt-green: #E0F2F1;
  --lt-mint: #E0F2F1; --lt-gray: #F3F5F7;
  --gray: #5A6577; --dark: #1C2B3A; --white: #FFFFFF;
  --sage: #00897B; --sage-dark: #00796B; --slate: #3D5A80;
  /* T-084: the compare bar's own pair, so it is #007B7B / navy on beneficiosmedicare and the
     California blue on medicare-california, without inheriting --sage's retired teal. */
  --cbar-brand: #007B7B; --cbar-ink: #002147;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(30,58,95,0.10);
  --shadow-lg: 0 8px 40px rgba(30,58,95,0.14);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Open Sans',-apple-system,sans-serif;background:linear-gradient(135deg,#E0F2F1 0%,#D6EAF7 50%,#E0F2F1 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
body.in-iframe{padding:0;min-height:auto;background:var(--white);align-items:flex-start}
body.in-iframe .widget-wrap{border-radius:0;box-shadow:none}
body.in-iframe .widget-header{display:none}
body.in-iframe .widget-footer{display:none}
body.in-iframe .widget-wrap{min-height:auto!important}
body.in-iframe .widget-body{padding-top:10px;padding-bottom:4px}
body.in-iframe .bot-msg{font-size:16px;padding:2px 0 8px}
.widget-wrap{width:100%;max-width:480px;background:var(--white);border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden;position:relative}

/* ── LANG BUBBLE ── */
.lang-toggle{display:flex;background:rgba(255,255,255,.15);border-radius:8px;overflow:hidden;margin-left:auto;flex-shrink:0;border:1px solid rgba(255,255,255,.2)}
.lang-toggle button{padding:6px 12px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;background:transparent;color:rgba(255,255,255,.6);letter-spacing:.03em}
.lang-toggle button.active{background:rgba(255,255,255,.95);color:var(--navy);border-radius:6px}
.lang-toggle button:hover:not(.active){background:rgba(255,255,255,.1);color:white}

/* ── HEADER ── */
.widget-header{background:linear-gradient(135deg,var(--navy) 0%,var(--slate) 100%);padding:14px 20px 12px;color:white;display:flex;align-items:center;gap:12px}
.widget-header .logo-icon{width:42px;height:42px;background:rgba(255,255,255,.15);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.widget-header h2{font-size:18px;font-weight:600;line-height:1.2}
.widget-header p{font-size:13px;opacity:.8;margin-top:2px}

/* ── PROGRESS ── */
/* T-031 (AB 2026-10-03): no progress bar. The flow branches, so a bar cannot show how far along a visitor
   really is, and at a few pixels with no label it read as a stray line. The element stays so prog() has a target. */
.progress-bar{display:none}
.progress-fill{height:100%}
/* T-031: on phones the host page shows the one Continuar in its bottom bar; the widget's own button steps aside
   only while the page says that bar button is on screen (host-next), so there is never zero and never two. */
body.host-next #wb .btn-p{display:none!important}

/* ── BODY ── */
.widget-body{padding:18px 22px 8px}

/* ── ANIM ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.widget-body>*{animation:fadeUp .3s ease}

/* ── BOT MSG ── */
.bot-msg{background:none;border-radius:0;padding:4px 0 12px;margin-bottom:6px;font-size:17px;font-weight:400;line-height:1.5;color:#3c4043;text-align:center}
.bot-msg strong{font-weight:600;color:inherit}
.bot-msg.plain{background:none;border-radius:0;padding:4px 0 10px;font-size:22px;font-weight:600;color:#202124;text-align:center}
.bot-msg.hl{background:#f8f9fa;border-left:3px solid var(--sage);padding:10px 14px;border-radius:8px;text-align:left;font-size:14px;font-weight:400;color:#5f6368}

/* ── OPT CARDS ── */
.opt-grid{display:flex;flex-direction:column;gap:10px}
.opt-card{display:flex;align-items:center;gap:14px;padding:16px 16px;border:1.5px solid #dadce0;border-radius:var(--radius);cursor:pointer;transition:all .15s;background:var(--white);min-height:64px}
.opt-card:hover{border-color:var(--sage);background:#f8faf9;box-shadow:0 1px 6px rgba(60,64,67,.08)}
.opt-card:active{transform:scale(.98)}
.opt-card .ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.ic.bl{background:var(--lt-blue)}.ic.gr{background:var(--lt-green)}.ic.mi{background:var(--lt-mint)}.ic.sg{background:var(--lt-mint)}
.opt-card .tx h4{font-size:15px;font-weight:600;color:#202124;margin-bottom:2px}
.opt-card .tx p{font-size:13px;color:#5f6368;line-height:1.45}
.opt-card .bg{margin-left:auto;font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;letter-spacing:.03em;white-space:nowrap;flex-shrink:0}
.bg.st{background:#fef7e0;color:#b06000}.bg.ch{background:#e8f0fe;color:#1a73e8}
.bg.co{background:#e6f4ea;color:#137333}.bg.le{background:#f3e8fd;color:#8430ce}

/* ── INPUTS ── */
.input-group{margin-bottom:14px;text-align:center}
.input-group label{display:block;font-size:13px;font-weight:500;color:#5f6368;margin-bottom:6px;text-align:center}
.input-field{width:auto;min-width:180px;max-width:260px;padding:14px 16px;border:1.5px solid #dadce0;border-radius:var(--radius);font-size:18px;font-family:inherit;color:#202124;transition:border-color .2s;text-align:center;display:block;margin:0 auto}
.input-field:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(0,137,123,.15)}
.input-field::placeholder{color:#A0AEC0}
.input-group.zip-group .input-field{width:140px;min-width:140px;font-size:22px;letter-spacing:3px}

/* ── BUTTONS ── */
.btn-p{width:100%;padding:16px;background:var(--sage);color:white;border:none;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:8px;min-height:52px}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,137,123,.3)}.btn-p:active{transform:translateY(0)}
.btn-p:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-s{width:100%;padding:14px;background:transparent;color:var(--sage);border:1.5px solid #dadce0;border-radius:var(--radius);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:8px;min-height:50px}
.btn-s:hover{background:var(--lt-mint)}
/* NO WIDOWS (AB's standing rule, written out in T-088 round 3): no line a visitor reads ends up
   holding one word on its own. text-wrap:pretty is the browser's own fix for exactly that, and it
   costs nothing where a block already fits on one line. The forced two-line cost labels under the
   card numbers are NOT covered by it on purpose: their break is written in (T-079 round 2) and the
   second line is meant to be one word. */
.q3q,.q3tx b,.q3tx span,.q3skip,.rh .hl,.rh .zl,.fc,.ord,.ordp .orow,.btn-back,.btn-p,.btn-s,.pc-det,.pd-cta,.cbar button,
.pc-eb,.pc-name,.cmp thead th .nm2,.cmp tr.lr td,.cmp tr.vr td,.cmp tr.grp td,.lr .ll,.lr .lv,.bot-msg,.diffline{text-wrap:balance}
.fine p,.pc-fine,.disc,.psrc,.dualnote{text-wrap:pretty}
/* the two-line cost labels keep their own written-in break (T-079 round 2) */
.pc-key .l,.pc-key .l *{text-wrap:wrap}
.btn-back{display:inline-flex;align-items:center;justify-content:center;gap:5px;background:#fff;border:2px solid var(--cbar-brand);border-radius:12px;color:var(--cbar-brand);font-size:15.5px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:10px;padding:8px 12px;min-height:48px}
.btn-back:hover{background:#f2faf9}
.bkrow{margin:2px 0 0}
.btn-ghost{background:none;border:none;color:#1a73e8;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;padding:10px 0;text-decoration:none;min-height:44px}
.btn-remind{width:100%;padding:14px;background:var(--lt-blue);color:var(--blue);border:2px solid var(--lt-blue);border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:8px;min-height:50px}
.btn-remind:hover{border-color:var(--blue)}
.btn-skip{display:block;width:100%;text-align:center;background:none;border:none;color:#999;font-size:13px;cursor:pointer;font-family:inherit;padding:10px 0;margin-top:4px;text-decoration:underline;text-underline-offset:2px;min-height:36px}
.btn-skip:hover{color:var(--gray)}

/* ── INFO CARDS ── */
.info-card{background:#f8f9fa;border-radius:var(--radius);padding:16px;margin-bottom:12px}
.info-card h4{font-size:14px;font-weight:600;color:#202124;margin-bottom:5px}
.info-card p{font-size:14px;color:#3c4043;line-height:1.55}
.info-card.bl{background:#f8f9fa}.info-card.bl h4{color:#202124}

/* ── RANK BADGES (priority step) ── */
/* ── T-088 round 3 (AB 2026-10-15): ONE question, ONE answer, then the plans ──
   Pixel spec: DECIDE/now/2026-10-15_plan-details-mock/2026-10-15_1600_flujo-completo-v11.html
   screen 2 (and 1440_importante-v3). Values are the mock's own, not re-derived. The five icon
   colours are fixed and identical on both sites (the ticket), so they are literals, not vars;
   everything the visitor taps uses --cbar-brand, which is #007B7B on beneficiosmedicare and the
   California blue on medicare-california. */
/* ── T-096 round 4 a2 (AB 2026-10-15 23:00, "below the fold") ──────────────────────────────────
   Every value here is the mock's own (2026-10-15_2300_lo-mas-importante-v2, NUEVO column). The
   screen to clear is 375x548 — an iPhone SE with Safari's bars — and the rule is that all five
   options AND "Sin preferencia" are reachable without scrolling. The question itself was not
   allowed to shrink to get there (AB), so the room came out of the rows: one line of explanation
   each, a 44px tile instead of 50, and 7px between rows. */
/* ── T-100 (AB 2026-10-17, spec 2026-10-17_2340_lo-mas-importante-y-mi-plan-de-hoy-v9 section 2,
   PROPUESTA): no ZIP and no help line. The question sits on ONE line to the right of "‹ Volver",
   19.5px navy, never wrapping; six options, 60px tall and 8px apart, so all six and "Sin preferencia"
   sit above the fold at 390x660. fitQ3() steps the type down only where 19.5px does not fit beside
   Volver (English on a phone), and below 16px gives the question its own line under Volver. ── */
body.q3 .widget-body{padding:10px 14px 16px}
.q3top{display:flex;align-items:center;gap:12px;row-gap:8px;margin:2px 0 12px}
.q3top .btn-back{margin:0;flex:0 0 auto}
.q3q{flex:1 1 auto;min-width:0;font-size:19.5px;line-height:1.22;font-weight:700;color:#002147;margin:0;white-space:nowrap;overflow:hidden}
.q3top.q3wrap{flex-wrap:wrap}
.q3top.q3wrap .q3q{flex-basis:100%}
.q3opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;border:1.5px solid #D4DEE8;border-radius:14px;padding:8px 12px 8px 10px;min-height:60px;margin-bottom:8px;background:#fff;position:relative;cursor:pointer}
.q3opt.on{border:2px solid var(--cbar-brand);background:#f2faf9;padding:7.5px 11.5px 7.5px 9.5px}
.q3ic{width:44px;height:44px;flex:0 0 44px;border-radius:12px;background:var(--b);display:flex;align-items:center;justify-content:center}
.q3ic svg{width:28px;height:28px;fill:none;stroke:var(--d);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.q3ic svg .f{fill:var(--t)}
.q3tx{padding-right:26px;min-width:0}
.q3tx b{display:block;font-size:17px;font-weight:600;color:#1A202C;line-height:1.25}
.q3tx span{display:block;font-size:14px;color:#4A5568;line-height:1.3}
.q3tx em{font-style:normal;font-weight:600;color:#1A202C}
.q3ck{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--cbar-brand);color:#fff;font-weight:700;font-size:13px;display:none;align-items:center;justify-content:center}
.q3opt.on .q3ck{display:flex}
.q3skip{display:block;width:100%;text-align:center;color:var(--cbar-brand);font-weight:600;font-size:16px;margin:8px 0 0;text-decoration:underline;text-underline-offset:3px;background:none;border:0;font-family:inherit;cursor:pointer;min-height:44px}
/* iPhone SE, 320 wide: four of the five explanations wrapped to a second line and pushed "Sin
   preferencia" 25px below the screen. They are one line again here -- the words are not cut, the
   type is, and only on the narrowest phone.
   T-100: the breakpoint is the frame's width, not the phone's. The longest explanation ("Only plans
   with no monthly premium.", 249px at 14px) needs a 384px frame at full size; medicare-california's
   frame is 366 on a 390 phone, so below 384 both sites take the compact type and every row stays one
   line, 60px, which is what keeps all seven above the fold at 390x660. */
@media(max-width:383px){
  /* T-100: rows keep the spec's 60px and 8px gap here too; only the type and the side room shrink */
  .q3opt{gap:9px;padding:8px 8px 8px 7px;min-height:60px;margin-bottom:8px}
  .q3opt.on{padding:7.5px 7.5px 7.5px 6.5px}
  .q3ic{width:40px;height:40px;flex:0 0 40px}
  .q3ic svg{width:25px;height:25px}
  .q3tx{padding-right:16px}
  .q3tx b{font-size:16px}
  /* greedy wrapping here, not balanced: balance splits a line that would have fitted */
  .q3tx span{font-size:12.8px;text-wrap:wrap}
  .q3ck{width:18px;height:18px;right:5px;font-size:11px}
}
/* Results top (T-088 round 3 + "less is more"): title, ZIP line, ONE chip row. The sort row and
   the "lo más importante" line are gone; "Filtros y orden" opens both in one panel. */
.rh .hl{font-size:22px;font-weight:700;color:var(--cbar-ink);margin:0 0 2px;line-height:1.2;text-wrap:pretty}
/* T-096 round 5 b/c (AB 2026-10-16 00:50, spec 2026-10-16_0030_filtros-y-orden-v3.html). The three
   "Solo" answers from the question screen are always on screen as chips carrying their own count, so
   what is filtering the list is visible and one tap undoes it, with nothing to open first. The order
   and the type filters -- the ones almost nobody touches -- sit behind one link at the end of the row.
   Measurements are the mock's: chip 14px/600 in a 1.5px #D4DEE8 pill, 6px 9px, 40px tall. */
/* T-101 (AB 2026-10-17, mock v9 section 4): seven chips, shorter words, in THREE fixed rows of
   2 + 3 + 2 -- each row is its own flex line so the grouping holds in both languages instead of
   depending on how wide the English words happen to be. 13.5px, 38px tall, 5px apart. */
.fx{display:flex;flex-direction:column;gap:5px;margin:8px 0 4px}
.fxr{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.fc{display:inline-flex;align-items:center;gap:4px;font:inherit;border:1.5px solid #D4DEE8;border-radius:999px;padding:0 7px;font-size:13.5px;white-space:nowrap;font-weight:600;color:#1A202C;background:#fff;height:38px;min-height:38px;cursor:pointer}
.fc i{font-style:normal;font-weight:400;color:#4A5568;font-size:13.5px}
.fc.on{background:var(--cbar-brand);border-color:var(--cbar-brand);color:#fff}
.fc.on i{color:#E0F2F1}
.fc.on:before{content:"\2713";font-weight:700}
/* The mock's phone gives the chips 328px; the real page does not. At 390 the home page puts the
   finder in a 354px frame (BM) or 366px (MC), and the frame's 18px + the card's 14px padding left
   290px -- the middle row ("✓ Medi-Cal" on, the "Tengo Medi-Cal" answer) needs 328. So on the plan
   list only, at phone width, the space around the cards gives way instead of the chips: 334px in
   BM's frame, 346 in MC's, 6px to spare at the widest row. */
@media(max-width:400px){
  body.res .rh{padding-left:7px;padding-right:7px}
  body.in-iframe.res .widget-body{padding-left:3px;padding-right:3px}
}
.fc.fcx:before{content:none}
.fc.fcx b{font-weight:700;font-size:17px;line-height:1;margin-left:2px}
/* T-104 (3): ONE row under the chips, Orden on the left and Aseguradora on the right, never wrapping under */
.fxo{display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:0 16px;margin:2px 0 0}
.rtop{display:flex;align-items:center;gap:12px;margin:0 0 4px}
.rtop .btn-back{margin-bottom:0;flex:0 0 auto}
.rtop .hl{margin:0}
.rh .hl .zipb{color:var(--cbar-brand)}
.ordp .orow.crow{display:flex;justify-content:space-between;gap:12px}
.ordp .orow.crow i{font-style:normal;font-weight:400;color:#4A5568}
.sug.ask{padding:10px 14px}
.sug.ask .conf{border-top:0;margin-top:0;padding-top:0}
.ord{font:inherit;background:none;border:0;color:var(--cbar-brand);font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:3px;white-space:nowrap;cursor:pointer;min-height:40px;padding:0 2px}
.ordp{margin:10px 0 2px;border:1.5px solid #D4DEE8;border-radius:12px;background:#fff;padding:6px 0}
.ordp[hidden]{display:none}
.ordp .orow{display:block;width:100%;text-align:left;font:inherit;margin:0;padding:11px 14px;font-size:16px;color:#1A202C;background:none;border:0;cursor:pointer;min-height:44px}
.ordp .orow.on{color:var(--cbar-brand);font-weight:600}
.ordp .orow.on:before{content:"\2713  "}
.mf{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px 10px}
.mf button{font:inherit;border:1.5px solid #D4DEE8;border-radius:999px;padding:5px 10px;font-size:14px;font-weight:600;background:#fff;color:#1A202C;cursor:pointer}
.mf button.on{background:var(--cbar-brand);border-color:var(--cbar-brand);color:#fff}
.mf i{font-style:normal;font-weight:400;color:#4A5568}
.mf button.on i{color:#E0F2F1}
.opt-card{position:relative}
.rank-badge{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:var(--sage);color:white;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,137,123,.3);animation:popIn .25s ease}
.opt-card.ranked{border-color:var(--sage);background:var(--lt-mint)}

/* ── PLAN CARDS ── */
.plan-card{border:1.5px solid #dadce0;border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:all .2s;position:relative;border-left:4px solid #dadce0}
.plan-card:hover{box-shadow:0 1px 6px rgba(60,64,67,.1)}
.plan-card.rec{border-color:var(--sage);background:#f8faf9;border-left-color:var(--sage)}
.plan-label{position:absolute;top:-10px;right:10px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:8px;letter-spacing:.02em}
.plan-label.best-match{background:var(--sage);color:white}
.plan-label.best-value{background:#1a73e8;color:white}
.plan-label.most-benefits{background:#8430ce;color:white}
.plan-label.top-rated{background:#ea8600;color:white}
.plan-card h4{font-size:15px;font-weight:600;color:#202124;margin-bottom:3px}
.plan-card .carrier{font-size:13px;color:#5f6368;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.carrier-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.plan-row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;border-bottom:1px solid #EDF2F7}
.plan-row:last-child{border:none}
.plan-row .lb{color:#5f6368}.plan-row .vl{font-weight:500;color:#202124}
.plan-row .vl.gd{color:#137333}
.plan-cta{width:100%;padding:14px;margin-top:10px;border:1.5px solid #dadce0;background:var(--white);color:var(--sage);border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;min-height:50px}
.plan-cta:hover{background:var(--sage);color:white}
.plan-cta.filled{background:var(--sage);color:white}
.plan-cta.filled:hover{background:var(--sage-dark)}
.plan-stars{font-size:12px;color:#5f6368;margin:-6px 0 8px}
.plan-flag{margin-top:10px;padding:10px 12px;border-radius:8px;background:#f1f3f4;color:#3c4043;font-size:13px;line-height:1.45;text-align:center}
.plan-flag.warn{background:#fdecea;color:#a50e0e}
.plan-flag a{color:inherit;font-weight:600}
.plan-note{font-size:12px;color:#5f6368;line-height:1.45;margin:6px 0 0}
.plan-more{margin-top:6px;border-top:1px solid #EDF2F7}
.plan-more summary{cursor:pointer;font-size:14px;color:var(--sage);font-weight:600;padding:10px 0;min-height:44px;display:flex;align-items:center}

/* ── PLAN SELECT CHECKBOX ── */
.plan-sel{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;border:2px solid #CBD5E0;background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;transition:all .15s;z-index:2}
.plan-sel:hover{border-color:var(--sage)}
.plan-sel.checked{background:var(--sage);border-color:var(--sage);color:white}

/* ── TYPE FILTER + SORT BAR ── */
.type-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;padding:0 2px}
.type-pill{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border:1.5px solid #dadce0;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;background:var(--white);color:#5f6368;transition:all .15s;font-family:inherit;white-space:nowrap}
.type-pill:hover{border-color:var(--sage);color:var(--sage)}
.type-pill.active{background:var(--sage);color:white;border-color:var(--sage)}
.type-count{font-size:12px;font-weight:700;background:rgba(0,0,0,.08);padding:1px 6px;border-radius:10px}
.type-pill.active .type-count{background:rgba(255,255,255,.25)}
.sort-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;padding:0 2px}
.sort-pill{padding:6px 10px;border:1.5px solid #dadce0;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;background:var(--white);color:#5f6368;transition:all .15s;font-family:inherit;white-space:nowrap}
.sort-pill:hover{border-color:var(--sage);color:var(--sage)}
.sort-pill.active{background:var(--sage);color:white;border-color:var(--sage)}
.compare-float{position:sticky;bottom:0;left:0;right:0;background:white;padding:10px 0 4px;border-top:1px solid #EDF2F7;margin-top:12px;text-align:center}

/* ── COMPARE TABLE ── */
.compare-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
.compare-table th{background:#f8f9fa;color:#202124;padding:9px 6px;text-align:center;font-weight:600;font-size:12px;border-bottom:1px solid #dadce0}
.compare-table th:first-child{text-align:left;color:#5f6368}
.compare-table td{padding:8px 6px;border-bottom:1px solid #f1f3f4;text-align:center;color:#3c4043}
.compare-table td:first-child{text-align:left;color:#5f6368;font-weight:400}
.compare-table tr:hover td{background:#f8f9fa}

/* ── COMPARE ROW ── */
.cmp-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EDF2F7;font-size:15px}
.cmp-row:last-child{border:none}
.cmp-lb{color:#5f6368}.cmp-vl{font-weight:500;color:#202124}

/* ── SUCCESS ── */
.success-icon{width:88px;height:88px;background:linear-gradient(135deg,#E8F5E9 0%,#C8E6C9 100%);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 12px;box-shadow:0 4px 16px rgba(76,175,80,.25);animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.success-wrap{text-align:center;padding:20px 8px 12px}
.success-title{color:#202124;font-size:21px;font-weight:600;margin:0 0 4px;line-height:1.3}
.success-subtitle{color:#5f6368;font-size:14px;font-weight:400;margin:0 0 16px}
.success-bullets{text-align:left;background:var(--lt-gray);border-radius:var(--radius);padding:14px 16px;margin:0 0 16px;list-style:none}
.success-bullets li{font-size:14px;color:#2D3748;line-height:1.5;padding:5px 0;display:flex;align-items:flex-start;gap:8px}
.success-bullets li span.sb-icon{flex-shrink:0;font-size:16px;margin-top:1px}
.success-cta{display:inline-block;background:var(--sage);color:white;font-size:15px;font-weight:600;padding:13px 28px;border-radius:var(--radius);border:none;cursor:pointer;font-family:inherit;transition:all .2s;margin-bottom:12px}
.success-cta:hover{background:#1A8A6E;transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,138,110,.3)}
.success-links{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.success-links button{background:none;border:none;color:var(--navy);font-size:13px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:4px}

/* ── FOOTER ── */
.widget-footer{padding:8px 18px 10px;text-align:center;font-size:12px;color:var(--gray);line-height:1.45;border-top:1px solid #EDF2F7}
.widget-footer a{color:var(--blue);text-decoration:none}

/* ── TRUST BAR ── */
.trust-bar{display:flex;justify-content:center;gap:16px;margin-top:8px;padding-bottom:0;font-size:12px;color:#888}
.trust-bar span{display:flex;align-items:center;gap:4px}
.social-proof-line{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;font-size:12px;color:#555;font-weight:500}
.social-proof-line .sp-stars{display:flex;gap:2px;color:#FDB022}
.social-proof-line .sp-stars svg{width:12px;height:12px}

/* ── 2027 PLAN CARD, RESULTS, COMPARE (T-017 b2-b13; mockups DECIDE/now/2026-10-02_widget-2027-*.html) ── */
.pc{background:#fff;border:0;border-top:5px solid var(--cc,#c9d1d8);border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(0,60,113,.10);margin-bottom:12px;text-align:left}
.pc-head{padding:14px 14px 12px;border-bottom:1px solid #e5e9ec}
.pc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pc-top>div{min-width:0}
.pc-eb{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#66727c;margin:0 0 3px;overflow-wrap:anywhere}
.pc-name{font-size:17px;font-weight:700;line-height:1.3;margin:0;color:#1e2a32;overflow-wrap:anywhere}
.pc-meta .pid{letter-spacing:.01em}
.cmp thead th .pid{display:block;margin-top:3px;font-size:10.5px;font-weight:600;color:#66727c;hyphens:none}
.nw{white-space:nowrap;hyphens:none}
.pc-meta{margin-top:6px;font-size:13px;color:#66727c;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pc-chip{background:var(--lt-mint);color:var(--sage-dark);font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px}
.pc-rating{font-size:12px;color:#66727c;margin-top:4px}
.pc-low{margin-top:6px;padding:7px 10px;border-radius:8px;background:#fdecea;color:#a50e0e;font-size:12px;line-height:1.45}
.pc-cmp{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--sage-dark);border:1px solid #e5e9ec;border-radius:999px;padding:0 10px 0 8px;white-space:nowrap;min-height:36px;background:#fff;cursor:pointer;flex:0 0 auto}
.pc-cmp input{accent-color:var(--sage);width:18px;height:18px;margin:0;cursor:pointer}
/* T-079: the three cost numbers as one band of tiles under the card header.
   A FIGURE NEVER BREAKS ACROSS LINES: .v is nowrap, and below 360px (iPhone SE) the value and
   label step down so "$10,100" still fits one tile. Only word values wrap, at spaces. */
.pc-keys{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto auto;background:#f3f5f7;border-bottom:1px solid #e5e9ec}
.pc-keys.k2{grid-template-columns:repeat(2,1fr)}
/* subgrid so the three labels start on ONE line even when a value wraps to two ("Sin información",
   a long carrier name). Where subgrid is not supported the tile is a plain 1-column grid and the
   band falls back to today's top-aligned behaviour -- nothing moves sideways either way. */
.pc-key{display:grid;grid-template-rows:subgrid;grid-row:span 2;align-content:start;
  padding:11px 6px 12px;text-align:center;border-right:1px solid #e5e9ec;min-width:0}
.pc-key:last-child{border-right:0}
.pc-key .v{align-self:center;font-size:21px;font-weight:700;line-height:1.15;color:#1e2a32;white-space:nowrap}
.pc-key .v small{font-size:12px;font-weight:600;color:#66727c}
/* a real answer that is a word, not a figure ("Ninguno", a carrier name): still dark and bold */
.pc-key .v.word{font-size:15px;font-weight:700;line-height:1.25;white-space:normal;overflow-wrap:break-word;hyphens:none}
/* CMS published no value: grey and smaller, so it never reads as a number */
.pc-key .v.na{font-size:13.5px;font-weight:600;color:#56616a;line-height:1.25;white-space:normal;overflow-wrap:break-word;hyphens:none}
.pc-keys.k2 .v{font-size:16px}
.pc-keys.k2 .v.word{font-size:13.5px;font-weight:600}
.pc-key .l{font-size:11.5px;font-weight:600;color:#66727c;margin-top:4px;line-height:1.25;hyphens:none;overflow-wrap:break-word}
.pc-key.zero .v,.pc-visit .v.zero,.pc .zero,.cmp .zero{color:var(--sage-dark)}
/* T-101: the first tile is the figure the list is ordered by, and it is in teal so the order reads
   without a sentence. A missing figure ("Sin información") or a word ("Ninguno") keeps its grey. */
.pc-keys:not(.k2) .pc-key:first-child .v:not(.na):not(.word){color:var(--cbar-brand)}
@media(max-width:359px){
  .pc-key{padding:10px 3px 11px}
  .pc-key .v{font-size:18px}
  .pc-keys.k2 .v{font-size:15px}
  .pc-key .v.word{font-size:14px}
  .pc-key .l{font-size:11px}
}
.pc-sec{padding:14px 14px 4px}
.pc-sec h5{font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin:0 0 8px;color:#1e2a32}
.pc-sec h5 span{text-transform:none;letter-spacing:0;font-weight:600;color:#66727c}
.pc-visits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pc-visit{background:#f3f5f7;border-radius:10px;padding:8px 10px;min-width:0}
.pc-visit .l{font-size:12px;color:#66727c}
.pc-visit .v{font-size:17px;font-weight:700;color:#1e2a32;overflow-wrap:anywhere}
.pc-visit .v.na{font-size:13px;font-weight:600;color:#56616a}
.pc-chips{display:flex;flex-wrap:wrap;gap:6px}
/* T-074 plan-type pills + the official plan ID line. Tag palette AB 2026-10-14. */
.pc-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.tg{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;line-height:1.35;white-space:nowrap}
.tg-net{border:1.5px solid #002147;color:#002147;background:#fff;padding:2px 8px}
.tg-who{background:var(--sage-dark);color:#fff}
.tg-plain{background:#E2E7EC;color:#4A5568}
.pc-idline{margin-top:6px;font-size:12.5px;color:#66727c}
.pc-idline .pid{font-weight:700;color:#4A5568}
/* T-073: the card ends in ONE outline button; the plan opens on its own screen. */
/* T-076 (AB 2026-10-15): the button sits INSIDE the card's own 14px row padding. At full width its
   border ran along the card's border -- doubled at the bottom, and clipped at the corners by the
   card's 16px radius + overflow:hidden. 28px = the 14px the cost rows already use on each side. */
/* T-096 round 5 d: the big outlined button is gone. The card ends in a thin strip holding the same
   words as a link, and the WHOLE card opens the plan, so a plan and a half more fits on a screen
   without taking the action away. Measurements from the mock's `.cc .det`. */
.pc-det{display:flex;justify-content:flex-end;align-items:center;width:auto;background:none;border:0;
  border-top:1px solid #EEF1F3;border-radius:0;margin:0;padding:10px 14px;min-height:44px}
.pc-detl{font:inherit;font-size:16px;font-weight:600;color:var(--cbar-brand);background:none;border:0;
  padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pc.tap{cursor:pointer}
/* T-073: a three-row cost block on the short card needs no "COSTOS" bar above it. */
.ls.nohead{padding-top:2px}
.ls.nohead .lr{padding-top:9px;padding-bottom:9px}
.pd-head{margin:0 0 14px}
.pd-cta{display:block;width:100%;background:var(--sage);color:#fff;border:0;border-radius:10px;padding:15px;
  font-family:inherit;font-size:17px;font-weight:700;line-height:1.2;text-align:center;cursor:pointer;
  min-height:52px;margin:18px 0 0}
.pd-fine{margin-top:18px;border-top:1px solid #e5e9ec;padding-top:12px}
.pd-fine p{font-size:13px;line-height:1.5;color:#66727c;margin:0 2px 9px}
.pd-fine p:last-child{margin-bottom:0}
.sdisc{font-size:12px;line-height:1.5;color:#56616a;margin:10px 2px 0}
.psrc{font-size:11px;line-height:1.5;color:#777;margin:10px 2px 0}
.pc-chips .c{font-size:12.5px;font-weight:600;background:#f3f5f7;color:#1e2a32;border:1px solid #e5e9ec;padding:4px 9px;border-radius:999px}
.pc-chips .c b{color:var(--sage)}
.pc-chips .c.off{background:#fff;color:#56616a;border:1px dashed #aab4bc}
.pc-chips .c.off b{color:#a3adb5}
.pc details{border-top:1px solid #e5e9ec;margin-top:10px}
.pc summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:14.5px;font-weight:700;color:var(--sage-dark);display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px}
.pc summary::-webkit-details-marker{display:none}
.pc summary::after{content:"";flex:0 0 auto;width:9px;height:9px;border-right:2px solid var(--sage-dark);border-bottom:2px solid var(--sage-dark);transform:rotate(45deg);margin-top:-4px}
.pc details[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.pc-ben{list-style:none;margin:0;padding:0}
.pc-ben li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid #e5e9ec}
.pc-ben.plain li{grid-template-columns:1fr}
.pc-ben li:last-child{border-bottom:0}
.pc-ic{width:34px;height:34px;border-radius:10px;background:var(--lt-mint);display:flex;align-items:center;justify-content:center}
.pc-ic svg{width:19px;height:19px;fill:none;stroke:var(--sage-dark);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pc-ic.off{background:#f3f5f7}.pc-ic.off svg{stroke:#9aa5ae}
.pc-ben .t{font-size:14.5px;font-weight:700;color:#1e2a32}
.pc-ben .d{font-size:13px;color:#66727c;margin-top:1px;line-height:1.4}
.pc-ben .d b{color:#1e2a32}
.pc-ben .t.off,.pc-ben .d.off{color:#56616a}
table.pc-tiers{width:100%;border-collapse:collapse;font-size:14px}
.pc-tiers td{padding:7px 0;border-bottom:1px solid #e5e9ec;vertical-align:top}
.pc-tiers tr:last-child td{border-bottom:0}
.pc-tiers td.n{width:28px}
.pc-tiers td.n span{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#f3f5f7;font-size:11.5px;font-weight:800;align-items:center;justify-content:center;color:#66727c}
.pc-tiers td.t{color:#66727c;padding-right:8px}
.pc-tiers td.v{text-align:right;font-weight:700;color:#1e2a32;white-space:nowrap;padding-left:8px}
.pc-tiers td.v.zero{color:var(--sage-dark)}
.pc-tiers td.th{font-size:11px;color:#66727c;font-weight:700;text-align:right;padding-bottom:2px;padding-left:8px}
.pc-fine{font-size:12px;color:#66727c;margin:6px 0 0;line-height:1.4}
.pc-fine b{color:#1e2a32}
.pc-foot{padding:12px 14px 14px}
.pc-btn{display:block;width:100%;background:var(--sage);color:#fff;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;text-align:center;cursor:pointer;font-family:inherit;min-height:50px}
.pc-btn:hover{background:var(--sage-dark)}
.pc-foot .plan-flag{margin-top:0}
.rh{border:0;border-radius:12px;padding:12px 14px;margin-bottom:12px;text-align:left;box-shadow:0 4px 24px rgba(0,60,113,.10)}
.zl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;color:#66727c}
.zl>svg{width:15px;height:15px;fill:none;stroke:var(--sage-dark);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.zl .zv{font:inherit;font-size:14.5px;font-weight:700;color:#1e2a32;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline dotted #9aa5ae;text-decoration-thickness:1.5px;text-underline-offset:4px;min-height:32px}
.zl .zc{font:inherit;font-size:13px;font-weight:600;color:var(--sage-dark);background:none;border:0;padding:0 0 0 4px;cursor:pointer;min-height:32px}
.zl .zf{display:none;width:100%;gap:8px;margin-top:4px}
.zl.edit .zf{display:flex}.zl.edit .zv,.zl.edit .zc{display:none}
.zl .zf input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px;border:1px solid #dadce0;border-radius:9px;color:#1e2a32}
.zl .zf button{font:inherit;font-size:14px;font-weight:600;background:var(--sage);color:#fff;border:0;border-radius:9px;padding:9px 14px;min-height:44px;cursor:pointer}
.zerr{font-size:13px;color:#a50e0e;margin:4px 0 0}
.zerr:empty{display:none}
.rh .t1{font-size:13px;font-weight:400;color:#66727c;margin:2px 0 8px}
.rh .sr{display:flex;gap:8px;align-items:center;font-size:13px;color:#66727c;margin-top:6px}
.rh .sr label{flex:0 0 86px;white-space:nowrap}
.rh .sr select{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px;border:1px solid #e5e9ec;border-radius:9px;background:#f3f5f7;color:#1e2a32;font-weight:600;min-height:40px}
.cmpall{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1.5px solid var(--sage);color:var(--sage-dark);border-radius:10px;padding:11px;font-weight:700;font-size:15px;background:#fff;cursor:pointer;font-family:inherit;margin:0 0 10px;min-height:48px}
.cmpall svg{width:18px;height:18px;fill:none;stroke:var(--sage-dark);stroke-width:1.8;stroke-linecap:round}
.showmore{display:block;width:100%;text-align:center;background:#fff;border:1px solid #e5e9ec;border-radius:12px;padding:12px;font-weight:700;color:#1e2a32;font-size:15px;cursor:pointer;font-family:inherit;margin-bottom:6px}
.showmore span{display:block;font-size:12px;font-weight:600;color:#66727c;margin-top:2px}
/* T-104 (2) (AB 2026-10-18, "Ver 10 planes más you can see"): a real button, not a grey card. Full width,
   2px teal outline, teal 16px/700 text, 48px, 12px above and below. One line: the grey "Mostrando 10 de
   70" under it is folded into the label as the count still to come. */
#pmore .showmore{display:flex;align-items:center;justify-content:center;width:100%;height:48px;min-height:48px;margin:12px 0;padding:0 12px;box-sizing:border-box;
  background:#fff;border:2px solid var(--cbar-brand);border-radius:12px;color:var(--cbar-brand);font-family:inherit;font-size:16px;font-weight:700;line-height:1.2;white-space:nowrap}
#pmore .showmore:hover{background:var(--lt-mint)}
#pmore .showmore:focus-visible{outline:3px solid #FFB300;outline-offset:2px}
/* ── T-084: the compare bar is white and on brand. It was #1e2a32, which reads as black and is
   not in either palette. Its colours come from --cbar-brand / --cbar-ink, not from
   var(--sage) / var(--navy), which in THIS file still resolve to the retired Material teal
   #00897B and to #1E3A5F. That pair is themed, so the bar matches whichever site asked for the
   widget -- #007B7B / #002147 on beneficiosmedicare, the California blue on medicare-california
   -- which is also what the host's own copy of the bar uses.
   Inside a home page the HOST draws it instead (only the host can fix anything to the bottom of
   the SCREEN: this iframe has no scrollport, it grows to fit and the PAGE scrolls, so position:
   sticky has nothing to stick to) and this copy hides itself on host-cbar. Never one of each. ── */
.cbar{position:sticky;bottom:12px;margin-top:12px;background:#fff;color:var(--cbar-ink);border:2px solid var(--cbar-brand);border-radius:12px;padding:10px 12px;display:none;align-items:center;justify-content:flex-end;gap:12px;box-shadow:0 6px 18px rgba(16,24,40,.16);z-index:5}
.cbar.on{display:flex}
/* T-084 round 2: the same element, one button wide, when the bar carries a screen's main action */
.cbar.solid{padding:0;border:0;box-shadow:none;background:none}
.cbar.solid .n{display:none}
.cbar.solid button{flex:1 1 auto;width:100%;border-radius:12px;min-height:52px;padding:0 14px}
/* inside the iframe the PAGE draws a fixed bar over this content, so the content ends above it */
body.in-iframe.has-bar .widget-body{padding-bottom:96px}
/* T-096 round 4 g (AB: "is the SHARE or HELP button sticky on bottom of screen?"). Where THIS file
   draws the bar -- the widget opened on its own -- it is fixed to the screen from first paint and
   stays there for the whole scroll, fine print included. Inside the iframe it cannot be: position
   is relative to the frame, which is as tall as its content, so the page draws it instead and the
   copy here stands down (host-cbar). */
/* T-103 (1): margin auto centres the fixed bar on a wide screen (it sat at the left edge, 10-570px) */
body:not(.in-iframe) .cbar{position:fixed;left:10px;right:10px;bottom:10px;margin:0 auto;max-width:560px}
body:not(.in-iframe).has-bar .widget-body{padding-bottom:104px}
.cbar .n{font-size:15px;font-weight:400;color:#4A5568}
.cbar button{background:var(--cbar-brand);color:#fff;border:0;border-radius:10px;padding:0 18px;font-weight:600;font-size:17px;font-family:inherit;cursor:pointer;min-height:48px;flex:0 0 auto}
.cbar button:disabled{opacity:.45;cursor:not-allowed}
/* T-098 item 7: outline at 1-2 ticked, solid at 3, one pulse on the way in. */
.cbar:not(.solid):not(.duo) button{background:#fff;color:var(--cbar-brand);border:2px solid var(--cbar-brand)}
.cbar.ready:not(.solid):not(.duo) button{background:var(--cbar-brand);color:#fff}
@keyframes cbarpulse{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
.cbar button.pulse{animation:cbarpulse 400ms ease-out 1}
@media (prefers-reduced-motion:reduce){.cbar button.pulse{animation:none}}
body.host-cbar .cbar{display:none!important}
/* T-103 (1) (AB 2026-10-18): with no label beside it (T-084 round 2 put the count in the button), the
   button filled only its own width and justify-content:flex-end pinned it to the right of an empty bar,
   122px off centre at 1280. Same rule as the host page's copy: an empty label hides, the button fills
   the bar, so "Comparar (2)" and "Comparar ya" are centred by construction in every state. */
.cbar .n:empty{display:none}
.cbar .n:empty~#cbarGo{flex:1 1 auto;width:100%;min-height:52px}
/* T-103 (3): the two option cards in two colours, seen at a glance, not only read. Each pairs with its
   own tint and the card's left edge. Teal text is the brand's teal-dark: #007B7B on #E6F2F1 measures
   4.45:1, under the 4.5:1 the ticket asks for; #005C5C measures 6.83:1. Blue #1D5FA8 on #E8F0FA: 5.62:1.
   Gold stays for TERMINA only. */
.mpchip.sim{background:#E6F2F1;color:#005C5C;box-shadow:inset 0 0 0 1px #007B7B}
.mpchip.dif{background:#E8F0FA;color:#1D5FA8;box-shadow:inset 0 0 0 1px #1D5FA8}
.pc.mpc.sim{border-left:5px solid #007B7B}
.pc.mpc.dif{border-left:5px solid #1D5FA8}
/* T-104: in a frame under 320px (a 320 phone) the plan name had 131px beside the Comparar box, so
   "Medicare Advantage" was cut mid-word. There the box takes its own row above the name, on the right. */
@media(max-width:319px){.pc-top:not(.mprow){flex-direction:column-reverse;align-items:stretch;gap:6px}.pc-top:not(.mprow)>.pc-cmp{align-self:flex-end}}
/* T-103 (4): the visitor's current plan, pinned at the top of the list. Ticked and locked: the only way
   out is the x, so a plain tap can never drop it by accident. */
.pc.pinned{border-left:5px solid var(--cbar-ink)}
.pc-cmp.pinned{border:1.5px solid var(--cbar-brand);background:var(--lt-mint);color:var(--cbar-ink);padding-right:0;gap:6px;cursor:default}
.pc-cmp.pinned .pck{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;background:var(--cbar-brand);color:#fff;font-size:13px;font-weight:700}
.pc-cmp.pinned .unpin{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-10px -2px -10px 0;background:none;border:0;font:inherit;font-size:24px;line-height:1;color:var(--cbar-ink);cursor:pointer}
/* the chip and the Comparar box share one row, so the plan's name has the card's whole width (a name
   that ends in its ID, "Giveback H5619-146", was being split mid-ID beside the box) */
.pc-top.mprow{align-items:center;margin-bottom:4px}

/* ── T-096 round 4 d (AB 2026-10-15 23:30, with a screenshot of the staging compare) ───────────
   "cuando alguien dice muéstreme plan details, show THIS level of info. No more." The plan screen
   is now the comparison's own open level for one plan: three groups, the same rows in the same
   order, label over value, and nothing collapsed underneath. This supersedes T-091's cost strip on
   this screen -- the strip is what the CARD shows, and the card is still right above it. */
.dsec{display:flex;align-items:center;background:#f3f5f7;font-size:13px;letter-spacing:.03em;font-weight:600;color:#1e2a32;padding:8px 14px;margin:0 -14px;border-top:1px solid #e5e9ec;border-bottom:1px solid #e5e9ec}

.dcall svg{width:18px;height:18px;flex:0 0 18px;margin-top:1px;fill:none;stroke:var(--cbar-brand);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── T-078 (AB 2026-10-15, round 8 final): the share sheet ─────────────────────────────────────
   Pixel spec: TODO-en-uno-v9 section 3. Five channels, no note box and no name field — people write
   their own message in WhatsApp. The icons are the shapes a 70-year-old already recognises on their
   home screen, at the size their thumb expects. */
.shbg{position:fixed;inset:0;background:rgba(0,20,40,.45);z-index:60}
/* T-098: inside the host page's iframe "fixed" means the whole frame, so the sheet opened a
   thousand pixels below the fold. With the page's viewport reported to us, both the dimming
   and the sheet are placed absolutely over the part of the frame that is actually on screen. */
#shwrap.vp .shbg{position:absolute;inset:auto 0 auto 0}

.chb{display:flex;align-items:center;gap:12px;border:1.5px solid #e3e7ea;border-radius:12px;padding:0 14px;font:inherit;font-size:17px;font-weight:600;color:#1e2a32;height:56px;background:#fff;cursor:pointer;text-align:left;width:100%}

.ci{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 36px}

   lines run beside them and then on under them at full width, so no empty strip is left below the icons
   once the text is taller. A column (not a row) keeps the lines beside them long: 28+ characters at a
   320 frame: in a narrow frame the icons and the box's side padding shrink rather than the lines. */

@media(max-width:319px){body.in-iframe.cmpv .widget-body{padding-left:6px;padding-right:6px}.sug{padding-left:8px;padding-right:8px}.sug .ci2 span{width:20px;height:20px}.sug .ci2 svg{width:12px;height:12px}.sug .ci2{margin-right:6px}}
.sgc{display:block;width:fit-content;margin:5px auto 0;background:var(--cbar-brand);color:#fff;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px}

});

// Generic experiment step runner: inserts experiment steps after health, before nextFn

function _runExperiments(nextFn){
  const EXP_REGISTRY={
    'drug-names':'expDrugNames'
  };
  for(const expId of _activeExps){
    const fnName=EXP_REGISTRY[expId]||('exp_'+expId.replace(/-/g,'_'));

}

let _medigapData = null;
function loadMedigapData(){
  if(_medigapData) return Promise.resolve(_medigapData);
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'data/medigap_all.js';
    s.onload = () => {
      if(typeof MEDIGAP_ALL_DATA !== 'undefined'){
        _medigapData = MEDIGAP_ALL_DATA;
        resolve(_medigapData);
      } else { _medigapData = {}; resolve({}); }
    };
    s.onerror = () => { _medigapData = {}; resolve({}); }; // graceful fallback
    document.head.appendChild(s);
  });
}

// Convert Medigap plan type to widget-compatible plan objects
function medigapToWidgetPlans(stateData){
  if(!stateData || !stateData.plans) return [];
  const result = [];
  stateData.plans.forEach(plan => {
    // Create one widget entry per plan letter (showing cheapest carrier)
    const letter = plan.type.replace('HIGH_','High-');
    const cheapest = plan.policies.length > 0 ? plan.policies.reduce((a,b) => a.min < b.min ? a : b) : null;
    result.push({
      id: 'medigap-' + plan.type + '-' + stateData.state,
      name: 'Medigap Plan ' + letter,
      carrier: cheapest ? cheapest.co.split('(')[0].trim() : 'Multiple carriers',
      premium: plan.premium_min,
      ded: 0,
      moop: 0,
      dental: null,
      vision: null,
      hearing: null,
      fitness: 0,
      otc: 0,
      drug: 'N/A',
      giveback: 0,
      rating: null, ratingNA: null, ratingLow: false,   // Medigap has no CMS star rating
      type: 'Medigap',
      _medigap: true,
      _premiumRange: '$' + Math.round(plan.premium_min) + '-$' + Math.round(plan.premium_max) + '/mo',
      _pmin: plan.premium_min, _pmax: plan.premium_max,
      _carrierCount: plan.policies.length,
      _planLetter: letter
    });
  });
  return result;
}

let _rep=null,_repTried=false;

/* ── T-104 (1) (AB 2026-10-18): plan names in proper case ─────────────────────────────────────────────
   747 of the 6,373 plans in the 2027 files are named in capitals (740 of them Devoted: "DEVOTED CORE 034 IA
   (HMO)"). A name that is ALL capitals is set in proper case ONCE, as the plan file loads (cmsToWidget, and
   loadCms2026 for the 2026 names the Mi plan de hoy search shows), so every surface that prints p.name --
   list, plan screen, Comparar, the cards, the shared page and its PDF, the lead's plan text -- reads the
   same. A name with any lower-case letter is the carrier's own casing and is left exactly as it is. The
   plan ID is a different field and is never touched.
     kept upper: plan types, Medicare acronyms, roman numerals, a state code after the plan number
                 ("034 IA"), and a word with no vowel (QMB, PHP), which is an acronym
     kept lower: of, and, de, y (never the first word)
     brand casing: the carriers' own, matched without regard to case */
const PN_UP=new Set(['HMO','PPO','POS','SNP','D-SNP','C-SNP','I-SNP','PDP','MA','MAPD','HMO-POS','PFFS','MSA','QMB','AARP','SCAN']);
const PN_LOW=new Set(['of','and','de','y']);
const PN_BRAND={'UNITEDHEALTHCARE':'UnitedHealthcare','AARP':'AARP','SCAN':'SCAN','ANTHEM':'Anthem','AETNA':'Aetna','HUMANA':'Humana',
  'WELLCARE':'Wellcare','UHC':'UHC','KAISER':'Kaiser','PERMANENTE':'Permanente','BLUE':'Blue','SHIELD':'Shield','MOLINA':'Molina','MEDI-CAL':'Medi-Cal'};
const PN_ROMAN=new Set(['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX']);
const PN_STATES=new Set('AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA PR RI SC SD TN TX UT VT VA WA WV WI WY'.split(' '));
function properName(s){
  s=String(s==null?'':s);
  if(!/[A-Z]/.test(s)||s!==s.toUpperCase()) return s;
  let prev='', first=true;
  return s.split(/(\s+|[()\/,])/).map(tok=>{
    if(!tok||/^\s+$/.test(tok)||/^[()\/,]$/.test(tok)) return tok;
    const U=tok, letters=U.replace(/[^A-Z]/g,'');
    let o;
    if(!letters) o=U;
    else if(PN_BRAND[U]) o=PN_BRAND[U];
    else if(PN_UP.has(U)||PN_ROMAN.has(U)) o=U;
    else if(PN_STATES.has(U)&&/^\d+$/.test(prev)) o=U;
    else if(!first&&PN_LOW.has(U.toLowerCase())) o=U.toLowerCase();
    else if(letters.length>=2&&!/[AEIOUY]/.test(letters)) o=U;
    else o=U.split('-').map(w=>w.charAt(0)+w.slice(1).toLowerCase()).join('-');
    prev=U; first=false;
    return o;
  }).join('');
}

    ...T052_KEYS.reduce((o,k)=>{o[k]=p[k]===undefined?null:p[k];return o;},{}),
    dbt: p.dbt||null,
    drug: p.drug?'Included':'N/A',
    rating: (typeof p.stars==='number' && p.stars>0) ? p.stars : null,
    ratingNA: p.starsna||null,       // 'new' / 'few': CMS's own reason there is no rating
    ratingLow: !!p.starslow,         // CMS low-performing contract

// Load one state's 2027 plan file. JSON via fetch, not an injected script tag: the old
// `const CMS_STATE_DATA` threw "already declared" on the second state, so a retry with a ZIP
// in a different state silently kept the first state's plans.
let _planCache={};
function loadPlanData(stateCode){
  if(_planCache[stateCode]) return Promise.resolve(_planCache[stateCode]);
  // cache:'no-cache' = ask the server every time whether the file changed (a cheap 304 when it has
  // not). /data/* is served with max-age=86400, and a browser holding an older plan file showed
  // "Sin información" on every card for a day after the 2026-10-02 data rebuild (found 2026-10-03).
  return fetch('data/plans_'+stateCode+'_'+PLAN_FILE_YEAR+'.json',{cache:'no-cache'})
    .then(r=>{
      // Cloudflare serves the homepage with a 200 for unknown paths: non-JSON means missing.
      const ct=(r.headers.get('content-type')||'');
      if(!r.ok||ct.indexOf('json')===-1) throw new Error('no plan file for '+stateCode);
      return r.json();
    })
    .then(j=>{_planCache[stateCode]=j;return j;});
}
// Load ZIP index (small file, maps ZIP to state code)
let _zipIndex = null;
function loadZipIndex(){
  if(_zipIndex) return Promise.resolve(_zipIndex);
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'data/zip_index.js';
    s.onload = () => {
      if(typeof ZIP_INDEX !== 'undefined'){
        _zipIndex = ZIP_INDEX;
        resolve(_zipIndex);
      } else reject(new Error('ZIP index not found'));
    };
    s.onerror = () => reject(new Error('Failed to load ZIP index'));
    document.head.appendChild(s);
  });
}

// Main: look up plans for a ZIP code
async function loadPlansForZip(zip){
  try {
    const idx = await loadZipIndex();
    const state = idx[zip];
    if(!state) { D._zipValid=false; PLANS=[]; wEvt('widget_error',{step:'zip',reason:'unknown_zip'}); return; }
    const [data] = await Promise.all([loadPlanData(state), loadRepresented()]);
    const county = data.zips?.[zip];
    if(!county) { D._zipValid=false; PLANS=[]; wEvt('widget_error',{step:'zip',reason:'no_county'}); return; }
    D.county = county;
    D.state = state;
    D._zipValid = true;
    if(_gaStartZip!==zip){ _gaStartZip=zip; wEvt('widget_start',{step:'zip'}); }
    _planMeta = {year:data.year, source:data.source||''};
    // This county's plans + plans sold statewide (PDPs), deduped
    const ids = [...(data.counties?.[county]||[]), ...(data.counties?.[data.statewide||'All Counties']||[])];
    const seen = new Set();
    const raw = ids.filter(i=>{ if(seen.has(i)) return false; seen.add(i); return true; }).map(i=>data.plans[i]);
    // Neutral default order: lowest monthly premium (no scoring, no "best" labels). The
    // visitor can re-sort. Plans CMS gave no premium for go last.
    PLANS = sortPlans(raw.map(p => cmsToWidget(p, state)), 'premium');

    // Medigap / Supplement plans (state-level data, Medicare.gov, March 2026, labelled as such)
    try {
      const mgData = await loadMedigapData();
      if(mgData[state]){
        PLANS = PLANS.concat(medigapToWidgetPlans(mgData[state]));
      }
    } catch(e2){ console.warn('Medigap data merge skipped:', e2.message); }
  } catch(e) {
    console.warn('Plan data load failed:', e.message);
    PLANS=[]; wEvt('widget_error',{step:'load',reason:'plan_data'});
  }
}

/* ── T-093 (AB 2026-10-15): "why does the browser back button never work?" ──────────────────────
   Because the finder never told the browser it had moved. Every screen past the first now adds one
   history entry, so Back walks the finder one screen at a time and only leaves the page from the
   first screen. The widget's own "‹ Volver" goes through the same door -- it asks the browser to go
   back and lets popstate do the rendering -- so the two can never disagree and a tap on Volver
   cannot leave a stale entry behind that swallows the next Back press.
   This works inside the iframe as well: an entry an iframe pushes joins the page's own session
   history, which is what the browser's Back button walks, and pushState with no URL argument
   changes no address. Where pushState is refused (a sandboxed frame), _hPush stays 0 and Back
   behaves exactly as it did before this ticket. */
let _hPush=0, _popping=false, _afterBack=null, _onDetail=false;
function go(fn){
  document.body.classList.remove('q3','res','cmpv');
  hist.push(fn);_plansView=false;_planScreen=false;_act=null;_onDetail=false;fn();viewMsg();cbarReport();
  // the first screen gets no entry of its own: Back from there leaves the page, as it should
  if(hist.length>1){ try{ history.pushState({bmw:hist.length},''); _hPush++; }catch(e){} }
  if(window.self!==window.top)window.parent.postMessage({type:'widget-scrolltop'},'*');
}
function back(){
  if(hist.length<=1) return;
  // not already inside a pop, and we have an entry to give back: let the browser drive
  if(!_popping&&_hPush>0){ history.back(); return; }
  _doBack();
}
function _doBack(){
  document.body.classList.remove('q3','res','cmpv');
  // T-075 + T-093: leaving a plan screen lands on the card it was opened from, whether the visitor
  // tapped "‹ Volver a los planes" or pressed the browser's own Back button.
  if(_onDetail&&!_afterBack) _afterBack=_scrollToCard;
  _onDetail=false;
  hist.pop();_plansView=false;_planScreen=false;_act=null;hist[hist.length-1]();viewMsg();cbarReport();
  // T-103 (2): back onto the "Mi plan de hoy" cards (from Comparar, a plan screen, the list or the search)
  // lands on the cards at the top of the widget, never on the page footer the taller screen left behind.
  // The search and the question before it are the same flow, so Volver onto them lands at the top too.
  if(document.getElementById('mpres')||document.getElementById('mpin')||document.querySelector('#wb .q3opt')) _afterBack=_toWidgetTop;
  if(_afterBack){const f=_afterBack;_afterBack=null;try{f();}catch(e){}}
}
/* T-103 (2), the T-075 method: the host scrolls (the page, not this frame, is what scrolls) and gets the
   widget's real height in the same message, so the frame is grown before the jump and nothing clamps it.
   Offset 0 = the top of the widget. Opened on its own, the widget scrolls its own window. */
function _toWidgetTop(){
  if(window.self===window.top){ try{ window.scrollTo(0,0); }catch(e){} return; }
  const wrap=document.querySelector('.widget-wrap');
  window.parent.postMessage({type:'widget-scrollto',top:0,height:Math.round(wrap?wrap.offsetHeight:0)},'*');
}
window.addEventListener('popstate',function(){
  if(_hPush>0) _hPush--;
  if(hist.length<=1){_afterBack=null;return;}   // nothing of ours left: the browser leaves the page
  _popping=true; try{ _doBack(); } finally { _popping=false; }
});

   phone; English is longer, so where it does not fit the type steps down half a pixel at a time, never
   below 16px. Below that (a 320 phone) the question takes its own line under Volver at full size, and
   only shrinks if even that line is too short. Measured, not guessed: the Open Sans webfont can land
   after the first draw, so this runs again when fonts are ready and whenever the frame changes width. */
function fitQ3(){
  const top=document.querySelector('#wb .q3top'), q=top&&top.querySelector('.q3q'); if(!q) return;
  top.classList.remove('q3wrap'); q.style.fontSize='';
  const over=()=>q.scrollWidth>q.clientWidth+0.5;
  let fs=parseFloat(getComputedStyle(q).fontSize);
  while(over()&&fs>16){ fs-=0.5; q.style.fontSize=fs+'px'; }
  if(!over()) return;
  top.classList.add('q3wrap'); q.style.fontSize='';
  fs=parseFloat(getComputedStyle(q).fontSize);

// No scoring and no "Your Result / Lowest Cost / Added Benefits / High Rating" labels (T-017,
// PROTECT 2026-10-02): ranking plans for a person from their answers is advice that needs a
// licensed agent and a Scope of Appointment. The public list is the same for everyone in the
// county, in a neutral order the visitor chooses.
// T-088 (AB 2026-10-15) does not change that. The visitor picks ONE criterion by name on the
// previous screen ("Pagar $0 de prima"), the list is put in that order and nothing else, the sort
// bar says which criterion it used, and any filter it switched on is named and comes off in one
// tap. No plan carries a label, no two criteria are blended into a score, and no plan is called
// best or recommended. It is the same sort menu the visitor could reach here, answered earlier.
// Card, results and compare follow the mockups AB approved for staging on 2026-10-02:
// DECIDE/now/2026-10-02_widget-2027-card-mockup.html, ..._results-mockup.html,
// ..._missing-and-compare-mockup.html (T-017 b2-b13).
function orderedPlans(){ return sortPlans(filterByType(PLANS), _sortMode); }

/* NO WIDOWS (AB's standing rule): join the last two words of a label, a name or a value with a
   non-breaking space, so a line can never end up holding one word on its own. Only from three
   words up -- gluing a two-word label would make it unbreakable and push the column sideways,
   which is worse than the widow. Markup is left alone: a string with a tag in it is skipped. */
function nbLast(x){
  // T-103: a plan ID inside a name ("Giveback H5619-146") never splits at its hyphen, which left "146" alone
  const t=String(x==null?'':x).replace(/\b([A-Z]\d{4})-(\d{3})\b/g,'$1‑$2');
  if(/[<>]/.test(t)){
    /* T-104: a value with markup in it ("hasta <b>$500 al año</b>, ambos oídos") gets the same rule on its
       TEXT: the last space outside any tag becomes non-breaking. A tag is never touched. */
    if(t.replace(/<[^>]*>/g,' ').trim().split(/\s+/).length<3) return t;
    let inTag=false;
    for(let i=t.length-1;i>0;i--){
      const c=t[i];
      if(c==='>'){inTag=true;continue;} if(c==='<'){inTag=false;continue;} if(inTag) continue;
      if(c===' '){ const after=t.slice(i+1).replace(/<[^>]*>/g,''); if(/\S/.test(after)) return t.slice(0,i)+'\u00a0'+t.slice(i+1); }
    }
    return t;
  }
  const w=t.trim().split(/\s+/);
  if(w.length<3) return t;
  return t.replace(/\s+(\S+)\s*$/, '\u00a0$1');
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const L=(en,es)=>lang==='en'?en:es;
function planYear(){return (_planMeta&&_planMeta.year)||PLAN_FILE_YEAR;}
function usd(v,cents){
  if(v===null||v===undefined) return null;
  const o=cents?{minimumFractionDigits:2,maximumFractionDigits:2}:{maximumFractionDigits:2};
  return (v<0?'-$':'$')+Math.abs(v).toLocaleString('en-US',o);
}
// Monthly premium: "$0" when zero, otherwise to the cent ("$45.00"), as CMS publishes it.
function premUsd(v){return v===null||v===undefined?null:(v===0?'$0':usd(v,true));}
// CMS cost strings from the plan file ("$1495", "$0-$100", "$10 / 20%"): thousands separators,
// ranges in words. Escaped first; the strings come from a public CMS file.
function money(s){
  if(s===null||s===undefined||s==='') return null;
  return esc(s).replace(/\d{4,}(?:\.\d+)?/g,m=>{const p=m.split('.');return p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',')+(p[1]?'.'+p[1]:'');})
    .replace(/(\$[\d,.]+|[\d.]+%)-(\$[\d,.]+|[\d.]+%)/g,(_,a,b)=>a+L(' to ',' a ')+b);
}
function isZero(s){return s==='$0'||s==='$0.00'||s==='0%';}
const NOINC=()=>L('Not included','No incluido');
function noInfo(){return L('No information','Sin información');}
const OPTX=()=>L('Optional, extra premium','Opcional, con prima adicional');
const PERW={mo:['a month','al mes'],'3mo':['every 3 months','cada 3 meses'],'6mo':['every 6 months','cada 6 meses'],
  yr:['a year','al año'],'2y':['every 2 years','cada 2 años'],'3y':['every 3 years','cada 3 años']};
const PERS={mo:['/mo','/mes'],'3mo':['/3 mo','/3 meses'],'6mo':['/6 mo','/6 meses'],yr:['/yr','/año'],'2y':['/2 yrs','/2 años'],'3y':['/3 yrs','/3 años']};
function perw(p){const w=PERW[p];return w?' '+L(w[0],w[1]):'';}
// A dollar maximum CMS publishes, always with its period: "up to $150 a year". No amount -> null, never a guess.
function upTo(a,bold){if(!a||a.amt==null) return null;const v=usd(a.amt)+perw(a.per);return L('up to ','hasta ')+(bold===false?v:'<b>'+v+'</b>');}
const EAR={per:[' per ear',' por oído'],both:[', both ears',', ambos oídos'],one:[', one ear',', un oído']};
function ear(e){const w=EAR[e];return w?L(w[0],w[1]):'';}

// CMS Overall Star Rating (T-053). CMS published the 2027 ratings on 2026-10-08, in data tables of
// their own; the landscape file the rest of the card is built from was cut before that and leaves the
// star column blank, which is why this line read "aun no publicada" while Medicare.gov already showed
// stars. A plan with no rating now says WHICH of CMS's two reasons applies rather than implying the
// whole year is unpublished. Never carry 2026 stars onto a 2027 plan.
const STARNA={'new':['Too new to be rated','Plan nuevo, sin calificación'],
              'few':['Not enough data to rate','Sin calificación suficiente']};
function rStar(p){
  if(p.rating===null||p.rating===undefined){
    const w=STARNA[p.ratingNA];
    return w?L(w[0],w[1]):L('CMS rating: not published','Calificación CMS: no publicada');
  }
  return '★ '+p.rating+L(' of 5 (CMS ',' de 5 (CMS ')+planYear()+')';
}
// CMS lists a contract as low-performing after three years under 3 stars, and Medicare.gov then drops
// the number and shows a warning in its place. We show both: hiding the number would be less than
// Medicare.gov gives, and showing it alone would be less than Medicare.gov warns.
function rLow(p){
  if(!p.ratingLow) return '';
  return `<div class="pc-low">${L('Medicare has rated this plan below 3 stars three years in a row.',
    'Medicare ha calificado este plan por debajo de 3 estrellas tres años seguidos.')}</div>`;
}
// T-086 (3) asked for this line "Spanish fully Spanish". Its frame always was; the source string the
// CMS data file carries was not — "data last updated" and "released" came through in English on the
// Spanish site. CMS's own file names are proper nouns and stay exactly as they are; only those two
// connectives are translated, so no fact, date or name changes.
function srcText(src){
  return lang==='en'?src:String(src).replace(/data last updated/gi,'datos actualizados el').replace(/released/gi,'publicado el');
}
function provenanceNote(){
  if(!_planMeta||!_planMeta.year) return '';
  const y=_planMeta.year, src=srcText(_planMeta.source||'CMS');
  return L(`Plan year ${y} costs and benefits. Source: ${src}. Costs may vary; your plan documents are the final word.`,
           `Costos y beneficios del año del plan ${y}. Fuente: ${src}. Los costos pueden variar; los documentos de su plan son la palabra final.`);
}
// 42 CFR 422.2267(e)(33): wherever Star Ratings appear, say Medicare rates plans yearly on a 5-star system.
// Missing from T-053 star ratings (live 2026-10-14 13:04); added with T-060 (7207816) at 22:10. T-069 rolls
// production back past T-060, so the line is carried across by hand: the stars are on the cards either way,
// and the rollback must not re-open a CMS disclosure gap. The T-060 sort is NOT carried; only this.
function starDiscHTML(){
  if(!PLANS.some(p=>!p._medigap&&p.rating!=null)) return '';
  return `<p class="sdisc">${nbLast(L('Every year, Medicare evaluates plans based on a 5-star rating system.','Cada a\u00F1o, Medicare eval\u00faa los planes seg\u00fan un sistema de calificaci\u00f3n de 5 estrellas.'))}</p>`;
}

// ---- benefit text, ES + EN. CMS PBP category names, one fixed translation (T-017 b4) ----
function hospText(h,short){
  if(!h) return null;
  let s;
  if(h.mc) s=L('Same as Original Medicare','Igual que Medicare Original');
  else if(h.days){
    const nz=h.days.filter(d=>!isZero(d[0])), z=nz.length<h.days.length;
    if(!nz.length) s=short?'$0':'<b>$0</b> '+L('per stay','por estadía');
    else if(short) s=nz.map(d=>`${money(d[0])}${L('/day','/día')}, ${L('days','días')} ${d[1]}-${d[2]}`).join(' · ');
    else s=nz.map(d=>`<b>${money(d[0])} ${L('per day','por día')}</b>, ${L('days','días')} ${d[1]} ${L('to','a')} ${d[2]}`).join(' · ')+(z?` · <b>$0</b> ${L('other days','los demás días')}`:'');
  } else if(h.stay) s=short?(isZero(h.stay)?'$0':money(h.stay)+' '+L('per stay','por estadía')):`<b>${money(h.stay)}</b> ${L('per stay','por estadía')}`;
  else return null;
  if(h.vary) s+=' '+L('(varies by hospital)','(varía según el hospital)');
  return s;
}
function tripsText(tr,short){
  if(tr===false) return null;          // not offered
  if(!tr) return undefined;            // unknown
  if(tr.unl) return L('Unlimited trips','Viajes ilimitados');

  const kind=tr.tt==='round'?L(one?'round trip':'round trips',one?'viaje de ida y vuelta':'viajes de ida y vuelta')
                            :L(one?'one-way trip':'one-way trips',one?'viaje de ida':'viajes de ida');
  return '<b>'+tr.n+' '+kind+perw(tr.per)+'</b>';
}
// Each returns {t:text, off:bool} or null when the plan file has no record (shown as "No information").
function dentalB(p,short){
  const d=p.dent; if(!d) return null;
  if(!d.prev&&!d.comp) return {t:p.dental==='optional'?OPTX():NOINC(),off:true};
  if(short) return {t:d.prev&&d.comp?L('Preventive and comprehensive','Preventivo e integral'):(d.prev?L('Preventive','Preventivo'):L('Comprehensive','Integral')),off:false};
  if(d.prev&&d.comp&&!d.pmax&&!d.cmax) return {t:L('Preventive and comprehensive dental','Dental preventivo e integral'),off:false};
  const parts=[];
  if(d.prev) parts.push(L('Preventive dental','Dental preventivo')+(d.pmax?' '+upTo(d.pmax):''));
  if(d.comp) parts.push(L('Comprehensive dental','Dental integral')+(d.cmax?' '+upTo(d.cmax):''));
  return {t:parts.join(' · '),off:false};
}
function visionB(p,short){
  const v=p.vis; if(!v) return null;
  if(!v.exam&&!v.wear) return {t:p.vision==='optional'?OPTX():NOINC(),off:true};
  if(short) return v.wear?{t:v.wmax?usd(v.wmax.amt)+perw(v.wmax.per):L('Included','Incluidos'),off:false}:{t:NOINC(),off:true};
  const ex=v.exam?L('Routine eye exam','Examen de la vista de rutina')+' '+(v.exam_cs?'<b>'+money(v.exam_cs)+'</b>':L('included','incluido'))
                 :L('Routine eye exam: not included','Examen de la vista de rutina: no incluido');
  const ew=v.wear?(v.wmax?L('Eyewear','Anteojos')+' '+upTo(v.wmax):L('Eyewear included','Anteojos incluidos'))
                 :L('Eyewear: not included','Anteojos: no incluidos');
  return {t:ex+' · '+ew,off:false};
}
function hearingB(p,short){
  const h=p.hear; if(!h) return null;
  if(!h.exam&&!h.aids) return {t:p.hearing==='optional'?OPTX():NOINC(),off:true};
  const aid=h.amax?upTo(h.amax,!short)+ear(h.amax.ear):(h.acopay?(short?money(h.acopay):'<b>'+money(h.acopay)+'</b>'+L(' per aid',' por audífono')):null);
  if(short) return h.aids?{t:(aid||L('Included','Incluidos'))+(h.amax&&h.acopay?' + '+L('copay ','copago ')+money(h.acopay):''),off:false}:{t:NOINC(),off:true};
  const ex=h.exam?L('Routine hearing exam','Examen de audición de rutina')+' '+(h.exam_cs?'<b>'+money(h.exam_cs)+'</b>':L('included','incluido'))
                 :L('Routine hearing exam: not included','Examen de audición de rutina: no incluido');
  // Allowance AND a per-aid copay: show both, never only the allowance (it would understate the cost).
  const both=h.amax&&h.acopay?' · '+L('copay','copago')+' <b>'+money(h.acopay)+'</b>'+L(' per aid',' por audífono'):'';
  const ai=h.aids?L('Hearing aids','Audífonos')+' '+(aid||L('included','incluidos'))+both:L('Hearing aids: not included','Audífonos: no incluidos');
  return {t:ex+' · '+ai,off:false};

function otcB(p,short){

  return {t:o.optional?OPTX():NOINC(),off:true};
}
function fitB(p){

}

// Back from a plan screen returns to the list AND to the card the visitor opened, not to the top (T-075).

// 260 and 600ms). So we hand the host the card's offset and let it scroll, via 'widget-scrollto'.
// The height goes WITH the offset on purpose. At this moment the frame is still the short plan screen's
// height -- the ResizeObserver's 'widget-resize' has not been delivered, and the host animates height over
// 0.3s when it is -- so the page is not yet tall enough to scroll that far. One message carrying both lets

// ---- lead context: which plans the visitor saw, and whether we represent each (T-017 b8, e) ----
// ── T-074 (AB 2026-10-14): the card header says what kind of plan it is in a pill, and prints the
// official plan ID on its own line. The "Plan 2027" chip is gone: the year is already in the results

// baseType strips the SNP suffix CMS writes into the type ("HMO C-SNP" -> "HMO").
function baseType(p){return String(p.type||'').replace(/\s*[CDI]-SNP\s*/g,'').trim();}

// Strip a trailing parenthetical when EVERY word in it is already said by the pills.
// "Blue Shield Value Advantage Plan (HMO)" -> "...Plan"  ·  "X (HMO D-SNP)" -> "X"
// A parenthetical with anything else stays. DISPLAY ONLY: p.name is what goes to the sheet,
// the lead payload, D.selectedPlan and the agent email.
const _TYPEWORDS=['HMO','PPO','POS','HMO-POS','PFFS','MSA','SNP','C-SNP','D-SNP','I-SNP','LOCAL','REGIONAL'];
/* T-094 (AB 2026-10-15): "do these need the word Plan in them? I want to clean all views."
   Three display-only rules, in order. The official CMS name is untouched everywhere it has to be
   exact -- the data, the lead payload, D.selectedPlan, the agent email and the PDF all keep p.name.
     1. the type in brackets goes (T-074, unchanged below);
     2. a trailing "Plan" goes: "Blue Shield Value Advantage Plan" -> "Blue Shield Value Advantage";
     3. in the compare header ONLY, where the carrier is already printed above the name in its own
        colour, the leading words that repeat it go: "Imperial Dynamic" under IMPERIAL -> "Dynamic".
   Nothing is ever cut below two words, and nothing is cut at all if it would leave two plans in the
   county reading the same. The plan ID line is on every card, header and column, so a plan stays
   identifiable whatever its name is shortened to. */
function dispName(p){
  const n=String(p.name||''), m=n.match(/^(.*?)\s*\(([^()]+)\)\s*$/);
  let base=n;
  if(m){
    const words=m[2].trim().toUpperCase().split(/[\s/]+/).filter(Boolean);
    if(words.length&&words.every(w=>_TYPEWORDS.indexOf(w)>=0)) base=m[1].trim();
  }
  return keep2(base.replace(/\s+Plan\s*$/i,'').trim(), base);

// Never leave fewer than two words: "Dynamic" alone is a word, "Imperial Dynamic" is a plan.
function keep2(short,full){return short.split(/\s+/).filter(Boolean).length>=2?short:full;}
/* The carrier, short enough to sit above a one-third-wide column. CMS keeps the legal name
   ("Imperial Health Plan of California, Inc."); the corporate tail is what a visitor skips. */
const _CARR_CUT=/[\s,]*(Inc\.?|LLC|Life Insurance Company|Mutual Automobile Insurance Company|Insurance Company|Healthcare of California|Health Plan of California|Health Plan|Partnership Plan|Advantage Plan|of California|Medicare|Health)$/i;
/* T-096 round 4 h: CMS writes "Champion Heath Plan" for H6170. We show the name correctly and do
   not touch the CMS file -- the plan ID, which is what identifies it, is unchanged. */
const CARRIER_FIX={'Champion Heath Plan':'Champion Health Plan'};
function carrierName(c){return CARRIER_FIX[String(c||'').trim()]||c;}
function carrierShort(c){
  c=carrierName(c);

  while(t!==prev&&t.split(/\s+/).length>1){prev=t;t=t.replace(_CARR_CUT,'').replace(/[\s,]+$/,'').trim();}

}
// Does the plan's own name already say who sells it? Then the eyebrow line above it is the same
// words twice, and the carrier colour stripe still tells the cards apart (AB: "less is more").
function sameCarrier(p){

}
/* Compare header only. The repeat to remove is the longest run of leading words the plan name and
   the carrier's own name share, word for word -- "Alignment Health Plan" + "Alignment Health BRIDGE
   003" share two, so the column reads "BRIDGE 003", not "Health BRIDGE 003". Then we give words back
   one at a time until at least two are left, which is how "Aetna Medicare Prime" under AETNA comes
   out as "Medicare Prime" rather than a bare "Prime". */
function _words(x){return String(x||'').trim().split(/\s+/).filter(Boolean);}
/* The repeat to remove is the longest run of leading words the plan name shares with the carrier's
   own name -- "Alignment Health Plan" + "Alignment Health BRIDGE 003" share two, so the column
   reads "BRIDGE 003", not "Health BRIDGE 003". "Medicare" is never counted as one of the carrier's
   words: it is the product, not the brand, which is why "Aetna Medicare Prime" under AETNA comes
   out as "Medicare Prime" and not a bare "Prime". One word is allowed here and only here, because
   the carrier is printed directly above it in its own colour; the cards, which no longer carry that
   line, keep the two-word floor. */

  const id=planIdRaw(p), cut=n=>{const w=_words(n);return w.length>2&&w[w.length-1].toUpperCase()===id.toUpperCase()?w.slice(0,-1).join(' '):n;};
  const full=cut(dispName(p)), short=cut(_cmpCut(p));

function planLeadTag(p){return `${p.name} [${p.id}] represented: ${p._medigap?'n/a (Medigap)':(p.rep?'yes':'no')}`;}

// ── FILTER PILLS (b14) ── one pill selected at a time. "Todos" = every plan that is not a
// special-needs plan (LA County: 70 = 64 HMO incl. HMO-POS + 6 PPO). Special-needs plans appear
// only under their own pill. Drug-only plans (PDP) and Medigap get their own pill, shown only
// where the ZIP has them, so a visitor looking for one can still find it.
let _typeFilter='all';
function isSNP(p){return !p._medigap&&(p.cat==='SNP'||!!p.snp||/SNP/.test(p.type||''));}
function isPDP(p){return !p._medigap&&p.cat==='PDP';}
