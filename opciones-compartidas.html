/* ── T-105 (AB 2026-10-18 13:05, APPROVED): pixel spec DECIDE/now/2026-10-18_compartido-menos-es-mas/

*{box-sizing:border-box}
body{margin:0;font-family:"Open Sans",Arial,sans-serif;color:#002147;background:#fff}
p,div,span{text-wrap:pretty}
.nw{white-space:nowrap}
.sheet{max-width:760px;margin:0 auto;padding:12px 12px 24px}
/* top card */
.card{background:#F0F3F6;border:1px solid #dbe2e9;border-radius:14px;padding:14px 16px;margin:0 0 12px}
.logo a{display:inline-block;text-decoration:none;padding:6px 0;margin:-6px 0;min-height:44px}

.agent{display:flex;gap:12px;align-items:center;margin-top:12px}

.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700;color:#007B7B;text-transform:uppercase}
.nm{font-size:19px;font-weight:700;white-space:nowrap;color:#002147}
.role{font-size:14px;color:#445;margin-top:2px}
/* the blue band: one line, one date */
.band{border-radius:14px;background:linear-gradient(100deg,#002147,#007B7B);color:#fff;padding:14px 16px;margin:0 0 12px}
.band h1{margin:0;font-size:19.5px;line-height:1.25;font-weight:700}
.band h1 span.z{font-weight:400;opacity:.85}

.placepill b{font-weight:700}
.chiprow{display:flex;gap:10px;align-items:center;margin-top:10px}
.chip{background:#FFD54F;color:#002147;border-radius:8px;padding:4px 10px;font-weight:600;font-size:14px;white-space:nowrap}
.chip b{font-weight:700}

.cmpw{font-family:"Open Sans",-apple-system,sans-serif;font-size:16px;color:#1e2a3b}

.box .two{display:flex;gap:12px;align-items:center}
.box .two>div,.agent>div{min-width:0}
.box .q{font-weight:700;font-size:18px;line-height:1.3}
.box .nm{margin-top:4px}
.lnk{color:#007B7B;text-decoration:underline;text-underline-offset:2px;font-size:13.5px}
a.t44{display:inline-block;padding:13px 2px;margin:-13px -2px}
.box .sig{display:none}

.disc{font-size:13px;line-height:1.5;color:#66727c;margin:9px 2px 9px}
.disc a{color:#007B7B;text-decoration:underline;text-underline-offset:2px}
.err{max-width:640px;margin:60px auto;padding:0 20px;text-align:center;font-size:17px;line-height:1.5;color:#1E2A3B}
.err a{color:#007B7B;font-weight:700}
.loading{max-width:640px;margin:80px auto;text-align:center;color:#5b6670;font-size:16px}
/* the bar at the bottom of a phone: Llamar + WhatsApp */

@media (max-width:600px){
  .sheet{padding:12px 12px 96px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dbe2e9;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:10px;z-index:5}

  .box .sig a{color:#007B7B}
  .bar{display:none!important}
  .disc{font-size:11.5px;margin-top:4px}
}

<body>
<div id="out"><p class="loading">Cargando sus opciones…</p></div>
<iframe id="src" title="" aria-hidden="true" style="position:absolute;width:1px;height:1px;left:-9999px;border:0"></iframe>
<script>
/* ── T-078 · the shared sheet ──────────────────────────────────────────────────────────────────
   The link carries everything: ?zip=90230&p=H0504-056,H5496-012,H0523-085&lang=en&r=cost&hoy=H0504-056
   Nothing is stored on a server, so a link cannot rot and nothing about the sender is kept.

   T-105 (AB 2026-10-18): the comparison itself comes from the plan finder, loaded in a hidden frame with
   ?data=1 (no UI, no GA4) and asked to RENDER these plan IDs: it answers with the markup its own Comparar
   screen is made of (read-only), the stylesheet that styles it, and the code of its two toggles. So this
   page shows exactly what the sender saw, and the CMS mapping, the layout and the behaviour all live in
   ONE file. On medicare-california the frame is loaded from beneficiosmedicare, where the plan data
   lives, and the reply is origin-checked at both ends. */
(function(){
  var seg = location.pathname.split('/').filter(Boolean);   // ["opciones","90230","H0504-056",...]
  var q   = new URLSearchParams(location.search);
  var ZIP = seg[1] || q.get('zip') || '';
  var OKID = function(x){return /^[A-Z0-9-]{4,}$/i.test(x);};
  var IDS = seg.slice(2).filter(OKID);
  if (!IDS.length && q.get('p')) IDS = q.get('p').split(',').filter(OKID);
  var EN  = q.get('lang') === 'en';
  var PRI = q.get('r') || '';
  var HOY = OKID(q.get('hoy') || '') ? q.get('hoy') : '';
  var PRINT = q.get('print') === '1';
  document.documentElement.lang = EN ? 'en' : 'es';
  if (EN) { var ld = document.querySelector('.loading'); if (ld) ld.textContent = 'Loading your options…'; }

  var T = {
    opts:   EN ? 'options for 2027' : 'opciones 2027',
    adv:    EN ? 'YOUR AGENT' : 'SU ASESORA',   // T-102: + ' · LIC. #…' only when the agent has one on file
    role:   EN ? 'Medicare agent' : 'Agente de Medicare',
    before: EN ? 'Choose before <b>Dec 7</b>' : 'Elija antes del <b>7 de dic.</b>',
    q:      EN ? 'Questions? I answer today.' : '¿Tiene preguntas? Le respondo hoy.',
    textme: EN ? 'Text me' : 'Escríbame',
    callb:  EN ? 'Call' : 'Llamar',
    cw:     EN ? 'Call or text: ' : 'Llamada o texto: ',
    pageT:  EN ? 'Medicare options for 2027' : 'Opciones de Medicare 2027',
    // FIX (AB 2026-10-20): the my-plan single-id share is not "N opciones" (bad grammar at N=1 anyway) --
    // it's the one thing this link actually shows, in the words NOW.md's T-103 amendment already chose.
    mpTitle: EN ? 'What changes in your plan in 2027' : 'Lo que cambia en su plan en 2027',
    subj:   EN ? 'My 2027 plan comparison' : 'Mi comparación de planes 2027',
    /* PROTECT: these lines are required and are not ours to shorten. The first is the TPMO disclaimer,
       word for word as the shared sheet has carried it since T-078; unchanged by T-105. Medicare.gov and
       the phone number in it are links. */
    disc: EN
      ? 'We do not offer every plan available in your area. Contact Medicare.gov, 1-800-MEDICARE (1-800-633-4227) or your State Health Insurance Assistance Program (SHIP) for information on all of your options. Every year, Medicare evaluates plans based on a 5-star rating system. We are not connected with or endorsed by the U.S. government or the federal Medicare program. Data: CMS 2027.'
      : 'No ofrecemos todos los planes disponibles en su área. Comuníquese con Medicare.gov, 1-800-MEDICARE (1-800-633-4227) o su Programa Estatal de Asistencia sobre Seguros de Salud (SHIP) para obtener información sobre todas sus opciones. Cada año, Medicare evalúa los planes según un sistema de calificación de 5 estrellas. No estamos conectados ni respaldados por el gobierno de EE.UU. ni por el programa federal de Medicare. Datos: CMS 2027.',
    sent: EN ? 'Sent on ' : 'Enviado el '
  };

  /* T-102: who is on the page follows the ZIP's state. The widget owns the one state->agent map and
     sends the agent with the plans (d.agent); this is only the fallback for the error screen, which is
     drawn before any state is known. */
  var AGENT = {key:'alejandra', name:'Alejandra Brizuela', tel:'(310) 597-9142', digits:'13105979142',
               email:'Alejandra@BeneficiosMedicare.com', photo:'images/alejandra-headshot.jpg', lic:'4507923'};
  function useAgent(a){
    if (!a || !/^1\d{10}$/.test(String(a.digits || '')) || !/^images\/[a-z-]+\.jpg$/.test(String(a.photo || ''))) return;
    AGENT = {key:String(a.key || ''), name:String(a.name || ''), tel:String(a.tel || ''), digits:String(a.digits),
             email:String(a.email || ''), photo:String(a.photo), lic:/^\d+$/.test(String(a.lic || '')) ? String(a.lic) : ''};
  }
  // (913) 488-5341 with a non-breaking space and hyphen: it never splits. The href is +1 and digits.
  function tel(a){ return String(a.tel).replace(') ', ') ').replace('-', '‑'); }
  function telH(a){ return 'tel:+' + a.digits; }
  function first(a){ return String(a.name).split(' ')[0]; }
  // 12:55: WhatsApp on the agent's own number with a prefilled hello in the page's language
  function waH(a){ return 'https://wa.me/' + a.digits + '?text=' + encodeURIComponent(EN ? 'Hi ' + first(a) + ', I saw my comparison' : 'Hola ' + first(a) + ', vi mi comparación'); }
  function mailH(a){ return 'mailto:' + a.email + '?subject=' + encodeURIComponent(T.subj); }
  // T-105 (8) AMENDMENT 14:50: the bottom box's one action is a text message, not email or a bare
  // number (the sticky bar already has Llamar and WhatsApp for those).
  function smsH(a){ return 'sms:+' + a.digits + '?&body=' + encodeURIComponent(EN ? 'Hi, I saw my comparison' : 'Hola, vi mi comparación'); }
  var esc = function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};

  // T-138: the one place-display helper pair (same as widget-v4.html's). City comes from the
  // widget's own postMessage data (d.city); no city found -> plain ZIP, today's words.
  function placeText(zip, city){ return city ? (city + ' ' + zip) : ('ZIP ' + zip); }
  function placePill(zip, city){
    var z = esc(zip || '');
    var pin = '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 22s-7.5-6.4-7.5-12A7.5 7.5 0 0 1 19.5 10c0 5.6-7.5 12-7.5 12z" fill="#007B7B"/><path d="M8.6 10.2l2.4 2.4 4.4-4.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    return '<span class="placepill">' + pin + (city ? ('<b>' + esc(city) + '</b> ' + z) : ('<b>' + z + '</b>')) + '</span>';
  }

  function fail(){
    var A = AGENT;
    document.getElementById('out').innerHTML =
      '<div class="err"><p>' + (EN
        ? 'We could not open these options. The link may be incomplete.'
        : 'No pudimos abrir estas opciones. El enlace puede estar incompleto.') +
      '</p><p><a class="t44" href="/' + (EN ? 'en' : '') + '">' + (EN ? 'Find plans for your ZIP code' : 'Busque planes para su código postal') +
      '</a></p><p>' + esc(T.cw) + '<a class="t44" data-cta="shared_call" href="' + telH(A) + '">' + tel(A) + '</a></p></div>';
  }
  // FIX (AB 2026-10-20): the my-plan card's own "Compartir" always sends exactly ONE id (its
  // 2026-vs-2027 "what changes" view, never a comparison) with hoy= that same id -- this page used to
  // require 2+ ids unconditionally, so every one of those links landed here and failed. A single id is
  // now allowed in that one specific shape; any other single-id link (hoy missing or not matching) is
  // still incomplete and still fails, same as before.
  var MP_SINGLE = IDS.length === 1 && !!HOY && HOY === IDS[0];
  if (!/^\d{5}$/.test(ZIP) || (IDS.length < 2 && !MP_SINGLE)) { fail(); return; }

  // The frame is the plan finder with its UI switched off. On medicare-california it is loaded from
  // beneficiosmedicare, where the CMS files live; everywhere else it is this same site.
  var WIDGET_HOST = (location.hostname.indexOf('medicare-california') > -1)
    ? (location.hostname.indexOf('.pages.dev') > -1
        ? 'https://' + location.hostname.replace('medicare-california', 'beneficiosmedicare')
        : 'https://beneficiosmedicare.com')
    : location.origin;
  var frame = document.getElementById('src');
  var rid = String(Math.random()).slice(2);
  var done = false;
  var timer = setTimeout(function(){ if (!done) fail(); }, 15000);

  window.addEventListener('message', function(e){
    if (e.origin !== WIDGET_HOST) return;
    var d = e.data;
    if (!d || d.type !== 'widget-plans-result' || d.rid !== rid) return;
    done = true; clearTimeout(timer);
    if (!d.ok || !d.html || !d.css || !d.fns) { fail(); return; }
    try { render(d); } catch (err) { fail(); }
  });
  frame.addEventListener('load', function(){
    try {
      frame.contentWindow.postMessage({type:'widget-plans', rid:rid, zip:ZIP, ids:IDS, r:PRI, hoy:HOY, render:true}, WIDGET_HOST);
    } catch (err) { fail(); }
  });
  frame.src = WIDGET_HOST + '/widget-v4.html?data=1&lang=' + (EN ? 'en' : 'es');

  /* The widget's own toggles, from the widget itself (same origin-checked reply). Its event helper
     reports to this page's GA4 under the same event names. */
  function install(fns){
    window.wEvt = function(n, o){ if (typeof gtag === 'function') gtag('event', n, Object.assign({page:'shared'}, o || {})); };
    window.cmpDiff = (new Function('return ' + fns.cmpDiff))();
    window.cmpGrp  = (new Function('return ' + fns.cmpGrp))();
  }
  // A shadow root holding a part of the comparison, with the widget's stylesheet (its :root variables
  // become :host) and the print rules: no toggle on paper, no shadow, no row split across pages. The
  // star sentence is already in this page's own disclaimer, word for word, so it is not said twice.
  function part(host, css, html){
    var root = host.attachShadow({mode:'open'});
    root.innerHTML = '<style>' + css.replace(/:root\b/g, ':host') +
      ':host{display:block}.sdisc{display:none}' +
      '@media print{.cmptog,.diffline{display:none!important}.cmp{box-shadow:none!important;border:1px solid #e5e9ec}tr{break-inside:avoid}.sug{break-inside:avoid;padding:8px 12px}' +
      '.cmp tr.lr td{padding:4px 8px 0;font-size:12.5px}.cmp tr.vr td{padding:0 6px 4px;font-size:14px}.cmp tr.grp td{padding:4px 10px}.cmp thead th{padding:4px 6px}' +
      '.cmp thead th .nm2,.cmp thead th .pid{min-height:0}.pd-fine{margin-top:8px;padding-top:6px}.pd-fine p{font-size:11.5px;margin-bottom:4px}}</style>' + html;
    // links in the comparison that leave the site open in a new tab; phones are the agent's: tracked
    [].forEach.call(root.querySelectorAll('a[href^="http"]'), function(a){ a.target = '_blank'; a.rel = 'noopener'; });
    [].forEach.call(root.querySelectorAll('a[href^="tel:"]'), function(a){ a.setAttribute('data-cta', 'shared_call'); a.removeAttribute('onclick'); });
    return root;
  }
  function discHTML(){
    return esc(T.disc)
      .replace('Medicare.gov', '<a class="t44" href="https://www.medicare.gov' + (EN ? '' : '/es') + '" target="_blank" rel="noopener">Medicare.gov</a>')
      .replace('1-800-MEDICARE (1-800-633-4227)', '<a class="t44" href="tel:+18006334227">1-800-MEDICARE (1-800-633-4227)</a>');
  }

  function render(d){
    useAgent(d.agent);
    install(d.fns);
    var A = AGENT, adv = T.adv + (A.lic ? ' · LIC. #' + A.lic : '');
    var n = (d.names || []).length || IDS.length;
    var mpOne = MP_SINGLE && n === 1;
    var when = new Date().toLocaleDateString(EN ? 'en-US' : 'es-ES', {day:'numeric', month:'short', year:'numeric'});
    var siteURL = 'https://beneficiosmedicare.com/' + (EN ? 'en' : '');
    var photo = IMGBASE + esc(A.photo);
    // T-138: the place (city, never county), never the bare ZIP, same as everywhere else a ZIP shows.
    var place = placeText(ZIP, d.city);
    document.title = (mpOne ? T.mpTitle : n + ' ' + (EN ? 'Medicare options for 2027' : 'opciones de Medicare 2027')) + ' · ' + place + ' | Beneficios Medicare';

    document.getElementById('out').innerHTML =
      '<div class="sheet">' +
        /* T-107 (3-REPLACES T-105's top card): plans first -- the top keeps only the brand logo and
           the band; the agent moves to the ONE card at the bottom, above the fine print. The link
           preview already shows the agent's face before the page even opens. */
        '<div class="card logo-only">' +
          '<div class="logo"><a href="' + siteURL + '" target="_blank" rel="noopener" aria-label="BeneficiosMedicare.com">' + LOGO + '</a></div>' +
        '</div>' +
        '<div class="band"><h1><span class="nw">' + (mpOne ? esc(T.mpTitle) : n + ' ' + esc(T.opts)) + '</span> <span class="z nw">' + placePill(ZIP, d.city) + '</span></h1>' +
          '<div class="chiprow"><span class="chip">' + T.before + '</span></div></div>' +
        '<div class="cmpw" id="cmpA"></div>' +
        '<div class="box" data-agent="' + esc(A.key) + '"><div class="two">' +
          '<img class="ph-img" src="' + photo + '" alt="' + esc(A.name) + '" width="72" height="72">' +
          '<div><div class="q">' + esc(T.q) + '</div><div class="nm">' + esc(A.name) + '</div>' +
          '<a class="lnk t44" data-cta="shared_call" href="' + esc(smsH(A)) + '">' + esc(T.textme) + ' ›</a>' +
